<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms & Shit | Rooftop Gym</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg-creme: #f0f0f0;
            --tree-creme: #d0d0d0;
            --color-theater: #FF3366;
            --color-lobby: #E2FF3D;
            --color-station: #8A2BE2;
            --color-gym: #FF6B00; 
            --black-outline: #09090B;
            --white-ui: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
            overflow: hidden; 
            color: var(--black-outline);
            user-select: none;
        }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .ui-panel {
            pointer-events: auto; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            border: 6px solid var(--black-outline); box-shadow: 8px 8px 0px var(--black-outline);
            padding: 16px; position: absolute; box-sizing: border-box;
        }

        .header-panel { top: 24px; left: 24px; display: flex; align-items: center; gap: 16px; }
        .header-title { font-family: 'Alfa Slab One', cursive; font-size: 1.4rem; letter-spacing: 1px; margin: 0; }

        .ui-btn {
            font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1rem; text-transform: uppercase;
            background: var(--white-ui); border: 4px solid var(--black-outline); box-shadow: 4px 4px 0px var(--black-outline);
            cursor: pointer; padding: 10px 16px; transition: transform 0.05s linear, box-shadow 0.05s linear;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .ui-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--black-outline); }
        .ui-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--black-outline); }
        .ui-btn.primary { background: var(--color-gym); color: #FFFFFF; }

        .controls-panel { top: 24px; right: 24px; width: 260px; }
        .controls-panel h3 { font-family: 'Alfa Slab One', cursive; font-size: 1rem; margin: 0 0 10px 0; color: var(--color-gym); }
        .control-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; }
        .control-key { background: #E4E4E7; border: 2px solid var(--black-outline); border-radius: 4px; padding: 2px 6px; box-shadow: 1px 1px 0px var(--black-outline); font-family: monospace; font-weight: 900; }

        #chat-log-panel {
            position: absolute; bottom: 262px; left: 24px; width: 380px; height: 200px;
            display: flex; flex-direction: column; box-sizing: border-box; background: rgba(255, 255, 255, 0.85);
            border: 6px solid var(--black-outline); box-shadow: 8px 8px 0px var(--black-outline); padding: 12px; z-index: 10;
        }
        #chat-log-list { flex-grow: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 700; }
        .chat-msg { line-height: 1.4; word-break: break-word; }
        .chat-msg-system { color: var(--color-gym); font-style: italic; }

        .chat-panel { bottom: 24px; left: 24px; width: 380px; display: flex; gap: 12px; }
        .chat-input { flex-grow: 1; border: 4px solid var(--black-outline); padding: 10px 12px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.9rem; outline: none; background: #FFFFFF; }

        .emotions-panel { position: absolute; bottom: 24px; right: 24px; display: flex; gap: 8px; }
        .emotion-btn { width: 50px; height: 50px; font-size: 1.4rem; display: flex; justify-content: center; align-items: center; padding: 0; }

        #cam-mode-indicator {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%); background: var(--color-gym);
            border: 3px solid var(--black-outline); box-shadow: 3px 3px 0px var(--black-outline); padding: 6px 12px;
            font-family: 'Inter', sans-serif; font-weight: 900; font-size: 0.8rem; color: #FFFFFF; pointer-events: none; z-index: 40; text-transform: uppercase;
        }

        #fade-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #FFFFFF; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; }
        #fade-overlay.visible { opacity: 1; pointer-events: auto; }

        #customization-overlay, #pause-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 200;
            display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease, visibility 0.5s;
        }
        .hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }

        .custom-card { background: var(--white-ui); border: 6px solid var(--black-outline); box-shadow: 12px 12px 0px var(--black-outline); padding: 32px; width: 380px; max-width: 90%; display: flex; flex-direction: column; gap: 20px; pointer-events: auto; }
        .custom-title { font-family: 'Alfa Slab One', cursive; font-size: 1.8rem; margin: 0; text-align: center; color: var(--color-gym); }
        .custom-field { display: flex; flex-direction: column; gap: 8px; }
        .custom-field label { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; }
        input[type="text"] { border: 4px solid var(--black-outline); padding: 12px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 1.1rem; outline: none; background: #FFFFFF; }

        .color-options { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .color-btn { aspect-ratio: 1; border: 4px solid var(--black-outline); cursor: pointer; box-shadow: 2px 2px 0px var(--black-outline); transition: transform 0.05s, box-shadow 0.05s; }
        .color-btn.active { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px var(--black-outline); outline: none; }

        input[type="range"] { -webkit-appearance: none; width: 100%; height: 12px; background: #f0f0f0; border: 4px solid var(--black-outline); }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--color-gym); border: 4px solid var(--black-outline); cursor: pointer; }

        .mobile-menu-drawer { display: none; }
        #mobile-joystick-container, #mobile-actions-container { display: none; }

        #workout-prompt {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--color-gym); color: #FFFFFF;
            padding: 8px 16px; border: 4px solid var(--black-outline); box-shadow: 4px 4px 0px var(--black-outline);
            font-family: 'Alfa Slab One', cursive; font-size: 1.1rem; pointer-events: none; z-index: 50; display: none; text-transform: uppercase;
        }

        .mat-label {
            position: absolute; transform: translate(-50%, -100%); color: #FFFFFF; font-family: 'Alfa Slab One', cursive; font-size: 1.1rem; text-transform: uppercase; text-shadow: 2px 2px 0px #000; pointer-events: none; z-index: 45;
        }
    </style>
</head>
<body>

    <div id="fade-overlay"></div>

    <div id="customization-overlay">
        <div class="custom-card">
            <h2 class="custom-title">CONCRETE GYM</h2>
            <div class="custom-field">
                <label>YOUR NAME</label>
                <input type="text" id="custom-name-input" value="Lifter" maxlength="15" />
            </div>
            <div class="custom-field">
                <label>CHOOSE COLOR</label>
                <div class="color-options">
                    <button class="color-btn active" data-color="#E2FF3D" style="background-color: #E2FF3D;"></button>
                    <button class="color-btn" data-color="#FF3366" style="background-color: #FF3366;"></button>
                    <button class="color-btn" data-color="#8A2BE2" style="background-color: #8A2BE2;"></button>
                    <button class="color-btn" data-color="#33ccff" style="background-color: #33ccff;"></button>
                    <button class="color-btn" data-color="#33ff33" style="background-color: #33ff33;"></button>
                    <button class="color-btn" data-color="#ff9933" style="background-color: #ff9933;"></button>
                    <button class="color-btn" data-color="#ff33ff" style="background-color: #ff33ff;"></button>
                    <button class="color-btn" data-color="#ffff33" style="background-color: #ffff33;"></button>
                    <button class="color-btn" data-color="#33ffff" style="background-color: #33ffff;"></button>
                    <button class="color-btn" data-color="#ff3333" style="background-color: #ff3333;"></button>
                    <button class="color-btn" data-color="#996633" style="background-color: #996633;"></button>
                    <button class="color-btn" data-color="#ffffff" style="background-color: #ffffff;"></button>
                </div>
            </div>
            <button id="start-gym-btn" class="ui-btn primary" style="width: 100%; justify-content: center; font-size: 1.2rem; margin-top: 12px;">START WORKOUT</button>
        </div>
    </div>

    <div id="pause-overlay" class="hidden">
        <div class="custom-card">
            <h2 class="custom-title">PAUSED</h2>
            <div class="custom-field"><label>CUSTOMIZE NAME</label><input type="text" id="pause-name-input" /></div>
            <div class="custom-field">
                <label>CHOOSE COLOR</label>
                <div class="color-options" id="pause-color-options">
                    </div>
            </div>
            <button id="resume-btn" class="ui-btn primary" style="width: 100%; justify-content: center; font-size: 1.2rem;">RESUME</button>
        </div>
    </div>

    <div class="ui-layer">
        <div class="ui-panel header-panel">
            <button id="back-btn" class="ui-btn"><i class="fa-solid fa-arrow-left"></i> Map</button>
            <button id="pause-btn" class="ui-btn"><i class="fa-solid fa-pause"></i> Pause</button>
            <h1 class="header-title">THE CONCRETE GYM</h1>
        </div>

        <div id="cam-mode-indicator">📽 THIRD PERSON — Press V for First Person</div>
        <div id="workout-prompt">Press E to Workout</div>

        <div id="chat-log-panel"><ul id="chat-log-list"></ul></div>

        <div class="ui-panel controls-panel" style="width: 320px;">
            <h3>GYM CONTROLS</h3>
            <div class="control-row"><span>Move</span><span class="control-key">WASD</span></div>
            <div class="control-row"><span>Jump</span><span class="control-key">Space</span></div>
            <div class="control-row"><span>Workout</span><span class="control-key">E</span></div>
            <div class="control-row"><span>Cam Mode</span><span class="control-key">V</span></div>
        </div>

        <div class="ui-panel chat-panel">
            <input type="text" id="chat-input" class="chat-input" placeholder="Say something..." maxlength="80" autocomplete="off" />
            <button id="chat-send-btn" class="ui-btn primary"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <div class="ui-panel emotions-panel">
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('happy')">💪</button>
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('love')">❤️</button>
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('sad')">🥵</button>
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('angry')">🔥</button>
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('shocked')">😲</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="character.js"></script>

    <script>
        const loader = new THREE.GLTFLoader();
        const clock = new THREE.Clock();
        const scene = new THREE.Scene();
        
        // SUNSET LIGHTING AND CITY FOG
        scene.background = new THREE.Color(0xff5522); 
        scene.fog = new THREE.FogExp2(0xff5522, 0.015);

        const aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.PerspectiveCamera(90, aspect, 0.2, 300);
        camera.position.set(-15, 8, -15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableKeys = false;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 2.0;
        controls.maxDistance = 50.0;
        const cameraFocusTarget = new THREE.Vector3();

        const ambientLight = new THREE.AmbientLight(0x443333, 1.0);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffaa55, 1.0);
        dirLight.position.set(30, 20, -30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        scene.add(dirLight);

        // Constants
        const ROOFTOP_W = 35;
        const ROOFTOP_D = 25;
        const CHARACTER_SCALE = 2.0;
        const floorY = 0;

        // Materials
        const concreteMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.9, metalness: 0.1 });
        const railingMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6, metalness: 0.8 });
        const propMatDark = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        
        // --- Rooftop Base ---
        const roofFloor = new THREE.Mesh(new THREE.BoxGeometry(ROOFTOP_W, 0.5, ROOFTOP_D), concreteMat);
        roofFloor.position.y = -0.25;
        roofFloor.receiveShadow = true;
        scene.add(roofFloor);

        // --- Industrial Railings ---
        function createRailing() {
            const rGroup = new THREE.Group();
            const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.2);
            const barGeoW = new THREE.CylinderGeometry(0.04, 0.04, ROOFTOP_W);
            const barGeoD = new THREE.CylinderGeometry(0.04, 0.04, ROOFTOP_D);

            // Poles
            for(let x = -ROOFTOP_W/2; x <= ROOFTOP_W/2; x += 2.5) {
                const p1 = new THREE.Mesh(poleGeo, railingMat); p1.position.set(x, 0.6, -ROOFTOP_D/2); rGroup.add(p1);
                const p2 = new THREE.Mesh(poleGeo, railingMat); p2.position.set(x, 0.6, ROOFTOP_D/2); rGroup.add(p2);
            }
            for(let z = -ROOFTOP_D/2; z <= ROOFTOP_D/2; z += 2.5) {
                const p1 = new THREE.Mesh(poleGeo, railingMat); p1.position.set(-ROOFTOP_W/2, 0.6, z); rGroup.add(p1);
                const p2 = new THREE.Mesh(poleGeo, railingMat); p2.position.set(ROOFTOP_W/2, 0.6, z); rGroup.add(p2);
            }

            // Horizontal Bars
            [0.4, 1.1].forEach(y => {
                const bw1 = new THREE.Mesh(barGeoW, railingMat); bw1.rotation.z = Math.PI/2; bw1.position.set(0, y, -ROOFTOP_D/2); rGroup.add(bw1);
                const bw2 = new THREE.Mesh(barGeoW, railingMat); bw2.rotation.z = Math.PI/2; bw2.position.set(0, y, ROOFTOP_D/2); rGroup.add(bw2);
                const bd1 = new THREE.Mesh(barGeoD, railingMat); bd1.rotation.x = Math.PI/2; bd1.position.set(-ROOFTOP_W/2, y, 0); rGroup.add(bd1);
                const bd2 = new THREE.Mesh(barGeoD, railingMat); bd2.rotation.x = Math.PI/2; bd2.position.set(ROOFTOP_W/2, y, 0); rGroup.add(bd2);
            });
            scene.add(rGroup);
        }
        createRailing();

        // --- Dark City Silhouettes ---
        function createCity() {
            const cityGroup = new THREE.Group();
            const cityMat = new THREE.MeshStandardMaterial({color: 0x1a110d, roughness: 1.0, fog: true});
            for(let i=0; i<80; i++) {
                const bw = 4 + Math.random() * 8;
                const bh = 10 + Math.random() * 50;
                const bd = 4 + Math.random() * 8;
                const b = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), cityMat);
                // Keep away from center rooftop
                let bx = (Math.random()-0.5)*300;
                let bz = (Math.random()-0.5)*300;
                if (Math.abs(bx) < 30 && Math.abs(bz) < 30) bx += 40 * Math.sign(bx);
                b.position.set(bx, -bh/2 - 5, bz);
                cityGroup.add(b);
            }
            scene.add(cityGroup);
        }
        createCity();

        // --- Props ---
        // AC Units
        function createACUnit(x, z, rotY) {
            const group = new THREE.Group();
            const box = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 2), concreteMat);
            box.position.y = 1.25; box.castShadow = true;
            const fan = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.1, 16), propMatDark);
            fan.position.set(0, 2.55, 0);
            group.add(box, fan);
            group.position.set(x, 0, z);
            group.rotation.y = rotY;
            scene.add(group);
        }
        createACUnit(-12, -8, 0);
        createACUnit(-14, -8, 0);
        createACUnit(12, -9, Math.PI/4);

        // Vending Machines (Lore Tie-ins)
        function createVendingMachine(x, z, rotY, color, labelText) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.8, 1.2), new THREE.MeshStandardMaterial({color: color}));
            body.position.y = 1.4; body.castShadow = true;
            const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.5), new THREE.MeshBasicMaterial({color: 0xffffff, emissive: color, emissiveIntensity: 0.5}));
            screen.position.set(0, 1.8, 0.61);
            group.add(body, screen);
            group.position.set(x, 0, z);
            group.rotation.y = rotY;
            scene.add(group);
        }
        createVendingMachine(14, 8, -Math.PI/2, 0xa30000, "Kore Kinetics"); // Red
        createVendingMachine(14, 6.2, -Math.PI/2, 0x3399ff, "Clarity Water"); // Blue

        // Dumbbell Rack
        function createDumbbellRack(x, z, rotY) {
            const group = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({color: 0x111111});
            const rack = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 0.8), frameMat);
            rack.position.y = 0.6; rack.castShadow = true;
            group.add(rack);
            
            // Add 8lb Dumbbells
            for(let i=-1.5; i<=1.5; i+=0.8) {
                const db = new THREE.Group();
                const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.3), new THREE.MeshStandardMaterial({color: 0xaaaaaa}));
                bar.rotation.x = Math.PI/2;
                const w1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.1), propMatDark);
                w1.rotation.x = Math.PI/2; w1.position.z = -0.15;
                const w2 = w1.clone(); w2.position.z = 0.15;
                db.add(bar, w1, w2);
                db.position.set(i, 1.3, 0);
                group.add(db);
            }
            group.position.set(x, 0, z);
            group.rotation.y = rotY;
            scene.add(group);
        }
        createDumbbellRack(-2, 10, 0);

        // Punching Bag
        function createPunchingBag(x, z) {
            const group = new THREE.Group();
            const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3), propMatDark);
            stand.position.set(-1, 1.5, 0);
            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2), propMatDark);
            arm.rotation.z = Math.PI/2; arm.position.set(-0.4, 3, 0);
            const bag = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.2), new THREE.MeshStandardMaterial({color: 0x881111}));
            bag.position.set(0, 2.0, 0); bag.castShadow = true;
            group.add(stand, arm, bag);
            group.position.set(x, 0, z);
            scene.add(group);
        }
        createPunchingBag(-10, 8);

        // Boombox
        function createStaticBoombox(x, z) {
            const bb = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 0.4), propMatDark);
            bb.position.set(x, 0.3, z); bb.castShadow = true;
            scene.add(bb);
        }
        createStaticBoombox(-5, 10);

        // --- Yoga Mats & Exercises ---
        const workoutSpots = [];
        const labels = [];
        function createYogaMat(x, z, color, type, labelText) {
            const mat = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.05, 2.4), new THREE.MeshStandardMaterial({color}));
            mat.position.set(x, 0.025, z);
            mat.receiveShadow = true;
            scene.add(mat);
            workoutSpots.push({ x, z, type });

            const div = document.createElement('div');
            div.className = 'mat-label';
            div.textContent = labelText;
            document.body.appendChild(div);
            labels.push({ element: div, pos: new THREE.Vector3(x, 0.1, z) });
        }
        
        // Exact names matching the animations.json lowercase mapping
        createYogaMat(-8, 0, 0x33ccff, 'pushup', 'Pushups');
        createYogaMat(-4, 0, 0xff3366, 'squat', 'Squats');
        createYogaMat(0, 0, 0x33ff33, 'situp', 'Situps');
        createYogaMat(4, 0, 0x8A2BE2, 'plank', 'Faceplant / Plank');
        createYogaMat(8, 0, 0xffff33, 'jumpingjack', 'Jumping Jacks');


        // --- Player Logic ---
        let localPlayerId = 1;
        let chosenColor = '#E2FF3D';
        let isCustomizing = true, isPaused = false;
        let isFirstPerson = false, fpYaw = Math.PI, fpPitch = 0;

        const players = [
            { id: 1, name: 'Lifter', color: chosenColor, mesh: null, position: new THREE.Vector3(0,0,5), isJumping: false, yVelocity: 0, vx:0, vz:0, keys:{up:false,down:false,left:false,right:false,space:false,shift:false}, isCustomizing: true, isWorkingOut: false, workoutType: null },
        ];

        // --- MODELS & ANIMATIONS ---
        let charGltfMaster = null;
        let animationsMaster = [];

        async function loadModels() {
            const cacheBust = "?t=" + Date.now();
            try {
                const [gltf, animJson] = await Promise.all([
                    loader.loadAsync("model/character.gltf" + cacheBust),
                    fetch("animations.json" + cacheBust).then(r => r.json())
                ]);
                charGltfMaster = gltf;
                animationsMaster = animJson.map(a => {
                    const tracks = a.tracks.map(t => {
                        const nodeName = t.nodeName || (t.name ? t.name.split('.')[0] : 'unknown');
                        const property = t.property || (t.name ? t.name.split('.')[1] : 'position');
                        return new THREE.KeyframeTrack(nodeName + '.' + property, t.times, t.values);
                    });
                    return new THREE.AnimationClip(a.name, a.duration, tracks);
                });
                
                await setupLocalPlayer();
                animate();
            } catch (err) {
                console.error("Error loading gym models:", err);
            }
        }

        async function setupLocalPlayer() {
            const p = players[0];
            const mesh = charGltfMaster.scene.clone();
            mesh.scale.set(CHARACTER_SCALE, CHARACTER_SCALE, CHARACTER_SCALE);
            scene.add(mesh);
            p.mesh = mesh;
            p.mixer = new THREE.AnimationMixer(mesh);
            p.actions = {};
            
            // Map animation names to lowercase for easy lookup
            animationsMaster.forEach(clip => {
                p.actions[clip.name.toLowerCase()] = p.mixer.clipAction(clip);
            });
            
            mesh.traverse(o => {
                if (o.isMesh) {
                    o.castShadow = true; o.receiveShadow = true;
                    if (o.name.includes('Body') || o.name.includes('leg') || o.name.includes('Leg')) {
                        o.material = createToonMaterial(o.material.map, p.color);
                    }
                }
            });
            updatePlayerVisuals(p);
        }

        loadModels();

        function checkEnvironmentCollision(pos) {
            const r = 0.3;
            if (pos.x < -ROOFTOP_W/2 + r || pos.x > ROOFTOP_W/2 - r || pos.z < -ROOFTOP_D/2 + r || pos.z > ROOFTOP_D/2 - r) return true;
            return false;
        }

        function playAnim(p, name) {
            if (!p.actions || !p.actions[name]) return;
            if (p.currentAnim === name) return;
            if (p.currentAnim && p.actions[p.currentAnim]) p.actions[p.currentAnim].fadeOut(0.2);
            p.actions[name].reset().fadeIn(0.2).play();
            p.currentAnim = name;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            const localP = players[0];
            if (!localP.mesh || isCustomizing || isPaused) {
                if (localP.mixer) localP.mixer.update(delta);
                renderer.render(scene, camera);
                return;
            }

            // Movement
            if (!localP.isWorkingOut) {
                let dx = 0, dz = 0;
                if (localP.keys.up) dz -= 1;
                if (localP.keys.down) dz += 1;
                if (localP.keys.left) dx -= 1;
                if (localP.keys.right) dx += 1;

                if (dx !== 0 || dz !== 0) {
                    const camF = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion); camF.y = 0; camF.normalize();
                    const camR = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion); camR.y = 0; camR.normalize();
                    const moveDir = new THREE.Vector3().addScaledVector(camF, -dz).addScaledVector(camR, dx).normalize();
                    
                    const speed = localP.keys.shift ? 6.5 : 3.5;
                    const nextX = localP.mesh.position.clone(); nextX.x += moveDir.x * speed * delta;
                    if (!checkEnvironmentCollision(nextX)) localP.mesh.position.x = nextX.x;
                    const nextZ = localP.mesh.position.clone(); nextZ.z += moveDir.z * speed * delta;
                    if (!checkEnvironmentCollision(nextZ)) localP.mesh.position.z = nextZ.z;

                    const targetRot = Math.atan2(moveDir.x, moveDir.z) + Math.PI;
                    let diff = targetRot - localP.mesh.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    localP.mesh.rotation.y += diff * 0.15;
                }

                if (localP.keys.space && !localP.isJumping) {
                    localP.isJumping = true; localP.yVelocity = 6.0;
                }
                if (localP.isJumping) {
                    localP.yVelocity -= 18.0 * delta;
                    localP.mesh.position.y += localP.yVelocity * delta;
                    if (localP.mesh.position.y <= floorY) {
                        localP.mesh.position.y = floorY; localP.isJumping = false; localP.yVelocity = 0;
                    }
                } else {
                    localP.mesh.position.y = floorY;
                }
            }

            // Workout Check
            let nearSpot = null;
            workoutSpots.forEach(spot => {
                const dist = Math.hypot(localP.mesh.position.x - spot.x, localP.mesh.position.z - spot.z);
                if (dist < 1.2) nearSpot = spot;
            });

            const prompt = document.getElementById('workout-prompt');
            if (nearSpot && !localP.isWorkingOut) {
                prompt.style.display = 'block';
            } else {
                prompt.style.display = 'none';
            }

            // Animations
            if (localP.mixer) {
                localP.mixer.update(delta);
                const speed = (!localP.isWorkingOut) ? (localP.keys.up||localP.keys.down||localP.keys.left||localP.keys.right ? (localP.keys.shift ? 1 : 0.5) : 0) : 0;
                if (localP.isWorkingOut) {
                    playAnim(localP, localP.workoutType);
                } else if (localP.isJumping) {
                    playAnim(localP, 'jump');
                } else if (speed > 0.6) {
                    playAnim(localP, 'sprint');
                } else if (speed > 0.1) {
                    playAnim(localP, 'stomp');
                } else {
                    playAnim(localP, 'idle');
                }
            }

            // Update Labels
            labels.forEach(l => {
                const top = l.pos.clone();
                top.project(camera);
                const x = (top.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(top.y * 0.5) + 0.5) * window.innerHeight;
                // Only show if in front of camera
                if (top.z < 1) {
                    l.element.style.display = 'block';
                    l.element.style.left = `${x}px`;
                    l.element.style.top = `${y}px`;
                } else {
                    l.element.style.display = 'none';
                }
            });

            // Camera follow
            if (isFirstPerson) {
                const headPos = localP.mesh.position.clone().add(new THREE.Vector3(0, 1.4, 0));
                camera.position.copy(headPos);
                camera.quaternion.setFromEuler(new THREE.Euler(fpPitch, fpYaw, 0, 'YXZ'));
                controls.enabled = false;
            } else {
                controls.enabled = true;
                cameraFocusTarget.copy(localP.mesh.position);
                controls.target.lerp(cameraFocusTarget, 0.2);
                controls.update();
            }

            renderer.render(scene, camera);
        }

        // --- Event Listeners ---
        window.addEventListener('keydown', e => {
            const p = players[0];
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') p.keys.up = true;
            if (k === 's' || k === 'arrowdown') p.keys.down = true;
            if (k === 'a' || k === 'arrowleft') p.keys.left = true;
            if (k === 'd' || k === 'arrowright') p.keys.right = true;
            if (k === ' ') p.keys.space = true;
            if (e.shiftKey) p.keys.shift = true;
            
            if (k === 'e') {
                if (p.isWorkingOut) {
                    p.isWorkingOut = false;
                    p.workoutType = null;
                } else {
                    workoutSpots.forEach(spot => {
                        const dist = Math.hypot(p.mesh.position.x - spot.x, p.mesh.position.z - spot.z);
                        if (dist < 1.2) {
                            p.isWorkingOut = true;
                            p.workoutType = spot.type;
                            p.mesh.position.set(spot.x, floorY, spot.z);
                            // Face forward based on mat
                            p.mesh.rotation.y = Math.PI; 
                        }
                    });
                }
            }
            if (k === 'v') {
                isFirstPerson = !isFirstPerson;
                if (isFirstPerson) renderer.domElement.requestPointerLock();
                else document.exitPointerLock();
                p.mesh.visible = !isFirstPerson;
            }
            if (e.key === 'Escape') {
                isPaused = !isPaused;
                document.getElementById('pause-overlay').classList.toggle('hidden', !isPaused);
            }
        });

        window.addEventListener('keyup', e => {
            const p = players[0];
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') p.keys.up = false;
            if (k === 's' || k === 'arrowdown') p.keys.down = false;
            if (k === 'a' || k === 'arrowleft') p.keys.left = false;
            if (k === 'd' || k === 'arrowright') p.keys.right = false;
            if (k === ' ') p.keys.space = false;
            if (!e.shiftKey) p.keys.shift = false;
        });

        document.addEventListener('mousemove', e => {
            if (isFirstPerson && document.pointerLockElement === renderer.domElement) {
                fpYaw -= e.movementX * 0.002;
                fpPitch -= e.movementY * 0.002;
                fpPitch = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, fpPitch));
            }
        });

        document.getElementById('start-gym-btn').addEventListener('click', () => {
            isCustomizing = false;
            const p = players[0];
            p.color = chosenColor;
            updatePlayerVisuals(p);
            document.getElementById('customization-overlay').classList.add('hidden');
        });
        
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                chosenColor = btn.dataset.color;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            isPaused = false;
            document.getElementById('pause-overlay').classList.add('hidden');
        });

        document.getElementById('back-btn').addEventListener('click', () => window.location.href = 'index.html');
        
    </script>
</body>
