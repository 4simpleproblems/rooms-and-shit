<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms & Shit | Lobby</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg-creme: #F4F1E1;
            --tree-creme: #E8E4CE;
            --color-theater: #FF3366;
            --color-lobby: #E2FF3D;
            --color-music: #8A2BE2;
            --black-outline: #09090B;
            --white-ui: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-creme);
            font-family: 'Inter', sans-serif;
            overflow: hidden; 
            color: var(--black-outline);
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; 
        }

        .ui-panel {
            pointer-events: auto; 
            background: var(--white-ui);
            border: 6px solid var(--black-outline); 
            box-shadow: 8px 8px 0px var(--black-outline);
            border-radius: 0px; 
            padding: 16px;
            position: absolute;
        }

        .header-panel {
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            font-family: 'Alfa Slab One', cursive;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin: 0;
        }

        .ui-btn {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            text-align: center;
            text-transform: uppercase;
            background: var(--white-ui);
            border: 4px solid var(--black-outline); 
            border-radius: 0px; 
            box-shadow: 4px 4px 0px var(--black-outline);
            cursor: pointer;
            padding: 10px 16px;
            transition: transform 0.05s linear, box-shadow 0.05s linear;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .ui-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--black-outline);
        }

        .ui-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--black-outline);
        }

        .ui-btn.primary {
            background: var(--color-lobby);
        }

        .controls-panel {
            top: 24px;
            right: 24px;
            width: 260px;
        }

        .controls-panel h3 {
            font-family: 'Alfa Slab One', cursive;
            font-size: 1rem;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .control-key {
            background: #E4E4E7;
            border: 2px solid var(--black-outline);
            border-radius: 4px;
            padding: 2px 6px;
            box-shadow: 1px 1px 0px var(--black-outline);
            font-family: monospace;
            font-weight: 900;
        }

        .chat-panel {
            bottom: 24px;
            left: 24px;
            width: 380px;
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex-grow: 1;
            border: 4px solid var(--black-outline);
            padding: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            outline: none;
        }

        .emotions-panel {
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 8px;
        }

        .emotion-btn {
            width: 50px;
            height: 50px;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .neo-bubble {
            background: var(--white-ui);
            border: 4px solid var(--black-outline);
            box-shadow: 4px 4px 0px var(--black-outline);
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            position: absolute;
            transform: translate(-50%, -100%);
            pointer-events: none;
            z-index: 50;
        }

        .neo-bubble-arrow {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid var(--black-outline);
        }

        .neo-bubble-arrow::after {
            content: '';
            position: absolute;
            top: -12px;
            left: -6px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid var(--white-ui);
        }

        .neo-prompt {
            background: var(--color-lobby);
            border: 3px solid var(--black-outline);
            box-shadow: 3px 3px 0px var(--black-outline);
            padding: 6px 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 0.8rem;
            color: var(--black-outline);
            pointer-events: none;
            z-index: 40;
        }

        .key-cap {
            background: var(--white-ui);
            border: 2px solid var(--black-outline);
            padding: 1px 6px;
            border-radius: 3px;
            box-shadow: 1px 1px 0px var(--black-outline);
        }

        .emotion-particle {
            position: absolute;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 60;
            text-shadow: 2px 2px 0px var(--black-outline),
                        -2px -2px 0px var(--black-outline),
                        2px -2px 0px var(--black-outline),
                        -2px 2px 0px var(--black-outline);
            transform: translate(-50%, -50%);
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #FFFFFF; 
            z-index: 100; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 1.5s ease-in-out; 
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 40px;
            box-sizing: border-box;
        }

        #fade-overlay.visible {
            opacity: 1;
            pointer-events: auto; 
        }

        .fade-spinner {
            font-size: 3rem;
            color: var(--black-outline); 
            animation: fa-spin 2s linear infinite; 
        }


    </style>
</head>
<body>


    <div id="fade-overlay" class="visible">
        <i class="fa-solid fa-spinner fade-spinner"></i>
    </div>

    <div id="canvas-container"></div>

    <div id="chat-bubble-container" style="position: absolute; top: 0; left: 0; pointer-events: none; z-index: 50; width: 100%; height: 100%;">
        <div id="speech-bubble" class="neo-bubble" style="display: none; position: absolute;">
            <span id="speech-text"></span>
            <div class="neo-bubble-arrow"></div>
        </div>
    </div>

    <div class="ui-layer">
        <div class="ui-panel header-panel">
            <button id="back-btn" class="ui-btn"><i class="fa-solid fa-arrow-left"></i> Map</button>
            <h1 class="header-title">Lobby Room</h1>
        </div>

        <div class="ui-panel controls-panel" style="width: 320px;">
            <h3>Lobby Controls</h3>
            <div class="control-row">
                <span style="color:#09090B;">P1 (Yellow)</span>
                <span class="control-key">Arrows + Space</span>
            </div>
            <div class="control-row" style="margin-left: 20px;">
                <span>Explode</span>
                <span class="control-key">/ Key</span>
            </div>
            <div class="control-row">
                <span style="color:#FF3366;">P2 (Red)</span>
                <span class="control-key">WASD + Q</span>
            </div>
            <div class="control-row" style="margin-left: 20px;">
                <span>Explode</span>
                <span class="control-key">E Key</span>
            </div>
            <div class="control-row">
                <span style="color:#4444ff;">P3 (Blue)</span>
                <span class="control-key">TFGH + R</span>
            </div>
            <div class="control-row" style="margin-left: 20px;">
                <span>Explode</span>
                <span class="control-key">Y Key</span>
            </div>
        </div>

        <div class="ui-panel connection-panel" style="bottom: 104px; left: 24px; width: 380px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
            <h3 style="font-family: 'Alfa Slab One', cursive; font-size: 0.9rem; margin: 0; letter-spacing: 0.5px;">Online WebRTC Multiplayer</h3>
            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; font-weight: 700;">
                <span>My Room ID: <span id="my-peer-id-label" class="control-key" style="font-size: 0.85rem; background: var(--color-lobby);">Loading...</span></span>
                <button id="copy-id-btn" class="ui-btn" style="padding: 2px 6px; font-size: 0.7rem; box-shadow: 2px 2px 0px var(--black-outline);"><i class="fa-solid fa-copy"></i> Copy</button>
            </div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="join-peer-id-input" class="chat-input" placeholder="Enter Room ID to join..." style="font-size: 0.8rem; padding: 6px; flex-grow: 1;" />
                <button id="connect-btn" class="ui-btn primary" style="padding: 6px 10px; font-size: 0.8rem; box-shadow: 2px 2px 0px var(--black-outline);"><i class="fa-solid fa-link"></i> Join</button>
            </div>
            <div id="connection-status" style="font-size: 0.75rem; font-weight: 700; color: #555;">
                Status: Local Mode
            </div>
        </div>

        <div class="ui-panel chat-panel">
            <input type="text" id="chat-input" class="chat-input" placeholder="Say something in the lobby..." maxlength="50" autocomplete="off" />
            <button id="chat-send-btn" class="ui-btn primary"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

        <div class="ui-panel emotions-panel">
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('angry')">🔥</button>
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('love')">❤️</button>
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('happy')">😂</button>
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('sad')">😢</button>
            <button class="ui-btn emotion-btn" onclick="spawnEmotion('shocked')">❗</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

                        p.isJumping = data.isJumping;

                        for (const otherConn of connections) {
                            if (otherConn !== conn && otherConn.open) {

                            }
                        }
                    }
                } else if (data.type === 'explode') {
                    const id = remoteId || data.id;

        function getGroundY(playerId, pos) {
            const onPlatform = (pos.x >= -5.0 && pos.x <= 5.0 && pos.z >= -5.0 && pos.z <= 5.0);
            let groundY = onPlatform ? (floorY + 0.1) : -999.0;
            const charRadius = 0.08 * CHARACTER_SCALE;
            for (const other of players) {
                if (other.id === playerId || !other.mesh) continue;
                const dx = pos.x - other.mesh.position.x;
                const dz = pos.z - other.mesh.position.z;
                const distH = Math.sqrt(dx * dx + dz * dz);
                if (distH < charRadius * 1.8) {
                    const otherHeadY = other.mesh.position.y + 0.5 * CHARACTER_SCALE;
                    if (pos.y >= otherHeadY - 0.15) {
                        if (otherHeadY > groundY) {
                            groundY = otherHeadY;
                        }
                    }
                }
            }
            return groundY;
        }

        function checkPlayerCollision(playerId, nextPosition) {
            const charRadius = 0.08 * CHARACTER_SCALE;
            const charBox = new THREE.Box3(

                new THREE.Vector3(nextPosition.x + charRadius, nextPosition.y + 0.5 * CHARACTER_SCALE, nextPosition.z + charRadius)
            );
            
            for (const p of players) {
                if (p.id === playerId || !p.mesh) continue;
                const yDiff = Math.abs(nextPosition.y - p.mesh.position.y);
                if (yDiff > 0.45 * CHARACTER_SCALE) {
                    continue;
                }
                const otherRadius = 0.08 * CHARACTER_SCALE;
                const otherBox = new THREE.Box3(
                    new THREE.Vector3(p.mesh.position.x - otherRadius, p.mesh.position.y, p.mesh.position.z - otherRadius),
                    new THREE.Vector3(p.mesh.position.x + otherRadius, p.mesh.position.y + 0.5 * CHARACTER_SCALE, p.mesh.position.z + otherRadius)
                );
                if (charBox.intersectsBox(otherBox)) {
                    return true;
                }
            }
            return false;
        }

                const vx = Math.cos(angle) * speed;
                const vy = 2.0 + Math.random() * 7.0;
                const vz = Math.sin(angle) * speed;
                
                explosionParticles.push({
                    mesh: mesh,
                    vx: vx,
                    vy: vy,
                    vz: vz,
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.025
                });
            }
        }

        function createCloudPuff(x, y, z) {
            const colors = [0xffffff, 0xf0f0f0, 0xe0e0e0];
            for (let i = 0; i < 25; i++) {
                const geo = new THREE.DodecahedronGeometry(0.15 + Math.random() * 0.15, 1);
                const mat = new THREE.MeshLambertMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    transparent: true,
                    opacity: 0.9,
                    roughness: 0.9
                });
                const mesh = new THREE.Mesh(geo, mat);
                
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const dist = Math.random() * 0.4;
                mesh.position.set(
                    x + Math.sin(phi) * Math.cos(theta) * dist,
                    y + Math.sin(phi) * Math.sin(theta) * dist,
                    z + Math.cos(phi) * dist
                );
                scene.add(mesh);
                
                const vx = (Math.random() - 0.5) * 1.5;
                const vy = 0.5 + Math.random() * 1.5;
                const vz = (Math.random() - 0.5) * 1.5;
                
                explosionParticles.push({
                    mesh: mesh,
                    vx: vx,
                    vy: vy,
                    vz: vz,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.02
                });
            }
        }

        function triggerExplosion(playerId) {
            const p = players.find(x => x.id === playerId);
            if (!p || p.isRemote) return;
            triggerExplosionLocal(playerId);
            for (const conn of connections) {
                if (conn.open) conn.send({ type: 'explode', id: playerId });
            }
        }

        function triggerExplosionLocal(playerId) {
            const p = players.find(x => x.id === playerId);
            if (!p || !p.mesh) return;
            
            const expPos = p.mesh.position.clone();
            shakeIntensity = 0.9;
            createExplosion(expPos.x, expPos.y + 0.3, expPos.z);
            
            const explosionRadius = 4.5;
            for (const other of players) {
                if (other.id === playerId || !other.mesh) continue;
                
                const dist = other.mesh.position.distanceTo(expPos);
                if (dist < explosionRadius) {
                    const dir = new THREE.Vector3().subVectors(other.mesh.position, expPos);
                    dir.y = 0;
                    dir.normalize();
                    const force = (1.0 - dist / explosionRadius) * 14.0 + 4.0;
                    if (!other.isRemote) {
                        other.vx = dir.x * force;
                        other.vz = dir.z * force;
                        other.yVelocity = force * 0.8 + 4.0;
                        other.isJumping = true;
                    }
                }
            }
            
            const exploder = players.find(x => x.id === playerId);
            if (exploder && !exploder.isRemote) {
                respawnPlayer(playerId);
            }
        }

        function respawnPlayer(playerId) {
            const p = players.find(x => x.id === playerId);
            if (!p || p.isRemote) return;
            const rx = (Math.random() - 0.5) * 6.0;
            const rz = (Math.random() - 0.5) * 6.0;
            respawnPlayerLocal(playerId, rx, rz);
            for (const conn of connections) {
                if (conn.open) conn.send({ type: 'respawn', id: playerId, rx: rx, rz: rz });
            }
        }

        function respawnPlayerLocal(playerId, rx, rz) {
            const p = players.find(x => x.id === playerId);
            if (!p || !p.mesh) return;
            
            p.mesh.position.set(rx, floorY + 6.0, rz);
            p.yVelocity = 0;
            p.vx = 0;
            p.vz = 0;
            p.isJumping = true;
            
            createCloudPuff(rx, floorY + 0.1, rz);
        }

        const activeParticles = [];

        function spawnEmotion(type) {
            let iconClass = '';
            let color = '';
            let animClass = '';
            
            if (type === 'angry') {
                iconClass = 'fa-solid fa-bolt-lightning';
                color = '#FF3366';
                animClass = 'anim-angry';
            } else if (type === 'love') {
                iconClass = 'fa-solid fa-heart';
                color = '#FF3366';
                animClass = 'anim-love';
            } else if (type === 'happy') {
                iconClass = 'fa-solid fa-face-laugh-beam';
                color = '#E2FF3D';
                animClass = 'anim-happy';
            } else if (type === 'sad') {
                iconClass = 'fa-solid fa-cloud-showers-water';
                color = '#8A2BE2';
                animClass = 'anim-sad';
            } else if (type === 'shocked') {
                iconClass = 'fa-solid fa-exclamation';
                color = '#FF3366';
                animClass = 'anim-shocked';
            }
            
            const count = type === 'shocked' ? 1 : 4;
            for (let i = 0; i < count; i++) {
                createParticle(iconClass, color, animClass);
            }
        }

        function createParticle(iconClass, color, animClass) {
            const container = document.getElementById('chat-bubble-container');
            const particle = document.createElement('div');
            particle.className = `emotion-particle ${animClass}`;
            particle.style.color = color;
            particle.innerHTML = `<i class="${iconClass}"></i>`;
            
            const offsetX = (Math.random() - 0.5) * 45;
            const offsetY = -Math.random() * 25;
            
            container.appendChild(particle);
            
            activeParticles.push({
                element: particle,
                offsetX: offsetX,
                offsetY: offsetY,
                createdAt: Date.now(),
                duration: 1000 + Math.random() * 500
            });
        }

        let bubbleTimeout = null;
        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            input.blur();
            
            const bubble = document.getElementById('speech-bubble');
            const speechText = document.getElementById('speech-text');
            speechText.innerText = text;
            bubble.style.display = 'block';
            
            if (bubbleTimeout) clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(() => {
                bubble.style.display = 'none';
            }, 4000);
        }

        document.getElementById('chat-send-btn').addEventListener('click', sendChatMessage);
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        });

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('fade-overlay');
            overlay.classList.add('visible');
            setTimeout(() => {
                overlay.classList.remove('visible');
            }, 100);
        });

        document.getElementById('back-btn').addEventListener('click', () => {
            const overlay = document.getElementById('fade-overlay');
            overlay.classList.add('visible');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();

            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                const p = explosionParticles[i];
                p.mesh.position.x += p.vx * delta;
                p.mesh.position.y += p.vy * delta;
                p.mesh.position.z += p.vz * delta;
                p.vy -= 18.0 * delta;
                p.life -= p.decay;
                p.mesh.material.opacity = p.life;
                p.mesh.scale.set(p.life, p.life, p.life);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    p.mesh.geometry.dispose();
                    p.mesh.material.dispose();
                    explosionParticles.splice(i, 1);
                }
            }

            for (const p of players) {
                if (!p.mesh) continue;

                if (p.isRemote) continue;

                let moveX = 0;
                let moveZ = 0;
                if (p.id === 1) {
                    if (p.keys.up) moveZ -= 1;
                    if (p.keys.down) moveZ += 1;
                    if (p.keys.left) moveX -= 1;
                    if (p.keys.right) moveX += 1;
                } else if (p.id === 2) {
                    if (p.keys.w) moveZ -= 1;
                    if (p.keys.s) moveZ += 1;
                    if (p.keys.a) moveX -= 1;
                    if (p.keys.d) moveX += 1;
                } else if (p.id === 3) {
                    if (p.keys.t) moveZ -= 1;
                    if (p.keys.g) moveZ += 1;
                    if (p.keys.f) moveX -= 1;
                    if (p.keys.h) moveX += 1;
                }

                p.vx *= 0.92;
                p.vz *= 0.92;
                if (Math.abs(p.vx) < 0.05) p.vx = 0;
                if (Math.abs(p.vz) < 0.05) p.vz = 0;

                let dx = 0;
                let dz = 0;
                if (moveX !== 0 || moveZ !== 0) {
                    const forwardX = 0.707;
                    const forwardZ = 0.707;
                    const rightX = 0.707;
                    const rightZ = -0.707;
                    dx = moveX * rightX + moveZ * forwardX;
                    dz = moveX * rightZ + moveZ * forwardZ;
                    const len = Math.sqrt(dx * dx + dz * dz);
                    if (len > 0) {
                        dx /= len;
                        dz /= len;
                    }
                }

                const speed = 2.8;
                const stepX = (dx * speed + p.vx) * delta;
                const stepZ = (dz * speed + p.vz) * delta;

                const nextPosX = p.mesh.position.clone();
                nextPosX.x += stepX;
                if (!checkPlayerCollision(p.id, nextPosX)) {
                    p.mesh.position.x = nextPosX.x;
                } else {
                    p.vx = 0;
                }

                const nextPosZ = p.mesh.position.clone();
                nextPosZ.z += stepZ;
                if (!checkPlayerCollision(p.id, nextPosZ)) {
                    p.mesh.position.z = nextPosZ.z;
                } else {
                    p.vz = 0;
                }

                const charRadius = 0.08 * CHARACTER_SCALE;
                const currentGroundY = getGroundY(p.id, p.mesh.position);

                if (!p.isJumping && p.mesh.position.y > currentGroundY + 0.15) {
                    p.isJumping = true;
                    p.yVelocity = 0;
                }

                if (moveX !== 0 || moveZ !== 0) {
                    const targetAngle = Math.atan2(dx, dz) + Math.PI;
                    let diff = targetAngle - p.mesh.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    p.mesh.rotation.y += diff * 0.15;

                    p.walkCycle += delta * 12;
                    if (!p.isJumping) {
                        p.mesh.position.y = currentGroundY + Math.abs(Math.sin(p.walkCycle)) * 0.08;
                        p.mesh.rotation.z = Math.sin(p.walkCycle) * 0.04;
                    }
                } else if (!p.isJumping) {
                    p.mesh.position.y = THREE.MathUtils.lerp(p.mesh.position.y, currentGroundY, 0.2);
                    p.mesh.rotation.z = THREE.MathUtils.lerp(p.mesh.rotation.z, 0, 0.2);
                    p.walkCycle = 0;
                }

                let jumpPressed = false;
                if (p.id === 1) jumpPressed = p.keys.space;
                else if (p.id === 2) jumpPressed = p.keys.q;
                else if (p.id === 3) jumpPressed = p.keys.r;

                if (jumpPressed && !p.isJumping) {
                    p.isJumping = true;
                    p.yVelocity = 6.5;
                }

                if (p.isJumping) {
                    p.yVelocity -= 18.0 * delta;
                    p.mesh.position.y += p.yVelocity * delta;
                    
                    const groundY = getGroundY(p.id, p.mesh.position);
                    if (p.mesh.position.y <= groundY) {
                        p.mesh.position.y = groundY;
                        p.isJumping = false;
                        p.yVelocity = 0;
                    }
                }

                if (p.mesh.position.y < -15.0) {
                    respawnPlayer(p.id);
                }
            }

            const localP = players[localPlayerId - 1];
            if (localP && localP.mesh && connections.length > 0) {
                const moveData = {
                    type: 'move',
                    id: localPlayerId,
                    x: localP.mesh.position.x,
                    y: localP.mesh.position.y,
                    z: localP.mesh.position.z,
                    ry: localP.mesh.rotation.y,
                    rz: localP.mesh.rotation.z,
                    isJumping: localP.isJumping
                };
                for (const conn of connections) {
                    if (conn.open) conn.send(moveData);
                }
            }

            updateSpeechBubblePosition();
            updateParticles();

            shakeIntensity *= 0.92;
            if (shakeIntensity < 0.01) shakeIntensity = 0;
            const shakeX = (Math.random() - 0.5) * shakeIntensity;
            const shakeY = (Math.random() - 0.5) * shakeIntensity;
            const shakeZ = (Math.random() - 0.5) * shakeIntensity;
            camera.position.set(9 + shakeX, 9 + shakeY, 9 + shakeZ);
            camera.lookAt(0, -1.2, 0);

            renderer.render(scene, camera);
        }

        function updateSpeechBubblePosition() {
            const bubble = document.getElementById('speech-bubble');
            if (bubble.style.display === 'none') return;
            if (!players[0].mesh) return;
            
            const tempV = new THREE.Vector3();
            players[0].mesh.getWorldPosition(tempV);
            tempV.y += 0.4 * CHARACTER_SCALE;
            tempV.project(camera);
            
            const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
            const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
            
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;
        }



        function updateParticles() {
            if (!players[0].mesh) return;
            const tempV = new THREE.Vector3();
            players[0].mesh.getWorldPosition(tempV);
            tempV.y += 0.3 * CHARACTER_SCALE;
            tempV.project(camera);
            
            const charScreenX = (tempV.x * 0.5 + 0.5) * window.innerWidth;
            const charScreenY = (tempV.y * -0.5 + 0.5) * window.innerHeight;
            
            const now = Date.now();
            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const p = activeParticles[i];
                const elapsed = now - p.createdAt;
                const progress = elapsed / p.duration;
                
                if (progress >= 1.0) {
                    p.element.remove();
                    activeParticles.splice(i, 1);
                } else {
                    let px = charScreenX + p.offsetX;
                    let py = charScreenY + p.offsetY;
                    
                    py -= progress * 80;
                    
                    if (p.element.classList.contains('anim-love')) {
                        px += Math.sin(progress * 10) * 15;
                    } else if (p.element.classList.contains('anim-angry')) {
                        px += (Math.random() - 0.5) * 8;
                        py += (Math.random() - 0.5) * 8;
                    } else if (p.element.classList.contains('anim-shocked')) {
                        const scale = 1.0 + progress * 1.5;
                        p.element.style.transform = `translate(-50%, -50%) translate(${p.offsetX}px, ${p.offsetY - progress * 50}px) scale(${scale})`;
                    }
                    
                    p.element.style.opacity = 1.0 - progress;
                    
                    if (!p.element.classList.contains('anim-shocked')) {
                        p.element.style.left = `${px}px`;
                        p.element.style.top = `${py}px`;
                    } else {
                        p.element.style.left = `${charScreenX}px`;
                        p.element.style.top = `${charScreenY}px`;
                    }
                }
            }
        }

        animate();
    </script>
