        }

        document.getElementById('chat-send-btn').addEventListener('click', sendChatMessage);
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        });

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            updateLayoutForDevice();
        });

        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('fade-overlay');
            overlay.classList.add('visible');
            setTimeout(() => {
                overlay.classList.remove('visible');
            }, 100);
        });

        document.getElementById('back-btn').addEventListener('click', () => {
            const overlay = document.getElementById('fade-overlay');
            overlay.classList.add('visible');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });

        let isEditorMode = false;
        let selectedPlatform = null;
        let selectionBoxHelper = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function createGridMaterial(colorHex) {
            const mat = new THREE.MeshToonMaterial({
                color: colorHex
            });
            mat.onBeforeCompile = (shader) => {
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <common>',
                    `#include <common>\n varying vec3 vWorldPos;\n varying vec3 vLocalPos;`
                );
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `#include <begin_vertex>\n vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;\n vLocalPos = position;`
                );
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <common>',
                    `#include <common>\n varying vec3 vWorldPos;\n varying vec3 vLocalPos;`
                );
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <color_fragment>',
                    `#include <color_fragment>\n 
                    float pdist = distance(vWorldPos.xz, vec2(34.0, 4.0));\n
                    if (pdist < 3.5) {\n
                        discard;\n
                    }\n
                    vec2 grid = abs(fract(vWorldPos.xz * 0.5 - 0.5) - 0.5) / fwidth(vWorldPos.xz * 0.5);\n 
                    float line = min(grid.x, grid.y);\n 
                    float gridPattern = 1.0 - min(line, 1.0);\n 
                    vec3 gridColor = vec3(0.75, 0.75, 0.75);\n 
                    diffuseColor.rgb = mix(diffuseColor.rgb, gridColor, gridPattern * 0.3);\n
                    vec3 aPos = abs(vLocalPos);\n
                    float bx = step(0.48, aPos.x);\n
                    float by = step(0.48, aPos.y);\n
                    float bz = step(0.48, aPos.z);\n
                    float border = clamp(bx * by + by * bz + bz * bx, 0.0, 1.0);\n
                    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.04, 0.04, 0.05), border);`
                );
            };
            return mat;
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const physicsDelta = Math.min(delta, 0.03);
            let sumX = 0;
            let bridgePlayerCount = 0;
            for (const p of players) {
                if (!p.mesh) continue;
                const px = p.mesh.position.x;
                const py = p.mesh.position.y;
                const pz = p.mesh.position.z;
                
                if (px >= bridgeStartX - 0.2 && px <= bridgeEndX + 0.2 && Math.abs(pz) <= 1.5) {
                    const t = (px - bridgeStartX) / (bridgeEndX - bridgeStartX);
                    const defaultYAtPx = THREE.MathUtils.lerp(bridgeYStart, bridgeYEnd, t) - 0.5 * Math.sin(Math.PI * t);
                    
                    if (py <= defaultYAtPx + 0.1 && py >= defaultYAtPx - 0.8) {
                        sumX += px;
                        bridgePlayerCount++;
                    }
                }
            }

            const hasPlayers = bridgePlayerCount > 0;
            let loadX = 0;
            if (hasPlayers) {
                loadX = Math.max(bridgeStartX + 0.1, Math.min(bridgeEndX - 0.1, sumX / bridgePlayerCount));
            }

            const maxSag = 0.65;

            for (let i = 0; i < numPlanks; i++) {
                const plank = bridgePlanks[i];
                let targetY = plank.defaultY;
                let targetRotZ = 0;

                if (hasPlayers) {
                    const tLoad = (loadX - bridgeStartX) / (bridgeEndX - bridgeStartX);
                    const defaultYAtLoad = THREE.MathUtils.lerp(bridgeYStart, bridgeYEnd, tLoad) - 0.5 * Math.sin(Math.PI * tLoad);
                    const loadY = defaultYAtLoad - maxSag;

                    if (plank.x < loadX) {
                        const tSeg = (plank.x - bridgeStartX) / (loadX - bridgeStartX);
                        targetY = THREE.MathUtils.lerp(bridgeYStart, loadY, tSeg);
                        targetRotZ = Math.atan2(loadY - bridgeYStart, loadX - bridgeStartX);
                    } else {
                        const tSeg = (plank.x - loadX) / (bridgeEndX - loadX);
                        targetY = THREE.MathUtils.lerp(loadY, bridgeYEnd, tSeg);
                        targetRotZ = Math.atan2(bridgeYEnd - loadY, bridgeEndX - loadX);
                    }
                } else {
                    const prevY = (i === 0) ? bridgeYStart : bridgePlanks[i - 1].y;
                    const nextY = (i === numPlanks - 1) ? bridgeYEnd : bridgePlanks[i + 1].y;
                    const prevX = (i === 0) ? bridgeStartX : bridgePlanks[i - 1].x;
                    const nextX = (i === numPlanks - 1) ? bridgeEndX : bridgePlanks[i + 1].x;
                    targetRotZ = Math.atan2(nextY - prevY, nextX - prevX);
                }

                plank.y = THREE.MathUtils.lerp(plank.y, targetY, 0.15);
                plank.z = 0;
                plank.rotZ = THREE.MathUtils.lerp(plank.rotZ || 0, targetRotZ, 0.15);

                plank.mesh.position.y = plank.y;
                plank.mesh.position.z = 0;
                plank.mesh.rotation.z = plank.rotZ;
                plank.mesh.rotation.y = 0;
                plank.mesh.rotation.x = 0;
            }
            updateRopePoints();

            let insideCloud = false;

            for (let i = 0; i < platformClouds.length; i++) {
                const c = platformClouds[i];
                c.mesh.rotation.y += c.rotSpeed * delta;
                const dist = camera.position.distanceTo(c.mesh.position);
                if (dist < c.radius * 0.95) {
                    insideCloud = true;
                    c.mesh.visible = false;
                } else {
                    c.mesh.visible = true;
                }
            }

            for (let i = 0; i < topClouds.length; i++) {
                const tc = topClouds[i];
                tc.mesh.position.x += tc.speed * delta;
                if (tc.mesh.position.x > 200) {
                    tc.mesh.position.x = -200;
                    tc.mesh.position.z = (Math.random() - 0.5) * 400;
                }
                const dist = camera.position.distanceTo(tc.mesh.position);
                if (dist < tc.radius * 0.95) {
                    insideCloud = true;
                    tc.mesh.visible = false;
                } else {
                    tc.mesh.visible = true;
                }
            }

            const targetColor = insideCloud ? new THREE.Color(0xd8d8d8) : new THREE.Color(0x99ccff);
            const targetNear = insideCloud ? 0.1 : 35;
            const targetFar = insideCloud ? 6.0 : 100;

            currentFogColor.lerp(targetColor, 0.35);
            currentClearColor.lerp(targetColor, 0.35);
            currentFogNear = THREE.MathUtils.lerp(currentFogNear, targetNear, 0.35);
            currentFogFar = THREE.MathUtils.lerp(currentFogFar, targetFar, 0.35);

            scene.fog.color.copy(currentFogColor);
            scene.fog.near = currentFogNear;
            scene.fog.far = currentFogFar;
            renderer.setClearColor(currentClearColor);
            scene.background.copy(currentClearColor);

            for (const po of physicsObjects) {
                // Gravity
                po.vy -= 9.8 * delta;
                
                // Movement
                po.mesh.position.x += po.vx * delta;
                po.mesh.position.y += po.vy * delta;
                po.mesh.position.z += po.vz * delta;
                
                // Air resistance / friction
                po.vx *= 0.99;
                po.vz *= 0.99;
                
                // Floor and Platform collision
                const groundY = getGroundY(-1, po.mesh.position);
                if (po.mesh.position.y - po.radius <= groundY) {
                    po.mesh.position.y = groundY + po.radius;
                    po.vy = Math.abs(po.vy) * po.bounciness;
                    if (po.vy < 0.5) po.vy = 0;
                    po.vx *= 0.95;
                    po.vz *= 0.95;
                }

                // Simple wall collision for platforms
                for (const plat of customPlatforms) {
                    if (!plat.visible && plat.material.visible === false) {
                        // Skip invisible helper collisions for ball if too complex, 
                        // but actually benches should block it.
                    }
                    const halfX = plat.scale.x / 2 + po.radius;
                    const halfY = plat.scale.y / 2 + po.radius;
                    const halfZ = plat.scale.z / 2 + po.radius;
                    const dx = po.mesh.position.x - plat.position.x;
                    const dy = po.mesh.position.y - plat.position.y;
                    const dz = po.mesh.position.z - plat.position.z;

                    if (Math.abs(dx) < halfX && Math.abs(dy) < halfY && Math.abs(dz) < halfZ) {
                        // Collision detected, find shortest exit vector
                        const overlapX = halfX - Math.abs(dx);
                        const overlapY = halfY - Math.abs(dy);
                        const overlapZ = halfZ - Math.abs(dz);

                        if (overlapX < overlapY && overlapX < overlapZ) {
                            po.mesh.position.x += Math.sign(dx) * overlapX;
                            po.vx = -po.vx * po.bounciness;
                        } else if (overlapZ < overlapY && overlapZ < overlapX) {
                            po.mesh.position.z += Math.sign(dz) * overlapZ;
                            po.vz = -po.vz * po.bounciness;
                        }
                    }
                }
                
                // Player interaction
                for (const p of players) {
                    if (!p.mesh) continue;
                    const dist = po.mesh.position.distanceTo(p.mesh.position);
                    const minDist = po.radius + 0.3;
                    if (dist < minDist) {
                        const distH = Math.hypot(p.mesh.position.x - po.mesh.position.x, p.mesh.position.z - po.mesh.position.z);
                        const isPlayerOnTop = (distH < po.radius * 0.85) && (p.mesh.position.y > po.mesh.position.y + po.radius * 0.3);
                        if (isPlayerOnTop) {
                            const pvx = p.displacementX !== undefined ? p.displacementX / Math.max(0.001, delta) : 0;
                            const pvz = p.displacementZ !== undefined ? p.displacementZ / Math.max(0.001, delta) : 0;
                            const relativeVx = pvx - po.vx;
                            const relativeVz = pvz - po.vz;
                            po.vx = THREE.MathUtils.lerp(po.vx, relativeVx * 0.95, 0.25);
                            po.vz = THREE.MathUtils.lerp(po.vz, relativeVz * 0.95, 0.25);
                            po.vy -= 2.0 * delta;
                        } else {
                            const dir = new THREE.Vector3().subVectors(po.mesh.position, p.mesh.position).normalize();
                            const pushForce = (minDist - dist) * 20.0;
                            po.vx += dir.x * pushForce;
                            po.vz += dir.z * pushForce;
                            po.vy += dir.y * pushForce + 1.0;
                        }
                    }
                }

                // Bounds
                if (Math.abs(po.mesh.position.x) > 100 || 
                    Math.abs(po.mesh.position.z) > 100 || 
                    po.mesh.position.y < -20) {
                    po.mesh.position.set(0, 10, 0);
                    po.vx = po.vy = po.vz = 0;
                }
            }

            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                const p = explosionParticles[i];
                p.mesh.position.x += p.vx * delta;
                p.mesh.position.y += p.vy * delta;
                p.mesh.position.z += p.vz * delta;
                p.vy -= 18.0 * delta;
                p.life -= p.decay;
                p.mesh.material.opacity = p.life;
                p.mesh.scale.set(p.life, p.life, p.life);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    p.mesh.geometry.dispose();
                    p.mesh.material.dispose();
                    explosionParticles.splice(i, 1);
                }
            }

            for (let i = dustParticles.length - 1; i >= 0; i--) {
                const dp = dustParticles[i];
                dp.mesh.position.x += dp.vx * delta;
                dp.mesh.position.y += dp.vy * delta;
                dp.mesh.position.z += dp.vz * delta;
                dp.life -= dp.decay;
                dp.mesh.material.opacity = dp.life * 0.6;
                dp.mesh.scale.set(dp.life, dp.life, dp.life);
                if (dp.life <= 0) {
                    scene.remove(dp.mesh);
                    dp.mesh.geometry.dispose();
                    dp.mesh.material.dispose();
                    dustParticles.splice(i, 1);
                }
            }

            for (const p of players) {
                if (!p.mesh) continue;

                if (p.standingMesh && p.sittingMesh) {
                    p.standingMesh.visible = !p.isSitting;
                    p.sittingMesh.visible = !!p.isSitting;
                }

                if (p.mixer) {
                    p.mixer.update(delta);
                    
                    const speedVal = p.displacementX !== undefined ? Math.hypot(p.displacementX, p.displacementZ) / Math.max(0.001, delta) : 0;
                    const isMoving = speedVal > 0.15;
                    const shouldPlayStomp = isMoving && !p.isJumping && !p.isSitting && !p.isCustomizing;

                    if (shouldPlayStomp) {
                        if (p.stompAction) {
                            const isSprinting = speedVal > 3.5;
                            p.stompAction.timeScale = isSprinting ? 1.8 : 1.1;
                            if (!p.stompAction.isRunning()) {
                                p.stompAction.play();
                            }
                        }
                    } else {
                        // Idle state: Turn off all animations
                        p.mixer.stopAllAction();
                    }
                }

                // Water Physics
                const pdx = p.mesh.position.x - pondData.center.x;
                const pdz = p.mesh.position.z - pondData.center.z;
                const distH = Math.sqrt(pdx * pdx + pdz * pdz);
                const inWater = (distH < pondData.radius) && (p.mesh.position.y < pondData.center.y + 0.1);


                
                if (inWater) {
                    const buoyancy = 22.0;
                    const drag = 0.85;
                    p.vx *= drag;
                    p.vz *= drag;

                    let isMovingInWater = false;
                    if (p.id === localPlayerId) {
                        if (p.keys.up || p.keys.down || p.keys.left || p.keys.right) isMovingInWater = true;
                    }
                    
                    if (p.mesh.position.y < pondData.surfaceY) {
                        // Float logic
                        if (p.id === localPlayerId && p.keys.space) {
                            p.yVelocity += buoyancy * delta;
                        } else {
                            p.yVelocity += (buoyancy * 0.6) * delta;
                        }
                        p.yVelocity *= 0.9; // Water resistance
                        
                        // Splash particles
                        if (Math.abs(p.yVelocity) > 0.5 || isMovingInWater) {
                            p.waterTimer = (p.waterTimer || 0) + delta;
                            if (p.waterTimer > 0.15) {
                                p.waterTimer = 0;
                                createWaterSplash(p.mesh.position.x, pondData.surfaceY, p.mesh.position.z);
                            }
                        }
                    }
                }

                if (p.isCustomizing) {
                    p.vx = 0;
                    p.vz = 0;
                    p.yVelocity = 0;
                    p.isJumping = false;
                    continue;
                }

                if (p.isRemote) continue;

                if (p.isSitting) {
                    if (p.id === localPlayerId) {
                        const wantsToMove = p.keys.up || p.keys.down || p.keys.left || p.keys.right || p.keys.space;
                        if (wantsToMove) {
                            p.isSitting = false;
                            p.mesh.position.y = parkTopY + 0.7;
                        }
                    }
                }

                if (p.isSitting) {
                    p.vx = 0;
                    p.vz = 0;
                    p.yVelocity = 0;
                    p.isJumping = false;
                    const sitZSpots = [-2.2, -1.0, 0.2];
                    p.mesh.position.set(27, parkTopY + 0.35 + 0.08, sitZSpots[p.sitSpotIndex]);
                    p.mesh.rotation.set(0, -Math.PI / 2, 0);
                    if (p.lastFramePosition) {
                        p.lastFramePosition.copy(p.mesh.position);
                    }
                    p.lastFrameRotationY = p.mesh.rotation.y;
                    continue;
                }

                let moveX = 0;
                let moveZ = 0;
                if (p.id === localPlayerId) {
                    if (p.keys.up) moveZ -= 1;
                    if (p.keys.down) moveZ += 1;
                    if (p.keys.left) moveX -= 1;
                    if (p.keys.right) moveX += 1;
                }

                p.vx *= 0.92;
                p.vz *= 0.92;
                if (Math.abs(p.vx) < 0.05) p.vx = 0;
                if (Math.abs(p.vz) < 0.05) p.vz = 0;

                let dx = 0;
                let dz = 0;
                if (moveX !== 0 || moveZ !== 0) {
                    const camForward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    camForward.y = 0;
                    if (camForward.lengthSq() > 0.0001) {
                        camForward.normalize();
                    } else {
                        camForward.set(0, 0, -1);
                    }

                    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    camRight.y = 0;
                    if (camRight.lengthSq() > 0.0001) {
                        camRight.normalize();
                    } else {
                        camRight.set(1, 0, 0);
                    }

                    const targetDir = new THREE.Vector3();
                    targetDir.addScaledVector(camForward, -moveZ);
                    targetDir.addScaledVector(camRight, moveX);

                    dx = targetDir.x;
                    dz = targetDir.z;

                    const len = Math.sqrt(dx * dx + dz * dz);
                    if (len > 0) {
                        dx /= len;
                        dz /= len;
                    }
                }

                const stackCount = getStackCount(p);
                const isSprinting = p.keys.shift && !inWater && !p.isExhausted && (moveX !== 0 || moveZ !== 0);

                if (isSprinting) {
                    p.stamina = Math.max(0, p.stamina - 25 * delta);
                    if (p.stamina <= 0) {
                        p.isExhausted = true;
                    }
                } else {
                    const isMoving = (moveX !== 0 || moveZ !== 0);
                    if (isMoving) {
                        p.stamina = Math.min(100, p.stamina + 15 * delta);
                    } else {
                        p.stamina = Math.min(100, p.stamina + 30 * delta);
                    }
                    if (p.isExhausted && p.stamina >= 30) {
                        p.isExhausted = false;
                    }
                }

                if (p.id === localPlayerId) {
                    const staminaBar = document.getElementById('stamina-bar');
                    if (staminaBar) {
                        staminaBar.style.width = `${p.stamina}%`;
                    }
                }

                let baseSpeed = 2.8;
                if (isSprinting) {
                    if (p.stamina > 30) {
                        baseSpeed = 4.8;
                    } else {
                        const factor = p.stamina / 30.0;
                        baseSpeed = 2.8 + (4.8 - 2.8) * factor;
                    }
                }
                if (inWater) {
                    baseSpeed = 0.8;
                }
                const speed = baseSpeed / (1.0 + stackCount * 0.45);
                let ballVelocityX = 0;
                let ballVelocityZ = 0;
                for (const po of physicsObjects) {
                    if (po.radius && po.mesh) {
                        const bdx = p.mesh.position.x - po.mesh.position.x;
                        const bdz = p.mesh.position.z - po.mesh.position.z;
                        const distH = Math.sqrt(bdx * bdx + bdz * bdz);
                        if (distH < po.radius * 0.85 && p.mesh.position.y >= po.mesh.position.y + po.radius * 0.3) {
                            ballVelocityX = po.vx;
                            ballVelocityZ = po.vz;
                            const driftStrength = 1.5;
                            ballVelocityX -= bdx * driftStrength;
                            ballVelocityZ -= bdz * driftStrength;
                            break;
                        }
                    }
                }
                const stepX = (dx * speed + p.vx + ballVelocityX) * delta;
                const stepZ = (dz * speed + p.vz + ballVelocityZ) * delta;

                const nextPosX = p.mesh.position.clone();
                nextPosX.x += stepX;
                if (!checkPlayerCollision(p.id, nextPosX) && !checkEnvironmentCollision(p.id, nextPosX)) {
                    p.mesh.position.x = nextPosX.x;
                } else {
                    p.vx = 0;
                }

                const nextPosZ = p.mesh.position.clone();
                nextPosZ.z += stepZ;
                if (!checkPlayerCollision(p.id, nextPosZ) && !checkEnvironmentCollision(p.id, nextPosZ)) {
                    p.mesh.position.z = nextPosZ.z;
                } else {
                    p.vz = 0;
                }

                if (p.id === localPlayerId && isSprinting && (moveX !== 0 || moveZ !== 0)) {
                    p.dustTimer = (p.dustTimer || 0) + delta;
                    if (p.dustTimer > 0.08) {
                        p.dustTimer = 0;
                        const rightVec = new THREE.Vector3(1, 0, 0).applyQuaternion(p.mesh.quaternion);
                        const leftFoot = p.mesh.position.clone().addScaledVector(rightVec, -0.25);
                        const rightFoot = p.mesh.position.clone().addScaledVector(rightVec, 0.25);
                        if (Math.sin(p.walkCycle) > 0) {
                            createDustParticle(leftFoot.x, p.mesh.position.y + 0.05, leftFoot.z, dx, dz);
                        } else {
                            createDustParticle(rightFoot.x, p.mesh.position.y + 0.05, rightFoot.z, dx, dz);
                        }
                    }
                }

                const charRadius = 0.12 * CHARACTER_SCALE;
                let isCarried = false;
                for (const other of players) {
                    if (other.id !== p.id && other.mesh && isStandingOn(p, other)) {
                        isCarried = true;
                        break;
                    }
                }
                const currentGroundY = isCarried ? p.mesh.position.y : getGroundY(p.id, p.mesh.position);

                if (!p.isJumping && p.mesh.position.y > currentGroundY + 0.25) {
                    p.isJumping = true;
                    p.yVelocity = 0;
                    p.sprintActiveInJump = p.keys.shift && !inWater;
                }

                if (isFirstPerson && p.id === localPlayerId) {
                    p.mesh.rotation.y = fpYaw;
                } else if (moveX !== 0 || moveZ !== 0) {
                    const targetAngle = Math.atan2(dx, dz) + Math.PI;
                    let diff = targetAngle - p.mesh.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    p.mesh.rotation.y += diff * 0.15;
                }

                if (moveX !== 0 || moveZ !== 0) {
                    const cycleSpeed = isSprinting ? 16 : 12;
                    p.walkCycle += delta * cycleSpeed;
                    if (!p.isJumping) {
                        if ((isFirstPerson && p.id === localPlayerId) || p.stompAction) {
                            p.mesh.position.y = currentGroundY;
                            p.mesh.rotation.z = 0;
                        } else {
                            const bobHeight = isSprinting ? 0.16 : 0.08;
                            const tiltAngle = isSprinting ? 0.16 : 0.04;
                            const targetY = currentGroundY + Math.abs(Math.sin(p.walkCycle)) * bobHeight;
                            const targetZ = Math.sin(p.walkCycle) * tiltAngle;
                            p.mesh.position.y = THREE.MathUtils.lerp(p.mesh.position.y, targetY, 0.35);
                            p.mesh.rotation.z = THREE.MathUtils.lerp(p.mesh.rotation.z, targetZ, 0.35);
                        }
                    }
                } else if (!p.isJumping) {
                    if (p.stompAction) {
                        p.mesh.position.y = currentGroundY;
                        p.mesh.rotation.z = 0;
                    } else {
                        p.mesh.position.y = THREE.MathUtils.lerp(p.mesh.position.y, currentGroundY, 0.2);
                        p.mesh.rotation.z = THREE.MathUtils.lerp(p.mesh.rotation.z, 0, 0.2);
                    }
                    p.walkCycle = 0;
                }

                let jumpPressed = false;
                if (p.id === localPlayerId) jumpPressed = p.keys.space;

                if (jumpPressed && !p.isJumping && getStackCount(p) === 0) {
                    p.isJumping = true;
                    p.yVelocity = 5.2;
                    p.jumpHoldTimer = 0.0;
                    p.sprintActiveInJump = p.keys.shift && !inWater;
                }

                if (p.isJumping) {
                    let gravity = 18.0;
                    if (jumpPressed && p.jumpHoldTimer !== undefined && p.jumpHoldTimer < 0.25) {
                        p.jumpHoldTimer += delta;
                        gravity = 6.0;
                    }
                    p.yVelocity -= gravity * delta;
                    p.mesh.position.y += p.yVelocity * delta;
                    
                    const groundY = getGroundY(p.id, p.mesh.position);
                    if (p.mesh.position.y <= groundY) {
                        p.mesh.position.y = groundY;
                        p.isJumping = false;
                        p.yVelocity = 0;
                        p.jumpHoldTimer = 0;
                        p.sprintActiveInJump = false;
                    }
                }

                if (p.mesh.position.y < -15.0) {
                    respawnPlayer(p.id);
                }
            }

            for (const p of players) {
                if (p.mesh) {
                    if (!p.lastFramePosition) {
                        p.lastFramePosition = p.mesh.position.clone();
                    }
                    if (p.lastFrameRotationY === undefined) {
                        p.lastFrameRotationY = p.mesh.rotation.y;
                    }
                    p.displacementX = p.mesh.position.x - p.lastFramePosition.x;
                    p.displacementZ = p.mesh.position.z - p.lastFramePosition.z;
                    p.displacementRotY = p.mesh.rotation.y - p.lastFrameRotationY;
                    while (p.displacementRotY < -Math.PI) p.displacementRotY += Math.PI * 2;
                    while (p.displacementRotY > Math.PI) p.displacementRotY -= Math.PI * 2;
                }
            }

            const completedStack = new Set();
            for (const p of players) {
                if (p.mesh && !p.isRemote) {
                    updateStackPhysicsRecursive(p, completedStack);
                }
            }

            for (const p of players) {
                if (p.mesh) {
                    if (p.lastFramePosition) {
                        p.lastFramePosition.copy(p.mesh.position);
                    }
                    p.lastFrameRotationY = p.mesh.rotation.y;
                }
            }

            const localP = players[localPlayerId - 1];
            if (localP && localP.mesh && connections.length > 0) {
                const moveData = {
                    type: 'move',
                    id: localPlayerId,
                    x: localP.mesh.position.x,
                    y: localP.mesh.position.y,
                    z: localP.mesh.position.z,
                    ry: localP.mesh.rotation.y,
                    rz: localP.mesh.rotation.z,
                    isJumping: localP.isJumping,
                    isSitting: localP.isSitting || false
                };
                for (const conn of connections) {
                    if (conn.open) conn.send(moveData);
                }
            }

            // Update 3D reaction particles
            for (let i = reactionParticles.length - 1; i >= 0; i--) {
                const rp = reactionParticles[i];
                rp.sprite.position.x += rp.vx * delta;
                rp.sprite.position.y += rp.vy * delta;
                rp.sprite.position.z += rp.vz * delta;
                
                if (rp.type === 'angry') {
                    rp.sprite.position.x += (Math.random() - 0.5) * 0.15;
                } else if (rp.type === 'love') {
                    rp.sprite.position.x += Math.sin(rp.life * 10.0) * 0.05;
                } else if (rp.type === 'shocked') {
                    rp.sprite.scale.addScalar(delta * 0.5);
                }
                
                rp.life -= rp.decay;
                rp.sprite.material.opacity = rp.life;
                if (rp.life <= 0) {
                    scene.remove(rp.sprite);
                    rp.sprite.material.map.dispose();
                    rp.sprite.material.dispose();
                    reactionParticles.splice(i, 1);
                }
            }

            const nowTime = Date.now();
            if (isFirstPerson) {
                if (localP && localP.mesh) {
                    const headPos = new THREE.Vector3().copy(localP.mesh.position).add(new THREE.Vector3(0, 0.65, 0));
                    camera.position.copy(headPos);
                    const euler = new THREE.Euler(fpPitch, fpYaw, 0, 'YXZ');
                    camera.quaternion.setFromEuler(euler);
                    controls.target.copy(headPos);
                }
            } else {
                const oldTarget = controls.target.clone();
                if (nowTime < respawnLockUntil) {
                    cameraFocusTarget.set(0, floorY + 1.2, 0);
                } else if (localP && localP.mesh) {
                    cameraFocusTarget.copy(localP.mesh.position);
                }
                controls.target.lerp(cameraFocusTarget, 0.25);
                const deltaTarget = new THREE.Vector3().subVectors(controls.target, oldTarget);
                camera.position.add(deltaTarget);
                
                controls.update();

                const pad = 0.5;
                const limitX = PLATFORM_SIZE / 2 + pad;
                const limitZ = PLATFORM_SIZE / 2 + pad;
                const limitYTop = floorY + pad;
                const limitYBottom = floorY - PLATFORM_HEIGHT - pad;

                if (camera.position.x > -limitX && camera.position.x < limitX &&
                    camera.position.z > -limitZ && camera.position.z < limitZ &&
                    camera.position.y > limitYBottom && camera.position.y < limitYTop) {
                    const distToLeft = camera.position.x - (-limitX);
                    const distToRight = limitX - camera.position.x;
                    const distToBack = camera.position.z - (-limitZ);
                    const distToFront = limitZ - camera.position.z;
                    const distToTop = limitYTop - camera.position.y;
                    const distToBottom = camera.position.y - limitYBottom;
                    const minDist = Math.min(distToLeft, distToRight, distToBack, distToFront, distToTop, distToBottom);
                    if (minDist === distToLeft) {
                        camera.position.x = -limitX;
                    } else if (minDist === distToRight) {
                        camera.position.x = limitX;
                    } else if (minDist === distToBack) {
                        camera.position.z = -limitZ;
                    } else if (minDist === distToFront) {
                        camera.position.z = limitZ;
                    } else if (minDist === distToTop) {
                        camera.position.y = limitYTop;
                    } else {
                        camera.position.y = limitYBottom;
                    }
                }
            }

            if (camera.position.y > 14.0) {
                camera.position.y = 14.0;
            }

            for (let i = 0; i < players.length; i++) {
                const other = players[i];
                if (other.id === localPlayerId || !other.mesh) continue;
                const otherPos = new THREE.Vector3().copy(other.mesh.position).add(new THREE.Vector3(0, 0.45, 0));
                const dist = camera.position.distanceTo(otherPos);
                if (dist < 0.8) {
                    const dir = new THREE.Vector3().subVectors(camera.position, otherPos);
                    if (dir.lengthSq() > 0.0001) {
                        dir.normalize();
                    } else {
                        dir.set(0, 1, 0);
                    }
                    camera.position.copy(otherPos).addScaledVector(dir, 0.8);
                }
            }

            const cdx = camera.position.x - pondData.center.x;
            const cdz = camera.position.z - pondData.center.z;
            const camDistH = Math.sqrt(cdx * cdx + cdz * cdz);
            const cameraInWater = (camDistH < pondData.radius) && (camera.position.y < pondData.surfaceY);

            waterSurface.visible = !cameraInWater;
            const underwaterOverlay = document.getElementById('underwater-overlay');
            if (underwaterOverlay) {
                underwaterOverlay.style.display = cameraInWater ? 'block' : 'none';
            }

            const baseCamX = camera.position.x;
            const baseCamY = camera.position.y;
            const baseCamZ = camera.position.z;

            shakeIntensity *= 0.92;
            if (shakeIntensity < 0.01) shakeIntensity = 0;
            const shakeX = (Math.random() - 0.5) * shakeIntensity;
            const shakeY = (Math.random() - 0.5) * shakeIntensity;
            const shakeZ = (Math.random() - 0.5) * shakeIntensity;

            camera.position.set(baseCamX + shakeX, baseCamY + shakeY, baseCamZ + shakeZ);

            const sitPrompt = document.getElementById('sit-prompt');
            if (sitPrompt) {
                const localP = players[localPlayerId - 1];
                if (localP && localP.mesh && !localP.isCustomizing) {
                    if (localP.isSitting) {
                        sitPrompt.innerText = "[W/A/S/D/Space/E] to Stand";
                        sitPrompt.style.display = 'block';
                    } else {
                        const distToLogX = Math.abs(localP.mesh.position.x - 27);
                        const distToLogZ = localP.mesh.position.z >= -2.8 && localP.mesh.position.z <= 0.8 ? 0 : Math.min(Math.abs(localP.mesh.position.z - (-2.8)), Math.abs(localP.mesh.position.z - 0.8));
                        const distToLogY = Math.abs(localP.mesh.position.y - (parkTopY + 0.35));
                        const isNearLog = (distToLogX < 1.8 && distToLogZ < 1.8 && distToLogY < 1.5);
                        if (isNearLog) {
                            sitPrompt.innerText = "[E] to Sit";
                            sitPrompt.style.display = 'block';
                        } else {
                            sitPrompt.style.display = 'none';
                        }
                    }
                } else {
                    sitPrompt.style.display = 'none';
                }
            }

            renderer.render(scene, camera);

            camera.position.set(baseCamX, baseCamY, baseCamZ);
        }

        let touchingJoystick = false;

        const joystickHandle = document.getElementById('mobile-joystick-handle');
        
        let joystickRect = null;
        let joystickCenterX = 0;
        let joystickCenterY = 0;
        let joystickTouchId = null;
        
        joystickContainer.addEventListener('touchstart', (e) => {
            if (isCustomizing) return;
            touchingJoystick = true;
            joystickRect = joystickContainer.getBoundingClientRect();
            joystickCenterX = joystickRect.left + joystickRect.width / 2;
            joystickCenterY = joystickRect.top + joystickRect.height / 2;
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            handleJoystickMove(touch);
            e.stopPropagation();
        }, { passive: true });
        
        window.addEventListener('touchmove', (e) => {
            if (isCustomizing) return;
            if (!touchingJoystick) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    handleJoystickMove(touch);
                    e.preventDefault();
                    break;
                }
            }
        }, { passive: false });
        
        window.addEventListener('touchend', (e) => {
            if (!touchingJoystick) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    touchingJoystick = false;
                    joystickTouchId = null;
                    joystickHandle.style.left = '50%';
                    joystickHandle.style.top = '50%';
                    
                    const p = players[localPlayerId - 1];
                    if (p) {
                        p.keys.up = false;
                        p.keys.down = false;
                        p.keys.left = false;
                        p.keys.right = false;
                    }
                    break;
                }
            }
        });
        
        window.addEventListener('touchcancel', (e) => {
            if (!touchingJoystick) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    touchingJoystick = false;
                    joystickTouchId = null;
                    joystickHandle.style.left = '50%';
                    joystickHandle.style.top = '50%';
                    
                    const p = players[localPlayerId - 1];
                    if (p) {
                        p.keys.up = false;
                        p.keys.down = false;
                        p.keys.left = false;
                        p.keys.right = false;
                    }
                    break;
                }
            }
        });
        
        function handleJoystickMove(touch) {
            if (isCustomizing) return;
            const dx = touch.clientX - joystickCenterX;
            const dy = touch.clientY - joystickCenterY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 45;
            
            let moveX = dx;
            let moveY = dy;
            if (dist > maxDist) {
                moveX = (dx / dist) * maxDist;
                moveY = (dy / dist) * maxDist;
            }
            
            joystickHandle.style.left = `calc(50% + ${moveX}px)`;
            joystickHandle.style.top = `calc(50% + ${moveY}px)`;
            
            const deadzone = 12;
            const p = players[localPlayerId - 1];
            if (!p) return;

            if (moveY < -deadzone) {
                p.keys.up = true;
                p.keys.down = false;
            } else if (moveY > deadzone) {
                p.keys.down = true;
                p.keys.up = false;
            } else {
                p.keys.up = false;
                p.keys.down = false;
            }
            
            if (moveX < -deadzone) {
                p.keys.left = true;
                p.keys.right = false;
            } else if (moveX > deadzone) {
                p.keys.right = true;
                p.keys.left = false;
            } else {
                p.keys.left = false;
                p.keys.right = false;
            }
        }

        function togglePause() {
            const pauseOverlay = document.getElementById('pause-overlay');
            const localP = players[localPlayerId - 1];
            if (!localP) return;
            
            if (isPaused) {
                const nameVal = document.getElementById('pause-name-input').value.trim() || 'Player';
                localP.name = nameVal;
                localP.color = chosenColor;
                updatePlayerVisuals(localP);
                
                if (localP.nametagSprite) {
                    localP.mesh.remove(localP.nametagSprite);
                    localP.nametagSprite.material.map.dispose();
                    localP.nametagSprite.material.dispose();
                }
                localP.nametagSprite = createNametagSprite(localP.name);
                localP.nametagSprite.position.set(0, 0.45, 0);
                localP.mesh.add(localP.nametagSprite);
                
                pauseOverlay.classList.add('hidden');
                isPaused = false;
                isCustomizing = false;
                localP.isCustomizing = false;
                updatePlayerVisuals(localP);
                
                addChatMessageToLog(null, `${localP.name} finished customizing.`, true);
                
                savePreference('name', nameVal);
                savePreference('color', chosenColor);
                savePreference('fov', camera.fov);
                
                if (isFirstPerson) {
                    renderer.domElement.requestPointerLock();
                }
                
                broadcastConfig();
                broadcastCustomizingState(false);
            } else {
                document.getElementById('pause-name-input').value = localP.name;
                const colorBtns = document.querySelectorAll('#pause-color-options .color-btn');
                colorBtns.forEach(btn => {
                    if (btn.getAttribute('data-color') === localP.color) {
                        btn.classList.add('active');
                        chosenColor = localP.color;
                    } else {
                        btn.classList.remove('active');
                    }
                });
                
                pauseOverlay.classList.remove('hidden');
                isPaused = true;
                isCustomizing = true;
                localP.isCustomizing = true;
                updatePlayerVisuals(localP);
                
                addChatMessageToLog(null, `${localP.name} is customizing their character...`, true);
                
                if (document.pointerLockElement === renderer.domElement) {
                    document.exitPointerLock();
                }
                
                broadcastCustomizingState(true);
            }
        }

        function createNametagSprite(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 36px "Inter", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 10;
            ctx.lineJoin = 'miter';
            ctx.miterLimit = 2;
            
            ctx.strokeText(name, canvas.width / 2, canvas.height / 2);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(name, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(1.5, 0.375, 1.0);
            return sprite;
        }

        function createSpeechBubbleSprite(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = 'bold 24px "Inter", sans-serif';
            const metrics = ctx.measureText(text);
            const textWidth = metrics.width;
            
            const paddingX = 20;
            const paddingY = 15;
            const bubbleW = Math.max(80, textWidth + paddingX * 2);
            const bubbleH = 60;
            
            const x = (canvas.width - bubbleW) / 2;
            const y = (canvas.height - bubbleH) / 2 - 10;
            
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#09090B';
            ctx.lineWidth = 6;
            
            ctx.fillRect(x, y, bubbleW, bubbleH);
            ctx.strokeRect(x, y, bubbleW, bubbleH);
            
            const arrowW = 16;
            const arrowH = 12;
            const ax = canvas.width / 2;
            const ay = y + bubbleH;
            
            ctx.beginPath();
            ctx.moveTo(ax - arrowW / 2, ay);
            ctx.lineTo(ax + arrowW / 2, ay);
            ctx.lineTo(ax, ay + arrowH);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(ax - arrowW / 2 + 3, ay - 3);
            ctx.lineTo(ax + arrowW / 2 - 3, ay - 3);
            ctx.lineTo(ax, ay + arrowH - 3);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#09090B';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, y + bubbleH / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(2.0, 1.0, 1.0);
            return sprite;
        }

        function showSpeechBubble(playerId, text) {
            const p = players.find(x => x.id === playerId);
            if (!p) return;
            
            addChatMessageToLog(p.name, text, false);
            
            if (!p.mesh) return;
            
            if (p.bubbleSprite) {
                p.mesh.remove(p.bubbleSprite);
                p.bubbleSprite.material.map.dispose();
                p.bubbleSprite.material.dispose();
            }
            
            p.bubbleSprite = createSpeechBubbleSprite(text);
            p.bubbleSprite.position.set(0, 0.75, 0);
            p.mesh.add(p.bubbleSprite);
            
            if (p.bubbleTimeout) clearTimeout(p.bubbleTimeout);
            p.bubbleTimeout = setTimeout(() => {
                if (p.bubbleSprite && p.mesh) {
                    p.mesh.remove(p.bubbleSprite);
                    p.bubbleSprite.material.map.dispose();
                    p.bubbleSprite.material.dispose();
                    p.bubbleSprite = null;
                }
            }, 4000);
        }

        const reactionParticles = [];

        function createReactionSprite(iconChar, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = '900 64px "Font Awesome 6 Free"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 8;
            ctx.strokeText(iconChar, canvas.width / 2, canvas.height / 2);
            ctx.fillStyle = color || '#ffffff';
            ctx.fillText(iconChar, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(0.6, 0.6, 1.0);
            return sprite;
        }

        function spawnEmotionLocal(playerId, iconChar, color, type) {
            const p = players[playerId - 1];
            if (!p || !p.mesh) return;
            
            const count = type === 'shocked' ? 1 : 4;
            for (let i = 0; i < count; i++) {
                const sprite = createReactionSprite(iconChar, color);
                sprite.position.copy(p.mesh.position);
                sprite.position.y += 0.5;
                
                sprite.position.x += (Math.random() - 0.5) * 0.4;
                sprite.position.z += (Math.random() - 0.5) * 0.4;
                
                scene.add(sprite);
                
                const vx = (Math.random() - 0.5) * 0.8;
                const vy = 1.2 + Math.random() * 1.5;
                const vz = (Math.random() - 0.5) * 0.8;
                
                reactionParticles.push({
                    sprite: sprite,
                    vx: vx,
                    vy: vy,
                    vz: vz,
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.02,
                    type: type
                });
            }
        }

        const startLobbyBtn = document.getElementById('start-lobby-btn');
        const customNameInput = document.getElementById('custom-name-input');
        const colorBtns = document.querySelectorAll('.color-btn');
        const customOverlay = document.getElementById('customization-overlay');

        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                colorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                chosenColor = btn.getAttribute('data-color');
            });
        });

        startLobbyBtn.addEventListener('click', () => {
            let nameVal = customNameInput.value.trim();
            if (!nameVal) nameVal = 'Player';
            
            const localP = players[localPlayerId - 1];
            if (localP) {
                localP.name = nameVal;
                localP.color = chosenColor;
                localP.isCustomizing = false;
                applyColorToPlayer(localPlayerId, chosenColor);
                
                if (localP.mesh) {
                    if (localP.nametagSprite) {
                        localP.mesh.remove(localP.nametagSprite);
                        localP.nametagSprite.material.map.dispose();
                        localP.nametagSprite.material.dispose();
                    }
                    localP.nametagSprite = createNametagSprite(localP.name);
                    localP.nametagSprite.position.set(0, 0.45, 0);
                    localP.mesh.add(localP.nametagSprite);
                }
            }

            customOverlay.classList.add('hidden');
            isCustomizing = false;

            addChatMessageToLog(null, `${nameVal} joined the lobby.`, true);

            savePreference('name', nameVal);
            savePreference('color', chosenColor);

            broadcastConfig();
            broadcastCustomizingState(false);
        });

        customNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                startLobbyBtn.click();
            }
        });

        document.getElementById('pause-btn').addEventListener('click', () => {
            if (isCustomizing && !isPaused) return;
            togglePause();
        });

        document.getElementById('resume-btn').addEventListener('click', togglePause);

        const pauseColorBtns = document.querySelectorAll('#pause-color-options .color-btn');
        pauseColorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                pauseColorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                chosenColor = btn.getAttribute('data-color');
            });
        });

        const pauseFovInput = document.getElementById('pause-fov-input');
        const fovValLabel = document.getElementById('fov-val');
        
        pauseFovInput.addEventListener('input', (e) => {
            const val = e.target.value;
            fovValLabel.innerText = val;
            camera.fov = parseInt(val, 10);
            camera.updateProjectionMatrix();
        });

        function initPreferencesDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open('game_preferences_db', 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('preferences')) {
                        db.createObjectStore('preferences');
                    }
                };
                request.onsuccess = (e) => {
                    resolve(e.target.result);
                };
                request.onerror = () => {
                    resolve(null);
                };
            });
        }

        function savePreference(key, value) {
            initPreferencesDB().then((db) => {
                if (!db) return;
                const tx = db.transaction('preferences', 'readwrite');
                const store = tx.objectStore('preferences');
                store.put(value, key);
            });
        }

        function getPreference(key) {
            return new Promise((resolve) => {
                initPreferencesDB().then((db) => {
                    if (!db) {
                        resolve(null);
                        return;
                    }
                    const tx = db.transaction('preferences', 'readonly');
                    const store = tx.objectStore('preferences');
                    const request = store.get(key);
                    request.onsuccess = (e) => {
                        resolve(e.target.result);
                    };
                    request.onerror = () => {
                        resolve(null);
                    };
                });
            });
        }

        function loadSavedPreferences() {
            Promise.all([getPreference('name'), getPreference('color'), getPreference('fov')]).then(([savedName, savedColor, savedFov]) => {
                const localP = players[localPlayerId - 1];
                
                if (savedFov) {
                    const fovNum = parseInt(savedFov, 10);
                    camera.fov = fovNum;
                    camera.updateProjectionMatrix();
                    if (pauseFovInput) {
                        pauseFovInput.value = fovNum;
                        fovValLabel.innerText = fovNum;
                    }
                }
                
                if (savedName && savedColor) {
                    document.getElementById('custom-name-input').value = savedName;
                    document.getElementById('pause-name-input').value = savedName;
                    chosenColor = savedColor;
                    
                    const colorBtns = document.querySelectorAll('.color-options .color-btn');
                    colorBtns.forEach(btn => {
                        if (btn.getAttribute('data-color') === savedColor) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                    
                    if (localP) {
                        localP.name = savedName;
                        localP.color = savedColor;
                        localP.isCustomizing = false;
                        applyColorToPlayer(localPlayerId, savedColor);
                        
                        if (localP.mesh) {
                            if (localP.nametagSprite) {
                                localP.mesh.remove(localP.nametagSprite);
                                localP.nametagSprite.material.map.dispose();
                                localP.nametagSprite.material.dispose();
                            }
                            localP.nametagSprite = createNametagSprite(localP.name);
                            localP.nametagSprite.position.set(0, 0.45, 0);
                            localP.mesh.add(localP.nametagSprite);
                        }
                    }
                    
                    document.getElementById('customization-overlay').classList.add('hidden');
                    isCustomizing = false;
                    
                    addChatMessageToLog(null, `${savedName} joined the lobby.`, true);
                    
                    broadcastConfig();
                    broadcastCustomizingState(false);
                } else {
                    document.getElementById('customization-overlay').classList.remove('hidden');
                }
            });
        }

        loadSavedPreferences();

        document.addEventListener('mousemove', (e) => {
            if (isFirstPerson && document.pointerLockElement === renderer.domElement) {
                fpYaw -= e.movementX * 0.002;
                fpPitch -= e.movementY * 0.002;
                fpPitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, fpPitch));
            }
        });

        renderer.domElement.addEventListener('click', () => {
            if (isFirstPerson) {
                renderer.domElement.requestPointerLock();
            }
        });

        animate();
    </script>
</body>
