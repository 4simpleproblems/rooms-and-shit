<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms & Shit | Lobby</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg-creme: #F4F1E1;
            --tree-creme: #E8E4CE;
            --color-theater: #FF3366;
            --color-lobby: #E2FF3D;
            --color-music: #8A2BE2;
            --black-outline: #09090B;
            --white-ui: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            overflow: hidden; 
            color: var(--black-outline);
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; 
        }

        .ui-panel {
            pointer-events: auto; 
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 6px solid var(--black-outline); 
            box-shadow: 8px 8px 0px var(--black-outline);
            border-radius: 0px; 
            padding: 16px;
            position: absolute;
            box-sizing: border-box;
        }

        .header-panel {
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            font-family: 'Alfa Slab One', cursive;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin: 0;
        }

        .ui-btn {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            text-align: center;
            text-transform: uppercase;
            background: var(--white-ui);
            border: 4px solid var(--black-outline); 
            border-radius: 0px; 
            box-shadow: 4px 4px 0px var(--black-outline);
            cursor: pointer;
            padding: 10px 16px;
            transition: transform 0.05s linear, box-shadow 0.05s linear;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .ui-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--black-outline);
        }

        .ui-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--black-outline);
        }

        .ui-btn.primary {
            background: var(--color-lobby);
        }

        .controls-panel {
            top: 24px;
            right: 24px;
            width: 260px;
        }

        .controls-panel h3 {
            font-family: 'Alfa Slab One', cursive;
            font-size: 1rem;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .control-key {
            background: #E4E4E7;
            border: 2px solid var(--black-outline);
            border-radius: 4px;
            padding: 2px 6px;
            box-shadow: 1px 1px 0px var(--black-outline);
            font-family: monospace;
            font-weight: 900;
        }

        .connection-panel {
            background: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .emotions-panel {
            background: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        #chat-log-panel {
            position: absolute;
            bottom: 180px;
            left: 24px;
            width: 380px;
            max-height: 200px;
            overflow-y: auto;
            pointer-events: none;
            display: flex;
            flex-direction: column-reverse;
            z-index: 100;
        }

        .chat-panel {
            bottom: 24px;
            left: 24px;
            width: 380px;
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .emotions-panel {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .emotion-btn {
            width: 50px;
            height: 50px;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .neo-prompt {
            background: var(--color-lobby);
            border: 3px solid var(--black-outline);
            box-shadow: 3px 3px 0px var(--black-outline);
            padding: 6px 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 0.8rem;
            color: var(--black-outline);
            pointer-events: none;
            z-index: 40;
        }

        .key-cap {
            background: var(--white-ui);
            border: 2px solid var(--black-outline);
            padding: 1px 6px;
            border-radius: 3px;
            box-shadow: 1px 1px 0px var(--black-outline);
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #FFFFFF; 
            z-index: 100; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 1.5s ease-in-out; 
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 40px;
            box-sizing: border-box;
        }

        #fade-overlay.visible {
            opacity: 1;
            pointer-events: auto; 
        }

        .mobile-menu-drawer {
            position: absolute;
            top: 0;
            right: 0;
            width: 320px;
            height: 100%;
            background: var(--bg-creme);
            border-left: 6px solid var(--black-outline);
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 150;
            pointer-events: auto;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        
        .mobile-menu-drawer.open {
            transform: translateX(0);
        }
        
        .drawer-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 9, 11, 0.4);
            z-index: 140;
            display: none;
            pointer-events: auto;
        }

        #mobile-menu-btn {
            display: none;
        }

        #mobile-joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--black-outline);
            background: rgba(244, 241, 225, 0.9);
            box-shadow: 4px 4px 0px var(--black-outline);
            display: none;
            z-index: 100;
            pointer-events: auto;
            touch-action: none;
        }

        #mobile-joystick-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 4px solid var(--black-outline);
            background: var(--color-lobby);
            box-shadow: 2px 2px 0px var(--black-outline);
            pointer-events: none;
        }

        #mobile-actions-container {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: none;
            gap: 16px;
            z-index: 100;
            pointer-events: auto;
        }

        #mobile-jump-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid var(--black-outline);
            background: var(--white-ui);
            box-shadow: 4px 4px 0px var(--black-outline);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Alfa Slab One', cursive;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }

        #mobile-explode-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid var(--black-outline);
            background: #FF3366;
            box-shadow: 4px 4px 0px var(--black-outline);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Alfa Slab One', cursive;
            font-size: 0.8rem;
            color: var(--black-outline);
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }

        @media (max-width: 768px) {
            .header-panel {
                top: 16px;
                left: 16px;
                padding: 10px;
                gap: 10px;
            }
            .header-title {
                font-size: 1.1rem;
            }
            .ui-btn {
                padding: 8px 12px;
                font-size: 0.85rem;
                border: 3px solid var(--black-outline);
                box-shadow: 3px 3px 0px var(--black-outline);
            }
            #mobile-menu-btn {
                display: inline-flex;
            }
        }

        #customization-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #customization-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .custom-card {
            background: var(--white-ui);
            border: 6px solid var(--black-outline);
            box-shadow: 12px 12px 0px var(--black-outline);
            padding: 32px;
            width: 380px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: auto;
        }

        .custom-title {
            font-family: 'Alfa Slab One', cursive;
            font-size: 1.8rem;
            margin: 0;
            text-align: center;
            letter-spacing: 1px;
        }

        .custom-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .custom-field label {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        #custom-name-input {
            border: 4px solid var(--black-outline);
            padding: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            outline: none;
            background: #FFFFFF;
        }

        .color-options {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .color-btn {
            aspect-ratio: 1;
            border: 4px solid var(--black-outline);
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--black-outline);
            transition: transform 0.05s, box-shadow 0.05s;
        }

        .color-btn.active {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--black-outline);
            outline: none;
        }

        .color-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--black-outline);
        }

        .nametag {
            position: absolute;
            transform: translate(-50%, -100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            z-index: 45;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            background: #FFFFFF;
            border: 4px solid var(--black-outline);
            border-radius: 0px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--color-lobby);
            border: 4px solid var(--black-outline);
            cursor: pointer;
            border-radius: 0px;
        }

        #pause-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #pause-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #chat-log-panel {
            position: absolute;
            bottom: 262px;
            left: 24px;
            width: 380px;
            height: 200px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background: var(--white-ui);
            border: 6px solid var(--black-outline);
            box-shadow: 8px 8px 0px var(--black-outline);
            border-radius: 0px;
            padding: 12px;
            z-index: 10;
        }

        #chat-log-list {
            flex-grow: 1;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        #chat-log-list::-webkit-scrollbar {
            width: 8px;
        }

        #chat-log-list::-webkit-scrollbar-track {
            background: #F4F1E1;
            border-left: 2px solid var(--black-outline);
        }

        #chat-log-list::-webkit-scrollbar-thumb {
            background: var(--black-outline);
        }

        .chat-msg {
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-msg-system {
            color: #8A2BE2;
            font-style: italic;
        }

        .chat-msg-player {
            color: var(--black-outline);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            background: #F4F1E1;
            border: 3px solid var(--black-outline);
            outline: none;
            box-sizing: border-box;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--color-lobby);
            border: 3px solid var(--black-outline);
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--black-outline);
        }
    </style>
</head>
<body>


    <div id="fade-overlay" class="visible">
        <i class="fa-solid fa-spinner fade-spinner"></i>
    </div>

    <div id="underwater-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(17, 34, 68, 0.55); pointer-events: none; z-index: 9; display: none;"></div>

    <div id="sit-prompt" style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background-color: rgba(4, 4, 5, 0.85); color: #ffffff; padding: 8px 16px; border: 3px solid #ffffff; border-radius: 4px; font-family: monospace; font-size: 16px; font-weight: bold; pointer-events: none; z-index: 10; display: none; text-align: center; box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5);"></div>

    <div id="stamina-container" style="position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); width: 480px; height: 36px; background-color: #ffffff; border: 4px solid var(--black-outline); box-shadow: 6px 6px 0px var(--black-outline); z-index: 10; box-sizing: border-box;">
        <div id="stamina-bar" style="width: 100%; height: 100%; background-color: #E2FF3D;"></div>
    </div>

    <div id="customization-overlay" class="hidden">
        <div class="custom-card">
            <h2 class="custom-title">CUSTOMIZE CHARACTER</h2>
            
            <div class="custom-field">
                <label for="custom-name-input">YOUR NAME</label>
                <input type="text" id="custom-name-input" value="Player" maxlength="15" placeholder="Enter name..." />
            </div>
            
            <div class="custom-field">
                <label>CHOOSE COLOR</label>
                <div class="color-options">
                    <button class="color-btn active" data-color="#E2FF3D" style="background-color: #E2FF3D;"></button>
                    <button class="color-btn" data-color="#FF3366" style="background-color: #FF3366;"></button>
                    <button class="color-btn" data-color="#8A2BE2" style="background-color: #8A2BE2;"></button>
                    <button class="color-btn" data-color="#33ccff" style="background-color: #33ccff;"></button>
                    <button class="color-btn" data-color="#33ff33" style="background-color: #33ff33;"></button>
                    <button class="color-btn" data-color="#ff9933" style="background-color: #ff9933;"></button>
                    <button class="color-btn" data-color="#ff33ff" style="background-color: #ff33ff;"></button>
                    <button class="color-btn" data-color="#ffff33" style="background-color: #ffff33;"></button>
                    <button class="color-btn" data-color="#33ffff" style="background-color: #33ffff;"></button>
                    <button class="color-btn" data-color="#ff3333" style="background-color: #ff3333;"></button>
                    <button class="color-btn" data-color="#996633" style="background-color: #996633;"></button>
                    <button class="color-btn" data-color="#ff9999" style="background-color: #ff9999;"></button>
                </div>
            </div>
            
            <button id="start-lobby-btn" class="ui-btn primary" style="width: 100%; justify-content: center; font-size: 1.2rem; margin-top: 12px;">
                ENTER LOBBY
            </button>
        </div>
    </div>

    <div id="pause-overlay" class="hidden">
        <div class="custom-card">
            <h2 class="custom-title">PAUSED</h2>
            
            <div class="custom-field">
                <label for="pause-name-input">CUSTOMIZE NAME</label>
                <input type="text" id="pause-name-input" value="Player" maxlength="15" placeholder="Enter name..." />
            </div>
            
            <div class="custom-field">
                <label>CHOOSE COLOR</label>
                <div class="color-options" id="pause-color-options">
                    <button class="color-btn active" data-color="#E2FF3D" style="background-color: #E2FF3D;"></button>
                    <button class="color-btn" data-color="#FF3366" style="background-color: #FF3366;"></button>
                    <button class="color-btn" data-color="#8A2BE2" style="background-color: #8A2BE2;"></button>
                    <button class="color-btn" data-color="#33ccff" style="background-color: #33ccff;"></button>
                    <button class="color-btn" data-color="#33ff33" style="background-color: #33ff33;"></button>
                    <button class="color-btn" data-color="#ff9933" style="background-color: #ff9933;"></button>
                    <button class="color-btn" data-color="#ff33ff" style="background-color: #ff33ff;"></button>
                    <button class="color-btn" data-color="#ffff33" style="background-color: #ffff33;"></button>
                    <button class="color-btn" data-color="#33ffff" style="background-color: #33ffff;"></button>
                    <button class="color-btn" data-color="#ff3333" style="background-color: #ff3333;"></button>
                    <button class="color-btn" data-color="#996633" style="background-color: #996633;"></button>
                    <button class="color-btn" data-color="#ff9999" style="background-color: #ff9999;"></button>
                </div>
            </div>
            
            <div class="custom-field">
                <label for="pause-fov-input">FIELD OF VIEW (FOV): <span id="fov-val">90</span></label>
                <input type="range" id="pause-fov-input" min="60" max="120" value="90" />
            </div>
            
            <button id="resume-btn" class="ui-btn primary" style="width: 100%; justify-content: center; font-size: 1.2rem; margin-top: 12px;">
                RESUME PLAY
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="ui-panel header-panel">
            <button id="back-btn" class="ui-btn"><i class="fa-solid fa-arrow-left"></i> Map</button>
            <button id="pause-btn" class="ui-btn"><i class="fa-solid fa-pause"></i> Pause</button>
            <h1 class="header-title">Lobby Room</h1>
            <button id="mobile-menu-btn" class="ui-btn primary"><i class="fa-solid fa-comments"></i> Menu</button>
        </div>

        <div id="chat-log-panel">
            <ul id="chat-log-list"></ul>
        </div>

        <div class="ui-panel controls-panel" style="width: 320px;">
            <h3>Lobby Controls</h3>
            <div class="control-row">
                <span>Move</span>
                <span class="control-key">WASD / Arrows</span>
            </div>
            <div class="control-row">
                <span>Jump</span>
                <span class="control-key">Space</span>
            </div>
            <div class="control-row">
                <span>Explode</span>
                <span class="control-key">E / /</span>
            </div>
        </div>

        <div class="ui-panel connection-panel" style="bottom: 120px; left: 24px; width: 380px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
            <h3 style="font-family: 'Alfa Slab One', cursive; font-size: 0.95rem; margin: 0; letter-spacing: 0.5px; color: var(--black-outline);">PLAY WITH FRIENDS</h3>
            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; font-weight: 700; background: #F4F1E1; border: 3px solid var(--black-outline); padding: 6px 10px;">
                <span style="color: var(--black-outline);">Room ID: <span id="my-peer-id-label" style="font-family: monospace; font-size: 0.85rem; font-weight: 900;">Loading...</span></span>
                <button id="copy-id-btn" class="ui-btn" style="padding: 2px 6px; font-size: 0.7rem; box-shadow: 2px 2px 0px var(--black-outline); height: 22px; display: flex; align-items: center;"><i class="fa-solid fa-copy"></i> Copy</button>
            </div>
            <div style="display: flex; gap: 6px;">

                        vec4 texColor = texture2D(map, vUv);
                        if (texColor.a < 0.05) discard;
                        vec3 baseColor = texColor.rgb * color;
                        if (isGreyscale > 0.5) {
                            float grey = dot(baseColor, vec3(0.299, 0.587, 0.114));
                            baseColor = vec3(grey);
                        }
                        vec3 lightDir = normalize(vec3(12.0, 24.0, 12.0));
                        vec3 viewLightDir = normalize((viewMatrix * vec4(lightDir, 0.0)).xyz);
                        float dotNL = dot(normalize(vNormal), viewLightDir);
                        float shade = 0.45;
                        if (dotNL > 0.5) {
                            shade = 1.0;
                        } else if (dotNL > 0.0) {
                            shade = 0.75;
                        }
                        vec3 finalColor = baseColor * shade;
                        gl_FragColor = vec4(finalColor, opacity);
                    }
                `,
                transparent: false,
                side: THREE.DoubleSide
            });
            return mat;
        }

        function updatePlayerVisuals(p) {
            if (!p || !p.mesh) return;
            p.mesh.traverse((child) => {
                if (child.isMesh && child.material && child.material.uniforms) {
                    child.material.uniforms.color.value.setStyle(p.color);
                    const isCustomizing = !!p.isCustomizing;
                    child.material.uniforms.opacity.value = isCustomizing ? 0.4 : 1.0;
                    child.material.uniforms.isGreyscale.value = isCustomizing ? 1.0 : 0.0;
                    child.material.transparent = isCustomizing;
                    child.material.depthWrite = !isCustomizing;
                }
            });
        }

        function applyColorToPlayer(playerId, colorHex) {
            const p = players[playerId - 1];
            if (p) {
                p.color = colorHex;
                updatePlayerVisuals(p);
            }
        }

        function toggleSitLocalPlayer() {
            const p = players[localPlayerId - 1];
            if (!p || !p.mesh) return;

            if (p.isSitting) {
                p.isSitting = false;
                p.mesh.position.y = parkTopY + 0.7;
                return;
            }

            const dx = p.mesh.position.x - 27;
            const dz = p.mesh.position.z - (-1.0);
            const distToLog = Math.sqrt(dx * dx + dz * dz);

            if (distToLog < 1.8 && Math.abs(p.mesh.position.y - (parkTopY + 0.35)) < 1.5) {
                const sitZSpots = [-2.2, -1.0, 0.2];
                let closestSpotIdx = -1;
                let minD = 999;

                for (let i = 0; i < sitZSpots.length; i++) {
                    let occupied = false;
                    for (const other of players) {
                        if (other.id !== localPlayerId && other.mesh) {
                            const distToSpot = other.mesh.position.distanceTo(new THREE.Vector3(27, parkTopY + 0.35 + 0.08, sitZSpots[i]));
                            if (distToSpot < 0.5) {
                                occupied = true;
                                break;
                            }
                        }
                    }
                    if (occupied) continue;

                    const d = Math.abs(p.mesh.position.z - sitZSpots[i]);
                    if (d < minD) {
                        minD = d;
                        closestSpotIdx = i;
                    }
                }

                if (closestSpotIdx !== -1) {
                    p.isSitting = true;
                    p.sitSpotIndex = closestSpotIdx;
                    p.vx = 0;
                    p.vz = 0;
                    p.yVelocity = 0;
                    p.isJumping = false;
                    p.mesh.position.set(27, parkTopY + 0.35 + 0.08, sitZSpots[closestSpotIdx]);
                    p.mesh.rotation.set(0, -Math.PI / 2, 0);
                }
            }
        }

        function loadModel(url) {
            return new Promise((resolve, reject) => {
                loader.load(url, (gltf) => resolve(gltf), undefined, reject);
            });
        }

        function parseEmbeddedGLTF(jsonStr) {
            return new Promise((resolve, reject) => {
                try {
                    loader.parse(jsonStr.replace(/[\n\r]/g, ''), '', (gltf) => {
                        resolve(gltf);
                    }, reject);
                } catch (err) {
                    reject(err);
                }
            });
        }

        loadPlayers();

        function loadPlayers() {
            const cacheBust = "?t=" + Date.now();
            Promise.all([
                loadModel("model/character.gltf" + cacheBust),
                loadModel("model/char-sitting.gltf" + cacheBust),
                fetch("animations.json" + cacheBust).then(r => r.json())
            ]).then(([charGltf, sitGltf, animJson]) => {
                const animations = animJson.map(a => THREE.AnimationClip.parse(a));
                setupPlayersWithScenes(charGltf, sitGltf, animations);
            }).catch(err => {
                console.error("Error loading models or animations:", err);
                loadModel("model/character.gltf" + cacheBust)
                    .then((charGltf) => {
                        parseEmbeddedGLTF(CHAR_SITTING_GLTF_DATA)
                            .then((sitGltf) => {
                                setupPlayersWithScenes(charGltf, sitGltf, charGltf.animations);
                            })
                            .catch(err2 => {
                                console.error("Error parsing embedded sit model:", err2);
                            });
                    })
                    .catch(err3 => {
                        console.error("Failed to load player models:", err3);
                    });
            });
        }

        function setupPlayersWithScenes(charGltf, sitGltf, animations) {
            const charScene = charGltf.scene;
            const sitScene = sitGltf.scene;
            // animations are now passed in from animations.json (or fallback)

            for (let i = 0; i < 3; i++) {
                const p = players[i];
                
                const parentGroup = new THREE.Group();
                parentGroup.position.copy(p.position);
                
                const standingMesh = charScene.clone();
                standingMesh.scale.set(CHARACTER_SCALE, CHARACTER_SCALE, CHARACTER_SCALE);
                standingMesh.position.y = -0.0625;
                standingMesh.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        child.material = createToonMaterial(child.material.map, p.color);
                    }
                });
                parentGroup.add(standingMesh);
                p.standingMesh = standingMesh;

                if (animations && animations.length > 0) {
                    p.mixer = new THREE.AnimationMixer(standingMesh);
                    const stompClip = THREE.AnimationClip.findByName(animations, "Stomp");
                    if (stompClip) {
                        p.stompAction = p.mixer.clipAction(stompClip);
                        p.stompAction.setLoop(THREE.LoopRepeat);
                    }
                }
                
                const sittingMesh = sitScene.clone();
                sittingMesh.scale.set(CHARACTER_SCALE, CHARACTER_SCALE, CHARACTER_SCALE);
                sittingMesh.position.y = -0.0625;
                sittingMesh.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        child.material = createToonMaterial(child.material.map, p.color);
                    }
                });
                sittingMesh.visible = false;
                parentGroup.add(sittingMesh);
                p.sittingMesh = sittingMesh;
                
                scene.add(parentGroup);
                p.mesh = parentGroup;
                
                applyColorToPlayer(i + 1, p.color);
                
                p.nametagSprite = createNametagSprite(p.name);
                p.nametagSprite.position.set(0, 0.45, 0);
                p.mesh.add(p.nametagSprite);
                
                updatePlayerVisuals(p);

            addChatMessageToLog(null, `${players[0].name} is customizing their character...`, true);

                            newP.nametagSprite.position.set(0, 0.45, 0);
                            newP.mesh.add(newP.nametagSprite);
                        }
                        
                        oldP.name = `Player ${oldLocalId}`;
                        if (oldP.mesh) {
                            if (oldP.nametagSprite) {
                                oldP.mesh.remove(oldP.nametagSprite);
                                oldP.nametagSprite.material.map.dispose();
                                oldP.nametagSprite.material.dispose();
                            }
                            oldP.nametagSprite = createNametagSprite(oldP.name);
                            oldP.nametagSprite.position.set(0, 0.45, 0);
                            oldP.mesh.add(oldP.nametagSprite);
                        }
                    }
                    
                    document.getElementById('connection-status').innerText = `Status: Playing as P${localPlayerId}`;
                    for (const p of players) {
                        if (p.id !== localPlayerId) {
                            p.isRemotePeer = true;
                            p.isRemote = true;
                        }
                    }
                    
                    broadcastConfig();
                }
            });
            
            setupConnection(conn);
        });

        function setupConnection(conn, remoteId = null) {
            if (conn.open) {
                sendLocalConfigTo(conn);
            } else {
                conn.on('open', () => {
                    sendLocalConfigTo(conn);
                });
            }

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    const id = remoteId || data.id;
                    const p = players[id - 1];
                    if (p && p.mesh) {
                        p.mesh.position.set(data.x, data.y, data.z);
                        p.mesh.rotation.set(0, data.ry, data.rz);
                        p.isJumping = data.isJumping;
                        p.isSitting = data.isSitting || false;
                        if (p.standingMesh && p.sittingMesh) {
                            p.standingMesh.visible = !p.isSitting;
                            p.sittingMesh.visible = p.isSitting;
                        }
                    }
                    if (isHost) {
                        for (const otherConn of connections) {
                            if (otherConn !== conn && otherConn.open) {
                                otherConn.send(data);
                            }
                        }
                    }
                } else if (data.type === 'explode') {
                    const id = remoteId || data.id;
                    triggerExplosionLocal(id);
                    if (isHost) {
                        for (const otherConn of connections) {
                            if (otherConn !== conn && otherConn.open) {
                                otherConn.send(data);
                            }
                        }
                    }
                } else if (data.type === 'respawn') {
                    const id = remoteId || data.id;
                    respawnPlayerLocal(id, data.rx, data.rz);
                    if (isHost) {
                        for (const otherConn of connections) {
                            if (otherConn !== conn && otherConn.open) {
                                otherConn.send(data);
                            }
                        }
                    }
                } else if (data.type === 'chat') {
                    const id = remoteId || data.id;
                    showSpeechBubble(id, data.text);
                    if (isHost) {
                        for (const otherConn of connections) {
                            if (otherConn !== conn && otherConn.open) {
                                otherConn.send(data);
                            }
                        }
                    }
                } else if (data.type === 'emotion') {
                    const id = remoteId || data.id;
                    spawnEmotionLocal(id, data.iconClass, data.color, data.animClass);
                    if (isHost) {
                        for (const otherConn of connections) {
                            if (otherConn !== conn && otherConn.open) {
                                otherConn.send(data);
                            }
                        }
                    }
                } else if (data.type === 'config') {
                    const id = remoteId || data.id;
                    const p = players[id - 1];
                    if (p) {
                        p.name = data.name;
                        p.color = data.color;
                        applyColorToPlayer(id, data.color);
                    }
                    if (isHost) {
                        for (const otherConn of connections) {
                            if (otherConn !== conn && otherConn.open) {
                                otherConn.send(data);
                            }
                        }
                    }
                } else if (data.type === 'customizing') {
                    const id = remoteId || data.id;
                    const p = players[id - 1];
                    if (p) {
                        p.isCustomizing = data.isCustomizing;
                        updatePlayerVisuals(p);
                        if (data.isCustomizing) {
                            addChatMessageToLog(null, `${p.name} is customizing their character...`, true);
                        } else {
                            addChatMessageToLog(null, `${p.name} finished customizing.`, true);
                        }
                    }
                    if (isHost) {
                        for (const otherConn of connections) {
                            if (otherConn !== conn && otherConn.open) {
                                otherConn.send(data);
                            }
                        }
                    }
                }
            });
            
            conn.on('close', () => {
                document.getElementById('connection-status').innerText = 'Status: Connection closed.';
            });
        }

        function switchActivePlayer(newId) {
            if (newId === localPlayerId) return;
            const oldP = players[localPlayerId - 1];
            if (oldP) {
                oldP.keys.up = false;
                oldP.keys.down = false;
                oldP.keys.left = false;
                oldP.keys.right = false;
                oldP.keys.space = false;
                oldP.keys.shift = false;
                if (isFirstPerson && oldP.mesh) {
                    oldP.mesh.visible = true;
                }
                oldP.isRemotePeer = false;
                oldP.isRemote = false;
            }
            localPlayerId = newId;
            const newP = players[localPlayerId - 1];
            if (newP) {
                if (isFirstPerson && newP.mesh) {
                    newP.mesh.visible = false;
                }
                newP.isRemotePeer = false;
                newP.isRemote = false;
            }
            const statusEl = document.getElementById('connection-status');
            if (statusEl) {
                if (connections.length > 0) {
                    statusEl.innerText = `Status: Playing as P${localPlayerId}`;
                } else {
                    statusEl.innerText = `Status: Local Mode (P${localPlayerId})`;
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'escape') {
                if (isCustomizing && !isPaused) {
                    return;
                }
                togglePause();
                return;
            }

            if (isCustomizing) return;
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                return;
            }

            if (key === '1') {
                switchActivePlayer(1);
            } else if (key === '2') {
                switchActivePlayer(2);
            } else if (key === '3') {
                switchActivePlayer(3);
            }

            const p = players[localPlayerId - 1];
            if (!p) return;
            
            if (key === 'arrowup' || key === 'w') p.keys.up = true;
            else if (key === 'arrowdown' || key === 's') p.keys.down = true;
            else if (key === 'arrowleft' || key === 'a') p.keys.left = true;
            else if (key === 'arrowright' || key === 'd') p.keys.right = true;
            else if (key === ' ' || key === 'spacebar' || key === '\u00a0' || e.code === 'Space') p.keys.space = true;
            else if (key === 'shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') p.keys.shift = true;
            else if ((key === '/' || key === 'e') && !e.repeat) {
                let handled = false;
                if (key === 'e' && !p.isCustomizing) {
                    const distToLogX = Math.abs(p.mesh.position.x - 27);
                    const distToLogZ = p.mesh.position.z >= -2.8 && p.mesh.position.z <= 0.8 ? 0 : Math.min(Math.abs(p.mesh.position.z - (-2.8)), Math.abs(p.mesh.position.z - 0.8));
                    const distToLogY = Math.abs(p.mesh.position.y - (parkTopY + 0.35));
                    const isNearLog = (distToLogX < 1.8 && distToLogZ < 1.8 && distToLogY < 1.5);
                    if (p.isSitting || isNearLog) {
                        toggleSitLocalPlayer();
                        handled = true;
                    }
                }
                if (!handled) {
                    triggerExplosion(localPlayerId);
                }
            }
            else if (key === 'c') {
                isFirstPerson = !isFirstPerson;
                if (isFirstPerson) {
                    controls.enabled = false;
                    const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                    fpYaw = euler.y;
                    fpPitch = euler.x;
                    renderer.domElement.requestPointerLock();
                    if (p.mesh) p.mesh.visible = false;
                } else {
                    controls.enabled = true;
                    if (document.pointerLockElement === renderer.domElement) {
                        document.exitPointerLock();
                    }
                    if (p.mesh) p.mesh.visible = true;
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    forward.y = 0.5;
                    forward.normalize();
                    camera.position.copy(controls.target).addScaledVector(forward, -15);
                    controls.update();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (isCustomizing) return;
            const key = e.key.toLowerCase();
            const p = players[localPlayerId - 1];
            if (!p) return;
            
            if (key === 'arrowup' || key === 'w') p.keys.up = false;
            else if (key === 'arrowdown' || key === 's') p.keys.down = false;
            else if (key === 'arrowleft' || key === 'a') p.keys.left = false;
            else if (key === 'arrowright' || key === 'd') p.keys.right = false;
            else if (key === ' ' || key === 'spacebar' || key === '\u00a0' || e.code === 'Space') p.keys.space = false;
            else if (key === 'shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') p.keys.shift = false;
        });

        function createWaterSplash(x, y, z) {
            for (let i = 0; i < 5; i++) {
                const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
                const mat = new THREE.MeshBasicMaterial({ color: 0x99ccff, transparent: true, opacity: 0.8 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x + (Math.random()-0.5)*0.5, y, z + (Math.random()-0.5)*0.5);
                scene.add(mesh);
                dustParticles.push({
                    mesh: mesh,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: 1.5 + Math.random() * 2.0,
                    vz: (Math.random() - 0.5) * 1.5,
                    life: 1.0,
                    decay: 0.05
                });
            }
        }

        function getGroundY(playerId, pos) {
            const onPlatform = (pos.y >= floorY - 0.2) && (pos.x >= -PLATFORM_SIZE / 2 && pos.x <= PLATFORM_SIZE / 2 && pos.z >= -PLATFORM_SIZE / 2 && pos.z <= PLATFORM_SIZE / 2);
            let groundY = onPlatform ? floorY : -999.0;
            const charRadius = 0.12 * CHARACTER_SCALE;

            // Pond shallow walking
            const pdx = pos.x - pondData.center.x;
            const pdz = pos.z - pondData.center.z;
            const pdist = Math.sqrt(pdx * pdx + pdz * pdz);
            if (pdist < pondData.radius) {
                // If in pond circle, return the bottom of the pond as ground
                return pondData.bottomY;
            }

            for (const po of physicsObjects) {
                if (po.radius && po.mesh) {
                    const dx = pos.x - po.mesh.position.x;
                    const dz = pos.z - po.mesh.position.z;
                    const distH = Math.sqrt(dx * dx + dz * dz);
                    if (distH < po.radius + charRadius) {
                        const localDist = Math.min(po.radius, distH);
                        const ballTopY = po.mesh.position.y + Math.sqrt(po.radius * po.radius - localDist * localDist);
                        if (pos.y >= ballTopY - 0.35) {
                            if (ballTopY > groundY) {
                                groundY = ballTopY;
                            }
                        }
                    }
                }
            }

            for (const plat of customPlatforms) {
                const localPos = new THREE.Vector3().copy(pos).sub(plat.position);
                const q = new THREE.Quaternion().copy(plat.quaternion);
                localPos.applyQuaternion(q.invert());
                const halfX = plat.scale.x / 2;
                const halfY = plat.scale.y / 2;
                const halfZ = plat.scale.z / 2;
                if (localPos.x >= -halfX - charRadius * 0.5 && localPos.x <= halfX + charRadius * 0.5 &&
                    localPos.z >= -halfZ - charRadius * 0.5 && localPos.z <= halfZ + charRadius * 0.5) {
                    const localTopPoint = new THREE.Vector3(localPos.x, halfY, localPos.z);
                    localTopPoint.applyQuaternion(plat.quaternion).add(plat.position);
                    if (pos.y >= localTopPoint.y - 0.25) {
                        if (localTopPoint.y > groundY) {
                            groundY = localTopPoint.y;
                        }
                    }
                }
            }
            for (const other of players) {
                if (other.id === playerId || !other.mesh) continue;
                const dx = pos.x - other.mesh.position.x;
                const dz = pos.z - other.mesh.position.z;
                const distH = Math.sqrt(dx * dx + dz * dz);
                if (distH < charRadius * 1.8) {
                    const otherHeadY = other.mesh.position.y + 0.65;
                    if (pos.y >= otherHeadY - 0.15) {
                        if (otherHeadY > groundY) {
                            groundY = otherHeadY;
                        }
                    }
                }
            }
            return groundY;
        }

        function isStandingOn(playerA, playerB) {
            if (!playerA.mesh || !playerB.mesh) return false;
            if (playerA.isJumping) return false;
            if (playerB.keys.shift) return false;
            const posA = playerA.lastFramePosition || playerA.mesh.position;
            const posB = playerB.lastFramePosition || playerB.mesh.position;
            const dx = posA.x - posB.x;
            const dz = posA.z - posB.z;
            const distH = Math.sqrt(dx * dx + dz * dz);
            const charRadius = 0.12 * CHARACTER_SCALE;
            if (distH < charRadius * 1.8) {
                const otherHeadY = posB.y + 0.65;
                if (Math.abs(posA.y - otherHeadY) <= 0.18) {
                    return true;
                }
            }
            return false;
        }

        function isStandingOnIgnoreSprint(playerA, playerB) {
            if (!playerA.mesh || !playerB.mesh) return false;
            if (playerA.isJumping) return false;
            const posA = playerA.lastFramePosition || playerA.mesh.position;
            const posB = playerB.lastFramePosition || playerB.mesh.position;
            const dx = posA.x - posB.x;
            const dz = posA.z - posB.z;
            const distH = Math.sqrt(dx * dx + dz * dz);
            const charRadius = 0.12 * CHARACTER_SCALE;
            if (distH < charRadius * 1.8) {
                const otherHeadY = posB.y + 0.65;
                if (Math.abs(posA.y - otherHeadY) <= 0.18) {
                    return true;
                }
            }
            return false;
        }

        function getStackRootIgnoreSprint(p) {
            for (const other of players) {
                if (other.id === p.id || !other.mesh) continue;
                if (isStandingOnIgnoreSprint(p, other)) {
                    return getStackRootIgnoreSprint(other);
                }
            }
            return p;
        }

        function inSameStackIgnoreSprint(playerA, playerB) {
            const rootA = getStackRootIgnoreSprint(playerA);
            const rootB = getStackRootIgnoreSprint(playerB);
            return rootA.id === rootB.id;
        }

        function updateStackPhysicsRecursive(p, completed = new Set()) {
            if (completed.has(p.id)) return;
            completed.add(p.id);
            if (p.isRemote) return;
            for (const other of players) {
                if (other.id === p.id || !other.mesh) continue;
                if (isStandingOn(p, other)) {
                    updateStackPhysicsRecursive(other, completed);
                    const lastPosOther = other.lastFramePosition || other.mesh.position;
                    const relX = p.mesh.position.x - lastPosOther.x;
                    const relZ = p.mesh.position.z - lastPosOther.z;
                    const theta = other.displacementRotY || 0;
                    const cos = Math.cos(theta);
                    const sin = Math.sin(theta);
                    const rotRelX = relX * cos - relZ * sin;
                    const rotRelZ = relX * sin + relZ * cos;
                    const oldPosX = p.mesh.position.x;
                    const oldPosZ = p.mesh.position.z;
                    const oldRotY = p.mesh.rotation.y;
                    const isWalking = p.keys && (p.keys.up || p.keys.down || p.keys.left || p.keys.right);
                    if (isWalking) {
                        p.mesh.position.x = other.mesh.position.x + rotRelX;
                        p.mesh.position.z = other.mesh.position.z + rotRelZ;
                    } else {
                        p.mesh.position.x = other.mesh.position.x;
                        p.mesh.position.z = other.mesh.position.z;
                    }
                    p.mesh.position.y = other.mesh.position.y + 0.65;
                    p.vx = 0;
                    p.vz = 0;
                    p.yVelocity = 0;
                    p.isJumping = false;
                    if (!(p.id === localPlayerId && isFirstPerson)) {
                        p.mesh.rotation.y += theta;
                    }
                    p.displacementX += (p.mesh.position.x - oldPosX);
                    p.displacementZ += (p.mesh.position.z - oldPosZ);
                    p.displacementRotY += (p.mesh.rotation.y - oldRotY);
                    while (p.displacementRotY < -Math.PI) p.displacementRotY += Math.PI * 2;
                    while (p.displacementRotY > Math.PI) p.displacementRotY -= Math.PI * 2;
                    break;
                }
            }
        }

        function getStackCount(p, visited = new Set()) {
            if (visited.has(p.id)) return 0;
            visited.add(p.id);
            let count = 0;
            for (const other of players) {
                if (other.id === p.id || !other.mesh) continue;
                if (isStandingOn(other, p)) {
                    count += 1 + getStackCount(other, visited);
                }
            }
            return count;
        }

        function getPlayerOverlap(player1Pos, player2Pos) {
            const charRadius = 0.12 * CHARACTER_SCALE;
            const playerHeight = 0.65;
            const p1MinX = player1Pos.x - charRadius;
            const p1MaxX = player1Pos.x + charRadius;
            const p1MinY = player1Pos.y;
            const p1MaxY = player1Pos.y + playerHeight;
            const p1MinZ = player1Pos.z - charRadius;
            const p1MaxZ = player1Pos.z + charRadius;
            const p2MinX = player2Pos.x - charRadius;
            const p2MaxX = player2Pos.x + charRadius;
            const p2MinY = player2Pos.y;
            const p2MaxY = player2Pos.y + playerHeight;
            const p2MinZ = player2Pos.z - charRadius;
            const p2MaxZ = player2Pos.z + charRadius;
            const overlapX = Math.max(0, Math.min(p1MaxX, p2MaxX) - Math.max(p1MinX, p2MinX));
            const overlapY = Math.max(0, Math.min(p1MaxY, p2MaxY) - Math.max(p1MinY, p2MinY));
            const overlapZ = Math.max(0, Math.min(p1MaxZ, p2MaxZ) - Math.max(p1MinZ, p2MinZ));
            if (overlapX > 0 && overlapY > 0 && overlapZ > 0) {
                return Math.min(overlapX, overlapY, overlapZ);
            }
            return 0;
        }

        function checkPlayerCollision(playerId, nextPosition) {
            const thisPlayer = players[playerId - 1];
            const currentPosition = (thisPlayer && thisPlayer.mesh) ? thisPlayer.mesh.position : nextPosition;
            for (const p of players) {
                if (p.id === playerId || !p.mesh) continue;
                if (thisPlayer && inSameStackIgnoreSprint(thisPlayer, p)) {
                    continue;
                }
                const yDiff = Math.abs(nextPosition.y - p.mesh.position.y);
                if (yDiff > 0.48) {
                    continue;
                }
                const overlapNext = getPlayerOverlap(nextPosition, p.mesh.position);
                if (overlapNext > 0) {
                    const overlapCurr = getPlayerOverlap(currentPosition, p.mesh.position);
                    if (overlapNext > overlapCurr) {
                        return true;
                    }
                }
            }
            return false;
        }

        function getFloorOverlap(playerPos) {
            const charRadius = 0.12 * CHARACTER_SCALE;
            const playerHeight = 0.65;
            const platMinX = -PLATFORM_SIZE / 2;
            const platMaxX = PLATFORM_SIZE / 2;
            const platMinZ = -PLATFORM_SIZE / 2;
            const platMaxZ = PLATFORM_SIZE / 2;
            const platMinY = floorY - PLATFORM_HEIGHT;
            const platMaxY = floorY;
            const pMinX = playerPos.x - charRadius;
            const pMaxX = playerPos.x + charRadius;
            const pMinY = playerPos.y;
            const pMaxY = playerPos.y + playerHeight;
            const pMinZ = playerPos.z - charRadius;
            const pMaxZ = playerPos.z + charRadius;
            const overlapX = Math.max(0, Math.min(pMaxX, platMaxX) - Math.max(pMinX, platMinX));
            const Math_overlapY = Math.max(0, Math.min(pMaxY, platMaxY) - Math.max(pMinY, platMinY));
            const overlapZ = Math.max(0, Math.min(pMaxZ, platMaxZ) - Math.max(pMinZ, platMinZ));
            if (overlapX > 0 && Math_overlapY > 0 && overlapZ > 0) {
                return Math.min(overlapX, Math_overlapY, overlapZ);
            }
            return 0;
        }

        function getPlatformOverlap(plat, playerPos) {
            const charRadius = 0.12 * CHARACTER_SCALE;
            const playerHeight = 0.65;
            const localPos = new THREE.Vector3().copy(playerPos).sub(plat.position);
            const q = new THREE.Quaternion().copy(plat.quaternion);
            localPos.applyQuaternion(q.invert());
            const halfX = plat.scale.x / 2;
            const halfY = plat.scale.y / 2;
            const halfZ = plat.scale.z / 2;
            const pMinX = localPos.x - charRadius;
            const pMaxX = localPos.x + charRadius;
            const pMinY = localPos.y;
            const pMaxY = localPos.y + playerHeight;
            const pMinZ = localPos.z - charRadius;
            const pMaxZ = localPos.z + charRadius;
            const overlapX = Math.max(0, Math.min(pMaxX, halfX) - Math.max(pMinX, -halfX));
            const Math_overlapY = Math.max(0, Math.min(pMaxY, halfY) - Math.max(pMinY, -halfY));
            const overlapZ = Math.max(0, Math.min(pMaxZ, halfZ) - Math.max(pMinZ, -halfZ));
            if (overlapX > 0 && Math_overlapY > 0 && overlapZ > 0) {
                return Math.min(overlapX, Math_overlapY, overlapZ);
            }
            return 0;
        }

        function checkEnvironmentCollision(playerId, nextPosition) {
            const charRadius = 0.12 * CHARACTER_SCALE;
            const p = players[playerId - 1];
            const currentPosition = (p && p.mesh) ? p.mesh.position : nextPosition;
            const floorOverlapNext = getFloorOverlap(nextPosition);
            if (floorOverlapNext > 0) {
                const floorOverlapCurr = getFloorOverlap(currentPosition);
                if (floorOverlapNext > floorOverlapCurr) {
                    return true;
                }
            }
            const pdx = nextPosition.x - pondData.center.x;
            const pdz = nextPosition.z - pondData.center.z;
            const pdist = Math.sqrt(pdx * pdx + pdz * pdz);
            const inPondCutout = (pdist < pondData.radius);
            let currentDist = 0;
            let alreadyInPond = false;
            if (p && p.mesh) {
                const cdx = p.mesh.position.x - pondData.center.x;
                const cdz = p.mesh.position.z - pondData.center.z;
                currentDist = Math.sqrt(cdx * cdx + cdz * cdz);
                alreadyInPond = p.mesh.position.y < parkTopY - 0.2;
            }
            if (alreadyInPond && nextPosition.y < parkTopY - 0.2 && pdist > pondData.radius - charRadius) {
                if (pdist > currentDist) {
                    return true;
                }
            }
            for (const plat of customPlatforms) {
                if (inPondCutout && Math.abs(plat.position.x - parkX) < 0.1 && Math.abs(plat.position.z - 0) < 0.1) {
                    continue;
                }
                const platOverlapNext = getPlatformOverlap(plat, nextPosition);
                if (platOverlapNext > 0) {
                    const localPos = new THREE.Vector3().copy(nextPosition).sub(plat.position);
                    const q = new THREE.Quaternion().copy(plat.quaternion);
                    localPos.applyQuaternion(q.invert());
                    const halfY = plat.scale.y / 2;
                    if (localPos.y >= halfY - 0.05) {
                        continue;
                    }
                    const platOverlapCurr = getPlatformOverlap(plat, currentPosition);
                    if (platOverlapNext > platOverlapCurr) {
                        return true;
                    }
                }
            }
            return false;
        }

        function triggerExplosion(playerId) {
            const p = players.find(x => x.id === playerId);
            if (!p || p.isRemote) return;
            triggerExplosionLocal(playerId);
            for (const conn of connections) {
                if (conn.open) conn.send({ type: 'explode', id: playerId });

        function triggerExplosionLocal(playerId) {
            const p = players.find(x => x.id === playerId);
            if (!p || !p.mesh) return;
            
            const expPos = p.mesh.position.clone();
            shakeIntensity = 0.9;
            createExplosion(expPos.x, expPos.y + 0.3, expPos.z);
            
            const explosionRadius = 4.5;
            for (const other of players) {
                if (other.id === playerId || !other.mesh) continue;
                
                const dist = other.mesh.position.distanceTo(expPos);
                if (dist < explosionRadius) {
                    const dir = new THREE.Vector3().subVectors(other.mesh.position, expPos);
                    dir.y = 0;
                    dir.normalize();
                    const force = (1.0 - dist / explosionRadius) * 14.0 + 4.0;
                    if (!other.isRemote) {
                        other.vx = dir.x * force;
                        other.vz = dir.z * force;
                        other.yVelocity = force * 0.8 + 4.0;
                        other.isJumping = true;
                    }
                }
            }
            
            const exploder = players.find(x => x.id === playerId);
            if (exploder && !exploder.isRemote) {
                respawnPlayer(playerId);
            }
        }

        function respawnPlayer(playerId) {
            const p = players.find(x => x.id === playerId);
            if (!p || p.isRemote) return;
            const rx = (Math.random() - 0.5) * (PLATFORM_SIZE - 4.0);
            const rz = (Math.random() - 0.5) * (PLATFORM_SIZE - 4.0);
            respawnPlayerLocal(playerId, rx, rz);
            for (const conn of connections) {
                if (conn.open) conn.send({ type: 'respawn', id: playerId, rx: rx, rz: rz });
            }
        }

        function respawnPlayerLocal(playerId, rx, rz) {
            const p = players.find(x => x.id === playerId);
            if (!p || !p.mesh) return;
            
            p.mesh.position.set(rx, floorY + 6.0, rz);
            p.yVelocity = 0;
            p.vx = 0;
            p.vz = 0;
            p.isJumping = true;
            p.sprintActiveInJump = false;
            
            if (playerId === localPlayerId) {
                respawnLockUntil = Date.now() + 500;
            }
            
            createCloudPuff(rx, floorY + 6.0, rz);
        }

        const activeParticles = [];

        function spawnEmotion(type) {
            if (isCustomizing) return;
            let iconClass = '';
            let color = '';
            
            if (type === 'angry') {
                iconClass = '\uf0e7';
                color = '#FF3366';
            } else if (type === 'love') {
                iconClass = '\uf004';
                color = '#FF3366';
            } else if (type === 'happy') {
                iconClass = '\uf59a';
                color = '#E2FF3D';
            } else if (type === 'sad') {
                iconClass = '\uf740';
                color = '#8A2BE2';
            } else if (type === 'shocked') {
                iconClass = '\uf12a';
                color = '#FF3366';
            }
            
            spawnEmotionLocal(localPlayerId, iconClass, color, type);
            for (const conn of connections) {
                if (conn.open) conn.send({ type: 'emotion', id: localPlayerId, iconClass: iconClass, color: color, animClass: type });
            }
        }

        function sendChatMessage() {
            if (isCustomizing) return;
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            input.blur();
            
            showSpeechBubble(localPlayerId, text);
            for (const conn of connections) {
                if (conn.open) conn.send({ type: 'chat', id: localPlayerId, text: text });
