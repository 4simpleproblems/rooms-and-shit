<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms & Shit | The Cabin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg-midnight: #050510;
            --color-cabin: #FF8C00; 
            --black-outline: #09090B;
            --white-ui: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-midnight);
            font-family: 'Inter', sans-serif;
            overflow: hidden; 
            color: var(--black-outline);
            user-select: none;
        }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .ui-panel {
            pointer-events: auto; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            border: 6px solid var(--black-outline); box-shadow: 8px 8px 0px var(--black-outline);
            padding: 16px; position: absolute; box-sizing: border-box;
        }

        .header-panel { top: 24px; left: 24px; display: flex; align-items: center; gap: 16px; }
        .header-title { font-family: 'Alfa Slab One', cursive; font-size: 1.4rem; letter-spacing: 1px; margin: 0; }

        .ui-btn {
            font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1rem; text-transform: uppercase;
            background: var(--white-ui); border: 4px solid var(--black-outline); box-shadow: 4px 4px 0px var(--black-outline);
            cursor: pointer; padding: 10px 16px; transition: transform 0.05s linear, box-shadow 0.05s linear;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .ui-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--black-outline); }
        .ui-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--black-outline); }
        .ui-btn.primary { background: var(--color-cabin); color: #FFFFFF; }

        .controls-panel { top: 24px; right: 24px; width: 260px; }
        .controls-panel h3 { font-family: 'Alfa Slab One', cursive; font-size: 1rem; margin: 0 0 10px 0; color: var(--color-cabin); }
        .control-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; }
        .control-key { background: #E4E4E7; border: 2px solid var(--black-outline); border-radius: 4px; padding: 2px 6px; box-shadow: 1px 1px 0px var(--black-outline); font-family: monospace; font-weight: 900; }

        .chat-panel { bottom: 24px; left: 24px; width: 380px; display: flex; gap: 12px; }
        .chat-input { flex-grow: 1; border: 4px solid var(--black-outline); padding: 10px 12px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.9rem; outline: none; background: #FFFFFF; }

        #cam-mode-indicator {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%); background: var(--color-cabin);
            border: 3px solid var(--black-outline); box-shadow: 3px 3px 0px var(--black-outline); padding: 6px 12px;
            font-family: 'Inter', sans-serif; font-weight: 900; font-size: 0.8rem; color: #FFFFFF; pointer-events: none; z-index: 40; text-transform: uppercase;
        }

        #interaction-prompt {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: var(--white-ui); border: 4px solid var(--black-outline); box-shadow: 4px 4px 0px var(--black-outline);
            padding: 8px 16px; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1rem;
            z-index: 50; display: none;
        }

        #customization-overlay, #pause-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 200;
            display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease, visibility 0.5s;
        }
        .hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }

        .custom-card { background: var(--white-ui); border: 6px solid var(--black-outline); box-shadow: 12px 12px 0px var(--black-outline); padding: 32px; width: 380px; max-width: 90%; display: flex; flex-direction: column; gap: 20px; pointer-events: auto; }
        .custom-title { font-family: 'Alfa Slab One', cursive; font-size: 1.8rem; margin: 0; text-align: center; color: var(--color-cabin); }
        .custom-field { display: flex; flex-direction: column; gap: 8px; }
        .custom-field label { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; }
        input[type="text"] { border: 4px solid var(--black-outline); padding: 12px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 1.1rem; outline: none; background: #FFFFFF; }

        .color-options { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .color-btn { aspect-ratio: 1; border: 4px solid var(--black-outline); cursor: pointer; box-shadow: 2px 2px 0px var(--black-outline); transition: transform 0.05s, box-shadow 0.05s; }
        .color-btn.active { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px var(--black-outline); outline: none; }
    </style>
</head>
<body>

    <div id="customization-overlay">
        <div class="custom-card">
            <h2 class="custom-title">THE CABIN</h2>
            <div class="custom-field">
                <label>YOUR NAME</label>
                <input type="text" id="custom-name-input" value="Lumberjack" maxlength="15" />
            </div>
            <div class="custom-field">
                <label>CHOOSE COLOR</label>
                <div class="color-options">
                    <button class="color-btn active" data-color="#FF8C00" style="background-color: #FF8C00;"></button>
                    <button class="color-btn" data-color="#33ccff" style="background-color: #33ccff;"></button>
                    <button class="color-btn" data-color="#33ff33" style="background-color: #33ff33;"></button>
                    <button class="color-btn" data-color="#ff3366" style="background-color: #ff3366;"></button>
                    <button class="color-btn" data-color="#8A2BE2" style="background-color: #8A2BE2;"></button>
                    <button class="color-btn" data-color="#ffffff" style="background-color: #ffffff;"></button>
                </div>
            </div>
            <button id="start-btn" class="ui-btn primary" style="width: 100%; justify-content: center; font-size: 1.2rem; margin-top: 12px;">ENTER CABIN</button>
        </div>
    </div>

    <div id="pause-overlay" class="hidden">
        <div class="custom-card">
            <h2 class="custom-title">PAUSED</h2>
            <button id="resume-btn" class="ui-btn primary" style="width: 100%; justify-content: center; font-size: 1.2rem;">RESUME</button>
        </div>
    </div>

    <div id="interaction-prompt">Press E to Interact</div>

    <div class="ui-layer">
        <div class="ui-panel header-panel">
            <button id="back-btn" class="ui-btn"><i class="fa-solid fa-arrow-left"></i> Map</button>
            <h1 class="header-title">THE CABIN</h1>
        </div>

        <div id="cam-mode-indicator">📽 THIRD PERSON — Press V for First Person</div>

        <div class="ui-panel controls-panel" style="width: 320px;">
            <h3>CABIN CONTROLS</h3>
            <div class="control-row"><span>Move</span><span class="control-key">WASD</span></div>
            <div class="control-row"><span>Jump</span><span class="control-key">Space</span></div>
            <div class="control-row"><span>Interact</span><span class="control-key">E</span></div>
            <div class="control-row"><span>Cam Mode</span><span class="control-key">V</span></div>
            <div class="control-row"><span>Pause</span><span class="control-key">Esc</span></div>
        </div>

        <div class="ui-panel chat-panel">
            <input type="text" id="chat-input" class="chat-input" placeholder="Say something..." maxlength="80" autocomplete="off" />
            <button class="ui-btn primary"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="character.js"></script>

    <script>
        // --- Core Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.08);

        const aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
        camera.position.set(0, 4, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxDistance = 6; 
        controls.minDistance = 1;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;

        const clock = new THREE.Clock();
        const loader = new THREE.GLTFLoader();

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x101020, 0.5);
        scene.add(ambientLight);

        let fireIntensity = 1.0;
        let fireBonusTime = 0;

        const fireLight = new THREE.PointLight(0xff6600, 2.5, 10);
        fireLight.position.set(-3.7, 1.5, -3.7);
        fireLight.castShadow = true;
        scene.add(fireLight);

        const stormLight = new THREE.PointLight(0x4466ff, 0.6, 12);
        stormLight.position.set(0, 4, 6);
        scene.add(stormLight);

        // --- Sound ---
        const listener = new THREE.AudioListener();
        camera.add(listener);
        const stormSound = new THREE.Audio(listener);
        const audioLoader = new THREE.AudioLoader();
        audioLoader.load('https://www.soundjay.com/nature/sounds/wind-howl-01.mp3', function(buffer) {
            stormSound.setBuffer(buffer);
            stormSound.setLoop(true);
            stormSound.setVolume(0.5);
        });

        // --- Materials ---
        const logMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.9 });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2b1d12, roughness: 0.8 });
        const brickMat = new THREE.MeshStandardMaterial({ color: 0x6e261d, roughness: 1.0 });
        const rugMat = new THREE.MeshStandardMaterial({ color: 0x882222, roughness: 1.0 });
        const couchMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x4d3319, roughness: 0.7 });

        // --- Cabin Layout ---
        const colliders = [];
        const seatSpots = [];
        const interactions = [];

        // Floor
        const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.5, 10), floorMat);
        floor.receiveShadow = true;
        scene.add(floor);

        // Rug
        const rug = new THREE.Mesh(new THREE.BoxGeometry(6, 0.1, 4), rugMat);
        rug.position.set(0, 0.3, 0);
        rug.receiveShadow = true;
        scene.add(rug);

        // Walls
        function createLogWall(x, z, rotY, hasWindow = false, isGable = false) {
            const group = new THREE.Group();
            const logCount = isGable ? 14 : 10;
            for (let i = 0; i < logCount; i++) {
                let logW = 10;
                if (isGable && i >= 10) {
                    logW = 10 - (i - 9) * 2; // Triangle peak
                }

                if (hasWindow && i > 2 && i < 8) {
                    const l1 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 3), logMat);
                    l1.rotation.z = Math.PI / 2; l1.position.set(-3.5, i * 0.6, 0); group.add(l1);
                    const l2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 3), logMat);
                    l2.rotation.z = Math.PI / 2; l2.position.set(3.5, i * 0.6, 0); group.add(l2);
                } else {
                    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, logW), logMat);
                    log.rotation.z = Math.PI / 2;
                    log.position.y = i * 0.6;
                    group.add(log);
                }
            }
            group.position.set(x, 0, z);
            group.rotation.y = rotY;
            scene.add(group);
        }

        createLogWall(0, -5, 0, false, true); // Back Gable
        createLogWall(-5, 0, Math.PI / 2); // Left
        createLogWall(5, 0, Math.PI / 2); // Right
        createLogWall(0, 5, 0, true, true); // Front Gable Window

        // Glass
        const glassMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, metalness: 1.0, roughness: 0.05, side: THREE.DoubleSide });
        const glass = new THREE.Mesh(new THREE.PlaneGeometry(4, 3), glassMat);
        glass.position.set(0, 3, 5);
        scene.add(glass);

        // Roof
        const roofGroup = new THREE.Group();
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x2b1d12, roughness: 0.9 });
        const roofSideA = new THREE.Mesh(new THREE.BoxGeometry(7, 0.4, 11), roofMat);
        roofSideA.rotation.z = 0.65;
        roofSideA.position.set(-2.8, 7.3, 0);
        const roofSideB = new THREE.Mesh(new THREE.BoxGeometry(7, 0.4, 11), roofMat);
        roofSideB.rotation.z = -0.65;
        roofSideB.position.set(2.8, 7.3, 0);
        roofGroup.add(roofSideA, roofSideB);
        scene.add(roofGroup);

        // Fireplace
        const fireplace = new THREE.Group();
        const mantel = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.5, 1.2), brickMat);
        mantel.position.set(-3.7, 1.75, -3.7);
        fireplace.add(mantel);
        scene.add(fireplace);
        colliders.push({ x: -3.7, z: -3.7, w: 2.5, d: 1.2 });

        // Flames (Particle-like system)
        const flameCount = 15;
        const flames = new THREE.Group();
        for(let i=0; i<flameCount; i++) {
            const f = new THREE.Mesh(
                new THREE.ConeGeometry(0.1 + Math.random()*0.2, 0.4 + Math.random()*0.4, 6),
                new THREE.MeshBasicMaterial({color: 0xffaa00, transparent: true, opacity: 0.8})
            );
            f.position.set(-3.7 + (Math.random()-0.5)*0.8, 0.6, -3.3 + (Math.random()-0.5)*0.4);
            f.userData = { baseOpacity: 0.8, phase: Math.random()*Math.PI*2, speed: 2 + Math.random()*3 };
            flames.add(f);
        }
        scene.add(flames);

        // Furniture
        function createCouch(x, z, rotY) {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 1.5), couchMat);
            base.position.y = 0.4;
            const back = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 0.4), couchMat);
            back.position.set(0, 1.0, -0.55);
            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 1.5), couchMat);
            armL.position.set(-1.3, 0.75, 0);
            const armR = armL.clone(); armR.position.x = 1.3;
            group.add(base, back, armL, armR);
            group.position.set(x, 0.25, z);
            group.rotation.y = rotY;
            scene.add(group);
            colliders.push({ x, z, w: 3, d: 1.5, rotY });
            seatSpots.push({ x, z, y: 0.6, type: 'Couch', rotY });
        }
        createCouch(0, -3, 0); 

        function createBeanBag(x, z, color) {
            const bb = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 8), new THREE.MeshStandardMaterial({color, roughness: 1.0}));
            bb.scale.y = 0.6;
            bb.position.set(x, 0.5, z);
            scene.add(bb);
            colliders.push({ x, z, w: 1.2, d: 1.2 });
            seatSpots.push({ x, z, y: 0.5, type: 'BeanBag' });
        }
        createBeanBag(3, -2, 0x224488);
        createBeanBag(-3, 2, 0x884422);

        function createSideTable(x, z) {
            const group = new THREE.Group();
            const top = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 1), tableMat);
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), tableMat);
            leg.position.y = -0.35;
            group.add(top, leg);
            group.position.set(x, 0.6, z);
            scene.add(group);
            colliders.push({ x, z, w: 1, d: 1 });
        }
        createSideTable(2, -3.5);

        // Logs Stack
        const logStack = new THREE.Group();
        for(let i=0; i<3; i++) {
            const log = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1), logMat);
            log.rotation.z = Math.PI/2;
            log.position.set(0, 0.15, i*0.4 - 0.4);
            logStack.add(log);
        }
        const topLog = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1), logMat);
        topLog.rotation.z = Math.PI/2;
        topLog.position.set(0, 0.4, 0);
        logStack.add(topLog);
        logStack.position.set(-3, 0.25, 4);
        scene.add(logStack);
        interactions.push({ x: -3, z: 4, type: 'Logs', range: 1.5 });
        colliders.push({ x: -3, z: 4, w: 1, d: 1 });

        // --- Snow Particles ---
        const snowCount = 2000;
        const snowGeo = new THREE.BufferGeometry();
        const snowPos = new Float32Array(snowCount * 3);
        const snowVel = [];
        for(let i = 0; i < snowCount; i++) {
            snowPos[i*3] = (Math.random() - 0.5) * 50;
            snowPos[i*3+1] = Math.random() * 20;
            snowPos[i*3+2] = 8 + Math.random() * 10;
            snowVel.push({ x: -1.5 - Math.random() * 2.0, y: -0.1 - Math.random() * 0.1 });
        }
        snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
        const snowMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.6 });
        const snowParticles = new THREE.Points(snowGeo, snowMat);
        scene.add(snowParticles);

        // --- Player Data ---
        let isFirstPerson = false, fpYaw = Math.PI, fpPitch = 0;
        let isCustomizing = true, isPaused = false, isSitting = false;
        const players = [
            { id: 1, name: 'Lumberjack', color: '#FF8C00', mesh: null, position: new THREE.Vector3(0,0,0), isJumping: false, yVelocity: 0, keys:{up:false,down:false,left:false,right:false,space:false,shift:false}, isCustomizing: true }
        ];

        let charGltfMaster = null, animationsMaster = [];

        async function loadModels() {
            try {
                const [gltf, animJson] = await Promise.all([
                    loader.loadAsync("model/character.gltf"),
                    fetch("animations.json").then(r => r.json())
                ]);
                charGltfMaster = gltf;
                animationsMaster = animJson.map(a => {
                    const tracks = a.tracks.map(t => {
                        const nodeName = t.nodeName || (t.name ? t.name.split('.')[0] : 'unknown');
                        const property = t.property || (t.name ? t.name.split('.')[1] : 'position');
                        return new THREE.KeyframeTrack(nodeName + '.' + property, t.times, t.values);
                    });
                    return new THREE.AnimationClip(a.name, a.duration, tracks);
                });
                setupLocalPlayer();
                animate();
            } catch (err) { console.error(err); }
        }

        function setupLocalPlayer() {
            const p = players[0];
            const mesh = charGltfMaster.scene.clone();
            mesh.scale.set(2, 2, 2);
            scene.add(mesh);
            p.mesh = mesh;
            p.mixer = new THREE.AnimationMixer(mesh);
            p.actions = {};
            animationsMaster.forEach(clip => { p.actions[clip.name.toLowerCase()] = p.mixer.clipAction(clip); });
            mesh.traverse(o => {
                if (o.isMesh) {
                    o.castShadow = true; o.receiveShadow = true;
                    if (o.name.includes('Body') || o.name.includes('Leg')) o.material = createToonMaterial(o.material.map, p.color);
                }
            });
            updatePlayerVisuals(p);
        }

        function playAnim(p, name) {
            if (!p.actions || !p.actions[name] || p.currentAnim === name) return;
            if (p.currentAnim && p.actions[p.currentAnim]) p.actions[p.currentAnim].fadeOut(0.2);
            p.actions[name].reset().fadeIn(0.2).play();
            p.currentAnim = name;
        }

        function checkCollision(pos) {
            // Cabin walls
            if (Math.abs(pos.x) > 4.5 || Math.abs(pos.z) > 4.5) return true;
            
            // Furniture colliders
            for (const c of colliders) {
                let dx = pos.x - c.x;
                let dz = pos.z - c.z;
                if (c.rotY) {
                    const s = Math.sin(-c.rotY), cc = Math.cos(-c.rotY);
                    const nx = dx * cc - dz * s;
                    const nz = dx * s + dz * cc;
                    dx = nx; dz = nz;
                }
                if (Math.abs(dx) < c.w/2 + 0.3 && Math.abs(dz) < c.d/2 + 0.3) return true;
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.elapsedTime;

            // Fire Logic
            if (fireBonusTime > 0) {
                fireBonusTime -= delta;
                fireIntensity = 1.8;
            } else {
                fireIntensity = 1.0;
            }

            fireLight.intensity = (2.0 + Math.random()) * fireIntensity;
            flames.children.forEach(f => {
                const s = 1.0 + Math.sin(time * f.userData.speed + f.userData.phase) * 0.2;
                f.scale.set(s * fireIntensity, s * fireIntensity * 1.5, s * fireIntensity);
                f.material.opacity = (0.6 + Math.random()*0.4) * fireIntensity;
                f.position.y = 0.6 + (f.scale.y - 1)*0.2;
            });

            // Snow
            const positions = snowParticles.geometry.attributes.position.array;
            for(let i = 0; i < snowCount; i++) {
                positions[i*3] += snowVel[i].x;
                positions[i*3+1] += snowVel[i].y;
                if (positions[i*3] < -25) positions[i*3] = 25;
                if (positions[i*3+1] < 0) positions[i*3+1] = 20;
            }
            snowParticles.geometry.attributes.position.needsUpdate = true;

            const p = players[0];
            if (!p.mesh || isCustomizing || isPaused) {
                if (p.mixer) p.mixer.update(delta);
                renderer.render(scene, camera);
                return;
            }

            // Interaction Check
            let nearInteraction = null;
            interactions.forEach(inter => {
                const d = Math.hypot(p.mesh.position.x - inter.x, p.mesh.position.z - inter.z);
                if (d < inter.range) nearInteraction = inter;
            });

            let nearSeat = null;
            seatSpots.forEach(seat => {
                const d = Math.hypot(p.mesh.position.x - seat.x, p.mesh.position.z - seat.z);
                if (d < 1.0) nearSeat = seat;
            });

            const prompt = document.getElementById('interaction-prompt');
            if (nearInteraction || nearSeat) {
                prompt.style.display = 'block';
                prompt.innerText = isSitting ? "Press E to Stand" : (nearInteraction ? `Press E to Use ${nearInteraction.type}` : "Press E to Sit");
            } else {
                prompt.style.display = 'none';
            }

            // Movement
            if (!isSitting) {
                let dx = 0, dz = 0;
                if (p.keys.up) dz -= 1; if (p.keys.down) dz += 1;
                if (p.keys.left) dx -= 1; if (p.keys.right) dx += 1;

                if (dx !== 0 || dz !== 0) {
                    const camF = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion); camF.y = 0; camF.normalize();
                    const camR = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion); camR.y = 0; camR.normalize();
                    const moveDir = new THREE.Vector3().addScaledVector(camF, -dz).addScaledVector(camR, dx).normalize();
                    const speed = p.keys.shift ? 6 : 3;
                    const nextPos = p.mesh.position.clone().addScaledVector(moveDir, speed * delta);
                    
                    if (!checkCollision(nextPos)) {
                        p.mesh.position.copy(nextPos);
                    } else {
                        // Sliding collision
                        const nextX = p.mesh.position.clone().add(new THREE.Vector3(moveDir.x * speed * delta, 0, 0));
                        if (!checkCollision(nextX)) p.mesh.position.copy(nextX);
                        const nextZ = p.mesh.position.clone().add(new THREE.Vector3(0, 0, moveDir.z * speed * delta));
                        if (!checkCollision(nextZ)) p.mesh.position.copy(nextZ);
                    }

                    const targetRot = Math.atan2(moveDir.x, moveDir.z) + Math.PI;
                    let diff = targetRot - p.mesh.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    p.mesh.rotation.y += diff * 0.15;
                }

                // Jump
                if (p.keys.space && !p.isJumping) { p.isJumping = true; p.yVelocity = 5.0; }
                if (p.isJumping) {
                    p.yVelocity -= 15.0 * delta;
                    p.mesh.position.y += p.yVelocity * delta;
                    if (p.mesh.position.y <= 0) { p.mesh.position.y = 0; p.isJumping = false; p.yVelocity = 0; }
                }

                if (p.mixer) {
                    p.mixer.update(delta);
                    if (p.isJumping) playAnim(p, 'jump');
                    else if (dx !== 0 || dz !== 0) playAnim(p, p.keys.shift ? 'sprint' : 'stomp');
                    else playAnim(p, 'idle');
                }
            } else {
                if (p.mixer) p.mixer.update(delta);
                // Assume 'idle' or similar for sitting for now since character.js doesn't have 'sit'
                playAnim(p, 'idle'); 
            }

            // Camera
            if (isFirstPerson) {
                camera.position.copy(p.mesh.position).add(new THREE.Vector3(0, 0.65, 0));
                camera.quaternion.setFromEuler(new THREE.Euler(fpPitch, fpYaw, 0, 'YXZ'));
                controls.enabled = false;
            } else {
                controls.enabled = true;
                const target = p.mesh.position.clone().add(new THREE.Vector3(0, 1, 0));
                controls.target.lerp(target, 0.1);
                controls.update();
            }

            renderer.render(scene, camera);
        }

        function toggleSit() {
            const p = players[0];
            if (isSitting) {
                isSitting = false;
                p.mesh.position.y = 0;
            } else {
                let closestSeat = null;
                seatSpots.forEach(seat => {
                    const d = Math.hypot(p.mesh.position.x - seat.x, p.mesh.position.z - seat.z);
                    if (d < 1.0) closestSeat = seat;
                });
                if (closestSeat) {
                    isSitting = true;
                    p.mesh.position.set(closestSeat.x, closestSeat.y, closestSeat.z);
                    if (closestSeat.rotY !== undefined) p.mesh.rotation.y = closestSeat.rotY + Math.PI;
                }
            }
        }

        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            const p = players[0];
            if (k === 'w') p.keys.up = true; if (k === 's') p.keys.down = true;
            if (k === 'a') p.keys.left = true; if (k === 'd') p.keys.right = true;
            if (k === ' ') p.keys.space = true; if (e.shiftKey) p.keys.shift = true;
            if (k === 'v') {
                isFirstPerson = !isFirstPerson;
                if (isFirstPerson) renderer.domElement.requestPointerLock(); else document.exitPointerLock();
                p.mesh.visible = !isFirstPerson;
            }
            if (k === 'e') {
                // Interact
                const dLogs = Math.hypot(p.mesh.position.x - (-3), p.mesh.position.z - 4);
                if (dLogs < 1.5) {
                    fireBonusTime = 120; // 2 mins
                } else {
                    toggleSit();
                }
            }
            if (e.key === 'Escape') {
                isPaused = !isPaused;
                document.getElementById('pause-overlay').classList.toggle('hidden', !isPaused);
            }
        });

        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            const p = players[0];
            if (k === 'w') p.keys.up = false; if (k === 's') p.keys.down = false;
            if (k === 'a') p.keys.left = false; if (k === 'd') p.keys.right = false;
            if (k === ' ') p.keys.space = false; if (!e.shiftKey) p.keys.shift = false;
        });

        document.addEventListener('mousemove', e => {
            if (isFirstPerson && document.pointerLockElement === renderer.domElement) {
                fpYaw -= e.movementX * 0.002;
                fpPitch -= e.movementY * 0.002;
                fpPitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, fpPitch));
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            isCustomizing = false;
            players[0].isCustomizing = false;
            players[0].color = document.querySelector('.color-btn.active').dataset.color;
            updatePlayerVisuals(players[0]);
            document.getElementById('customization-overlay').classList.add('hidden');
            if (stormSound.buffer) stormSound.play();
        });

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            isPaused = false;
            document.getElementById('pause-overlay').classList.add('hidden');
        });

        document.getElementById('back-btn').addEventListener('click', () => window.location.href = 'index.html');

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loadModels();
    </script>
</body>
