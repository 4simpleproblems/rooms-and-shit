<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Rooms & Shit | The Cabin</title>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-midnight: #080710;
            --color-cabin: #FF7A00;
            --color-cabin-dark: #D45D00;
            --color-cabin-light: #FF9E43;
            --black-outline: #0C0C0E;
            --white-ui: #FFFDF9;
            --glass-bg: rgba(254, 252, 245, 0.85);
            --shadow-color: #0C0C0E;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-midnight);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: var(--black-outline);
            user-select: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .ui-panel {
            pointer-events: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 4px solid var(--black-outline);
            box-shadow: 6px 6px 0px var(--shadow-color);
            padding: 16px;
            position: absolute;
            box-sizing: border-box;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        .header-panel {
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title {
            font-family: 'Alfa Slab One', cursive;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin: 0;
            color: var(--black-outline);
            text-shadow: 2px 2px 0px var(--color-cabin-light);
        }
        .ui-btn {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            background: var(--white-ui);
            border: 4px solid var(--black-outline);
            box-shadow: 4px 4px 0px var(--shadow-color);
            cursor: pointer;
            padding: 10px 16px;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--black-outline);
        }
        .ui-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--shadow-color);
        }
        .ui-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--shadow-color);
        }
        .ui-btn.primary {
            background: var(--color-cabin);
            color: var(--white-ui);
        }
        .ui-btn.primary:hover {
            background: var(--color-cabin-light);
        }
        .controls-panel {
            top: 24px;
            right: 24px;
            width: 280px;
        }
        .controls-panel.collapsed {
            transform: translateX(340px);
            opacity: 0;
            pointer-events: none;
        }
        .controls-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .controls-panel h3 {
            font-family: 'Alfa Slab One', cursive;
            font-size: 1rem;
            margin: 0;
            color: var(--color-cabin-dark);
        }
        .controls-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--black-outline);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .control-key {
            background: var(--white-ui);
            border: 2px solid var(--black-outline);
            border-radius: 4px;
            padding: 2px 6px;
            box-shadow: 2px 2px 0px var(--shadow-color);
            font-family: monospace;
            font-weight: 900;
        }
        #controls-tab-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 9;
            display: none;
        }
        #controls-tab-btn.visible {
            display: inline-flex;
        }
        #chat-log-panel {
            position: absolute;
            bottom: 96px;
            left: 24px;
            width: 380px;
            height: 180px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 4px solid var(--black-outline);
            box-shadow: 6px 6px 0px var(--shadow-color);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 12px;
            z-index: 10;
            opacity: 0.35;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }
        #chat-log-panel:hover, #chat-log-panel.opaque {
            opacity: 1;
            pointer-events: auto;
        }
        #chat-log-list {
            flex-grow: 1;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .chat-msg {
            line-height: 1.4;
            word-break: break-word;
        }
        .chat-msg-name {
            font-weight: 900;
            margin-right: 4px;
        }
        .chat-msg-system {
            color: var(--color-cabin-dark);
            font-style: italic;
        }
        .chat-panel {
            bottom: 24px;
            left: 24px;
            width: 380px;
            display: flex;
            gap: 12px;
        }
        .chat-input {
            flex-grow: 1;
            border: 4px solid var(--black-outline);
            padding: 10px 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            outline: none;
            background: #FFFFFF;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .chat-input:focus {
            border-color: var(--color-cabin);
            box-shadow: 2px 2px 0px var(--shadow-color);
        }
        #cam-mode-indicator {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-cabin);
            border: 3px solid var(--black-outline);
            box-shadow: 3px 3px 0px var(--shadow-color);
            padding: 6px 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 0.8rem;
            color: var(--white-ui);
            pointer-events: none;
            z-index: 40;
            text-transform: uppercase;
        }
        #interaction-prompt {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--white-ui);
            border: 4px solid var(--black-outline);
            box-shadow: 4px 4px 0px var(--shadow-color);
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            z-index: 50;
            display: none;
            pointer-events: none;
            animation: pulsePrompt 1.5s infinite alternate;
        }
        @keyframes pulsePrompt {
            from { transform: translateX(-50%) scale(1); }
            to { transform: translateX(-50%) scale(1.05); }
        }
        #customization-overlay, #pause-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 7, 16, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        .hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        .custom-card {
            background: var(--white-ui);
            border: 5px solid var(--black-outline);
            box-shadow: 10px 10px 0px var(--shadow-color);
            padding: 32px;
            width: 380px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: auto;
        }
        .custom-title {
            font-family: 'Alfa Slab One', cursive;
            font-size: 1.8rem;
            margin: 0;
            text-align: center;
            color: var(--color-cabin);
            text-shadow: 2px 2px 0px var(--black-outline);
        }
        .custom-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .custom-field label {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--black-outline);
        }
        .color-options {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }
        .color-btn {
            aspect-ratio: 1;
            border: 4px solid var(--black-outline);
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--shadow-color);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .color-btn.active {
            transform: scale(1.1) translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--shadow-color);
            outline: none;
        }
        #speech-bubble {
            position: absolute;
            background: var(--white-ui);
            border: 4px solid var(--black-outline);
            box-shadow: 4px 4px 0px var(--shadow-color);
            padding: 8px 14px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--black-outline);
            border-radius: 4px;
            pointer-events: none;
            z-index: 100;
            display: none;
            transform: translate(-50%, -100%);
            white-space: nowrap;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
        }
        #speech-bubble.visible {
            opacity: 1;
            transform: translate(-50%, -120%);
        }
        #speech-bubble.fade-out {
            opacity: 0;
            transform: translate(-50%, -140%);
        }
        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid var(--black-outline);
        }
        #speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid var(--white-ui);
            z-index: 1;
        }
        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--white-ui);
            z-index: 300;
            opacity: 1;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
        }
        #fade-overlay.fade-out-active {
            opacity: 0;
        }
        #book-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 7, 16, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        .book-card {
            background: #f7ebd3;
            border: 6px solid var(--black-outline);
            box-shadow: 10px 10px 0px var(--black-outline);
            padding: 16px;
            width: 90vw;
            height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
            position: relative;
        }
        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Alfa Slab One', cursive;
            font-size: 1.1rem;
            color: #3d2b1f;
            border-bottom: 4px solid var(--black-outline);
            padding-bottom: 10px;
            z-index: 10;
        }
        .book-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .book-content {
            width: 100%;
            flex-grow: 1;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #e6d5b8;
            border: 4px solid var(--black-outline);
            position: relative;
        }
        .book-page-canvas {
            max-width: 48%;
            max-height: 100%;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.2);
            background: white;
            border: 1px solid #ccc;
        }
        #book-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Alfa Slab One', cursive;
            color: var(--color-cabin-dark);
            font-size: 1.5rem;
            text-shadow: 2px 2px 0px white;
        }
    </style>
</head>
<body>

    <div id="fade-overlay"></div>

    <div id="customization-overlay">
        <div class="custom-card">
            <h2 class="custom-title">THE CABIN</h2>
            <div class="custom-field">
                <label>YOUR NAME</label>
                <input type="text" id="custom-name-input" class="chat-input" value="Lumberjack" maxlength="15" autocomplete="off" />
            </div>
            <div class="custom-field">
                <label>CHOOSE COLOR</label>
                <div class="color-options">
                    <button class="color-btn active" data-color="#FF8C00" style="background-color: #FF8C00;"></button>
                    <button class="color-btn" data-color="#33ccff" style="background-color: #33ccff;"></button>
                    <button class="color-btn" data-color="#33ff33" style="background-color: #33ff33;"></button>
                    <button class="color-btn" data-color="#ff3366" style="background-color: #ff3366;"></button>
                    <button class="color-btn" data-color="#8A2BE2" style="background-color: #8A2BE2;"></button>
                    <button class="color-btn" data-color="#ffffff" style="background-color: #ffffff;"></button>
                </div>
            </div>
            <button id="start-btn" class="ui-btn primary" style="width: 100%; justify-content: center; font-size: 1.2rem; margin-top: 12px;">ENTER CABIN</button>
        </div>
    </div>

    <div id="pause-overlay" class="hidden">
        <div class="custom-card">
            <h2 class="custom-title">PAUSED</h2>
            <button id="resume-btn" class="ui-btn primary" style="width: 100%; justify-content: center; font-size: 1.2rem;">RESUME</button>
        </div>
    </div>

    <div id="book-overlay" class="hidden">
        <div class="book-card">
            <div class="book-header">
                <span>THE GREAT GATSBY</span>
                <div class="book-controls">
                    <button id="book-prev-btn" class="ui-btn" style="padding: 4px 8px; font-size: 0.85rem;"><i class="fa-solid fa-chevron-left"></i></button>
                    <span style="font-family: sans-serif; font-size: 0.95rem; font-weight: bold; color: #3d2b1f;">Pages <span id="book-page-display">1-2</span> / <span id="book-total-pages">?</span></span>
                    <button id="book-next-btn" class="ui-btn" style="padding: 4px 8px; font-size: 0.85rem;"><i class="fa-solid fa-chevron-right"></i></button>
                    <button id="book-bookmark-btn" class="ui-btn primary" style="padding: 4px 12px; font-size: 0.85rem;"><i class="fa-solid fa-bookmark"></i> Bookmark</button>
                </div>
                <button id="book-close-btn" class="ui-btn" style="padding: 4px 12px; font-size: 0.85rem;"><i class="fa-solid fa-xmark"></i> Close</button>
            </div>
            <div class="book-content" id="book-content">
                <div id="book-loading" class="hidden">LOADING...</div>
                <canvas id="book-canvas-left" class="book-page-canvas"></canvas>
                <canvas id="book-canvas-right" class="book-page-canvas"></canvas>
            </div>
        </div>
    </div>

    <div id="interaction-prompt">Press E to Interact</div>
    <div id="speech-bubble"></div>

    <button id="controls-tab-btn" class="ui-btn"><i class="fa-solid fa-keyboard"></i> Controls</button>

    <div class="ui-layer">
        <div class="ui-panel header-panel">
            <button id="back-btn" class="ui-btn"><i class="fa-solid fa-arrow-left"></i> Map</button>
            <button id="mute-btn" class="ui-btn"><i class="fa-solid fa-volume-high"></i></button>
            <h1 class="header-title">THE CABIN</h1>
        </div>

        <div id="cam-mode-indicator">📽 THIRD PERSON — Press V for First Person</div>

        <div class="ui-panel controls-panel">
            <div class="controls-panel-header">
                <h3>CABIN CONTROLS</h3>
                <button id="controls-close-btn" class="controls-close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="control-row"><span>Move</span><span class="control-key">WASD</span></div>
            <div class="control-row"><span>Sprint</span><span class="control-key">Shift</span></div>
            <div class="control-row"><span>Jump</span><span class="control-key">Space</span></div>
            <div class="control-row"><span>Squat</span><span class="control-key">Q</span></div>
            <div class="control-row"><span>Interact / Sit</span><span class="control-key">E</span></div>
            <div class="control-row"><span>Cam Mode</span><span class="control-key">V</span></div>
            <div class="control-row"><span>Emotes</span><span class="control-key">1–5</span></div>
            <div class="control-row"><span>Pause</span><span class="control-key">Esc</span></div>
        </div>

        <div id="chat-log-panel">
            <div id="chat-log-list"></div>
        </div>

        <div class="ui-panel chat-panel">
            <input type="text" id="chat-input" class="chat-input" placeholder="Say something..." maxlength="80" autocomplete="off" />
            <button id="chat-send-btn" class="ui-btn primary"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="character.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.15);

        const aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
        camera.position.set(0, 1.5, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.5, 0);
        controls.maxDistance = 7;
        controls.minDistance = 0.5;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.update();

        const clock = new THREE.Clock();
        const loader = new THREE.GLTFLoader();

        const ambientLight = new THREE.AmbientLight(0x121224, 0.4);
        scene.add(ambientLight);

        let fireIntensity = 1.0;
        let fireBonusTime = 0;

        const fireLight = new THREE.PointLight(0xff7700, 2.5, 8);
        fireLight.position.set(-3.4, 0.55, 0);
        fireLight.castShadow = true;
        scene.add(fireLight);

        const moonLight = new THREE.DirectionalLight(0x5577aa, 1.5);
        moonLight.position.set(-5, 4, 5);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        moonLight.shadow.bias = -0.001;
        scene.add(moonLight);

        const listener = new THREE.AudioListener();
        camera.add(listener);
        const stormSound = new THREE.Audio(listener);
        const audioLoader = new THREE.AudioLoader();
        audioLoader.setCrossOrigin('anonymous');
        audioLoader.load('https://archive.org/download/SSE_Library_WIND/DESIGNED/WINDDsgn_Blizzard%20wind%20cold%3B%20canvas%20wind%20machine_CS_USC.mp3', function(buffer) {
            stormSound.setBuffer(buffer);
            stormSound.setLoop(true);
            stormSound.setVolume(0.20);
        });

        const colliders = [];
        const seatSpots = [];
        const interactions = [];

        const floorGroup = new THREE.Group();
        scene.add(floorGroup);

        const plankW = 0.38;
        const plankD = 7.8;
        const plankH = 0.08;
        const plankColors = [0x2f1f17, 0x3a281d, 0x271911];
        for (let i = -10; i <= 10; i++) {
            const pColor = plankColors[Math.abs(i) % plankColors.length];
            const c = new THREE.Color(pColor);
            c.r += (Math.random() - 0.5) * 0.03;
            c.g += (Math.random() - 0.5) * 0.03;
            c.b += (Math.random() - 0.5) * 0.03;
            const plankMat = new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0.1 });
            const plank = new THREE.Mesh(new THREE.BoxGeometry(plankW, plankH, plankD), plankMat);
            plank.position.set(i * (plankW + 0.02), -plankH / 2, 0);
            plank.position.y += (Math.random() - 0.5) * 0.004;
            plank.receiveShadow = true;
            floorGroup.add(plank);
        }

        const rugGroup = new THREE.Group();
        const rugBase = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.04, 2.4), new THREE.MeshStandardMaterial({ color: 0x8c2d2d, roughness: 1.0 }));
        rugBase.position.set(0, 0.01, -0.6);
        rugBase.receiveShadow = true;
        rugGroup.add(rugBase);
        const borderMat = new THREE.MeshStandardMaterial({ color: 0xebdcb9, roughness: 1.0 });
        const fringeL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.042, 2.4), borderMat);
        fringeL.position.set(-1.85, 0.01, -0.6);
        const fringeR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.042, 2.4), borderMat);

        async function openBookReader() {
            if (document.pointerLockElement) {
                document.exitPointerLock();
            }

            document.getElementById('book-overlay').classList.remove('hidden');
            
            if (!pdfDoc && !pdfLoading) {
                pdfLoading = true;
                document.getElementById('book-loading').classList.remove('hidden');
                try {
                    pdfDoc = await pdfjsLib.getDocument('book/thegreatgatsby.pdf').promise;
                    document.getElementById('book-total-pages').innerText = pdfDoc.numPages;
                    const savedPage = localStorage.getItem('gatsby_bookmark_page');
                    bookCurrentPage = savedPage ? parseInt(savedPage) : 1;
                    if (bookCurrentPage % 2 === 0) bookCurrentPage--; // Start on odd page for two-page spread
                } catch (e) {
                    console.error("PDF load error:", e);
                    addSystemMessage("Failed to load book PDF.");
                }
                document.getElementById('book-loading').classList.add('hidden');
                pdfLoading = false;
            }
            
            if (pdfDoc) renderBookPages();
        }

        async function renderBookPages() {
            if (!pdfDoc) return;
            document.getElementById('book-page-display').innerText = `${bookCurrentPage}-${Math.min(bookCurrentPage + 1, pdfDoc.numPages)}`;
            
            renderSinglePage(bookCurrentPage, 'book-canvas-left');
            if (bookCurrentPage + 1 <= pdfDoc.numPages) {
                document.getElementById('book-canvas-right').style.display = 'block';
                renderSinglePage(bookCurrentPage + 1, 'book-canvas-right');
            } else {
                document.getElementById('book-canvas-right').style.display = 'none';
            }
        }

        async function renderSinglePage(num, canvasId) {
            const page = await pdfDoc.getPage(num);
            const canvas = document.getElementById(canvasId);
            const context = canvas.getContext('2d');
            
            const viewport = page.getViewport({ scale: 1.5 });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: context,
                viewport: viewport
            };
            await page.render(renderContext).promise;
        }

        function closeBookReader() {
            isReadingBook = false;

        }

        function changeBookPage(delta) {
            if (!pdfDoc) return;
            let newPage = bookCurrentPage + delta;
            if (newPage < 1) newPage = 1;
            if (newPage > pdfDoc.numPages) return;
            
            bookCurrentPage = newPage;
            if (bookCurrentPage > 1 && bookCurrentPage % 2 === 0 && delta > 0) bookCurrentPage++; 
            if (bookCurrentPage > 1 && bookCurrentPage % 2 === 0 && delta < 0) bookCurrentPage--;
            
            renderBookPages();
            localStorage.setItem('gatsby_bookmark_page', bookCurrentPage);
        }

        async function loadModels() {
            try {
                const [gltf, animJson] = await Promise.all([
                    loader.loadAsync("model/character.gltf"),
                    fetch("animations.json").then(r => r.json())
                ]);
                charGltfMaster = gltf;
                animationsMaster = animJson.map(a => {
                    const tracks = a.tracks.map(t => {
                        const nodeName = t.nodeName || (t.name ? t.name.split('.')[0] : 'unknown');
                        const property = t.property || (t.name ? t.name.split('.')[1] : 'position');
                        return new THREE.KeyframeTrack(nodeName + '.' + property, t.times, t.values);
                    });
                    return new THREE.AnimationClip(a.name, a.duration, tracks);
                });
                setupLocalPlayer();

        function setupLocalPlayer() {
            const p = players[0];
            const mesh = charGltfMaster.scene.clone();
            mesh.scale.set(2.0, 2.0, 2.0);
            mesh.position.set(0, 0, 0);
            mesh.rotation.y = 0;
            scene.add(mesh);
            p.mesh = mesh;
            p.mixer = new THREE.AnimationMixer(mesh);
            p.actions = {};
            animationsMaster.forEach(clip => { p.actions[clip.name.toLowerCase()] = p.mixer.clipAction(clip); });
            mesh.traverse(o => {
                if (o.isMesh) {
                    o.castShadow = true;
                    o.receiveShadow = true;
                    o.material = createToonMaterial(o.material.map, p.color);
                }
            });
            updatePlayerVisuals(p);
        }

        function updatePlayerVisuals(p) {
            if (!p || !p.mesh) return;
            const firstPersonMode = (typeof isFirstPerson !== 'undefined') ? isFirstPerson : false;
            p.mesh.visible = !firstPersonMode;
            p.mesh.traverse((child) => {
                if (child.isMesh && child.material && child.material.uniforms) {
                    child.material.uniforms.color.value.setStyle(p.color);
                    const isCustomizingVal = !!p.isCustomizing;
                    child.material.uniforms.opacity.value = isCustomizingVal ? 0.75 : 1.0;
                    child.material.uniforms.isGreyscale.value = 0.0;
                    child.material.transparent = isCustomizingVal;
                    child.material.depthWrite = true;
                }
            });
        }

            if (!p.actions || !p.actions[name] || p.currentAnim === name) return;
            if (p.currentAnim && p.actions[p.currentAnim]) p.actions[p.currentAnim].fadeOut(0.25);
            p.actions[name].reset().fadeIn(0.25).play();
            p.currentAnim = name;

        function checkCollision(pos) {
            if (Math.abs(pos.x) > 3.7 || Math.abs(pos.z) > 3.7) return true;
            for (const c of colliders) {
                let dx = pos.x - c.x, dz = pos.z - c.z;
                if (c.rotY) {
                    const s = Math.sin(-c.rotY), cc = Math.cos(-c.rotY);
                    const nx = dx * cc - dz * s;
                    const nz = dx * s + dz * cc;
                    dx = nx; dz = nz;
                }
                if (Math.abs(dx) < c.w / 2 + 0.15 && Math.abs(dz) < c.d / 2 + 0.15) return true;
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.elapsedTime;

            if (fireBonusTime > 0) { fireBonusTime -= delta; fireIntensity = 1.8; } else { fireIntensity = 1.0; }
            fireLight.intensity = (2.0 + Math.sin(time * 8) * 0.4) * fireIntensity;
            flames.children.forEach(f => {
                const s = 0.6 + Math.sin(time * f.userData.speed + f.userData.phase) * 0.15;
                f.scale.set(s * fireIntensity, s * fireIntensity * 1.5, s * fireIntensity);
                f.material.opacity = (0.5 + Math.random() * 0.5) * fireIntensity;
                f.position.y = 0.4 + (f.scale.y - 0.5) * 0.1;
            });

            candlesFlames.forEach(cf => {
                cf.scale.setScalar(0.8 + Math.sin(time * 12 + cf.userData.phase) * 0.2);
            });

            embers.forEach(ember => {
                ember.userData.life -= delta * ember.userData.decay;
                if (ember.userData.life <= 0) {
                    resetEmber(ember);
                } else {
                    ember.position.x += ember.userData.vx * delta;
                    ember.position.y += ember.userData.vy * delta;
                    ember.position.z += ember.userData.vz * delta;
                    ember.material.opacity = ember.userData.life;
                    ember.scale.setScalar(ember.userData.life);
                    ember.position.x += Math.sin(time * 6 + ember.position.y) * 0.003;
                }
            });

            if (radioPlaying) {
                noteSpawnTimer += delta;
                if (noteSpawnTimer > 0.8) {
                    spawnNote();
                    noteSpawnTimer = 0;
                }
            }
            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                note.userData.life -= delta * note.userData.decay;
                if (note.userData.life <= 0) {
                    scene.remove(note);
                    notes.splice(i, 1);
                } else {
                    note.position.x += note.userData.vx * delta;
                    note.position.y += note.userData.vy * delta;
                    note.position.z += note.userData.vz * delta;
                    note.material.opacity = note.userData.life;
                    note.scale.setScalar(note.userData.life * (1.0 + Math.sin(time * 10) * 0.2));
                }
            }

            const positions = snowParticles.geometry.attributes.position.array;
            for (let i = 0; i < snowCount; i++) {
                positions[i * 3] += snowVel[i].x * delta;
                positions[i * 3 + 1] += snowVel[i].y * delta;
                positions[i * 3 + 2] += snowVel[i].z * delta;
                
                const px = positions[i * 3];
                const py = positions[i * 3 + 1];
                const pz = positions[i * 3 + 2];
                if (Math.abs(px) < 3.8 && Math.abs(pz) < 3.8) {
                    const roofHeight = 4.7 - 0.82 * Math.abs(px);
                    if (py < roofHeight) {
                        positions[i * 3 + 1] = -1;
                    }
                }

                if (positions[i * 3 + 1] < 0 || positions[i * 3] < -12) {
                    positions[i * 3] = -12 + Math.random() * 24;
                    positions[i * 3 + 2] = -12 + Math.random() * 24;
                    positions[i * 3 + 1] = 8;
                }
            }
            snowParticles.geometry.attributes.position.needsUpdate = true;

            const p = players[0];
            if (!p.mesh || isPaused) {
                renderer.render(scene, camera);
                return;
            }

            if (isCustomizing) {
                if (p.mixer) p.mixer.update(delta);
                playAnim(p, 'idle');
                if (targetCameraPos) {
                    camera.position.lerp(targetCameraPos, 0.05);
                    if (camera.position.distanceTo(targetCameraPos) < 0.02) targetCameraPos = null;
                }
                if (targetControlsTarget) {
                    controls.target.lerp(targetControlsTarget, 0.05);
                    if (controls.target.distanceTo(targetControlsTarget) < 0.02) targetControlsTarget = null;
                }
                controls.update();
                renderer.render(scene, camera);
                return;
            }

            let nearInteraction = null;
            interactions.forEach(inter => { if (Math.hypot(p.mesh.position.x - inter.x, p.mesh.position.z - inter.z) < inter.range) nearInteraction = inter; });
            let nearSeat = null;
            seatSpots.forEach(seat => { if (Math.hypot(p.mesh.position.x - seat.x, p.mesh.position.z - seat.z) < 0.95) nearSeat = seat; });

            const prompt = document.getElementById('interaction-prompt');
            if (nearInteraction || nearSeat) {
                prompt.style.display = 'block';
                let text = "Press E to Sit";
                if (isSitting) {
                    text = "Press E to Stand";
                } else if (nearInteraction) {
                    if (nearInteraction.type === 'Radio') {
                        text = radioPlaying ? "Press E to Turn Off Radio" : "Press E to Turn On Radio";
                    } else if (nearInteraction.type === 'Book') {
                        text = "Press E to Read The Great Gatsby";
                    } else {
                        text = "Press E to Add Log";
                    }
                }
                prompt.innerText = text;
            } else { prompt.style.display = 'none'; }

            let baseStandingY = 0;
            if (Math.abs(p.mesh.position.x) < 0.7 && Math.abs(p.mesh.position.z - (-0.8)) < 0.4) {
                baseStandingY = 0.49;
            }

            if (!isSitting) {
                let dx = 0, dz = 0;
                if (p.keys.up) dz -= 1; if (p.keys.down) dz += 1;
                if (p.keys.left) dx -= 1; if (p.keys.right) dx += 1;

                if (dx !== 0 || dz !== 0) {
                    const camF = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); camF.y = 0; camF.normalize();
                    const camR = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); camR.y = 0; camR.normalize();
                    const moveDir = new THREE.Vector3().addScaledVector(camF, -dz).addScaledVector(camR, dx).normalize();
                    const speed = p.keys.shift ? 4.2 : 2.2;
                    const nextPos = p.mesh.position.clone().addScaledVector(moveDir, speed * delta);
                    
                    if (!checkCollision(nextPos)) { p.mesh.position.copy(nextPos); } else {
                        const nextX = p.mesh.position.clone().add(new THREE.Vector3(moveDir.x * speed * delta, 0, 0));
                        if (!checkCollision(nextX)) p.mesh.position.copy(nextX);
                        const nextZ = p.mesh.position.clone().add(new THREE.Vector3(0, 0, moveDir.z * speed * delta));
                        if (!checkCollision(nextZ)) p.mesh.position.copy(nextZ);
                    }
                    const targetRot = Math.atan2(moveDir.x, moveDir.z) + Math.PI;
                    let diff = targetRot - p.mesh.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    p.mesh.rotation.y += diff * 0.15;
                }
                if (p.keys.space && !p.isJumping) { p.isJumping = true; p.yVelocity = 3.6; }
                if (p.isJumping) {
                    p.yVelocity -= 10.0 * delta; p.mesh.position.y += p.yVelocity * delta;
                    if (p.mesh.position.y <= baseStandingY) { p.mesh.position.y = baseStandingY; p.isJumping = false; p.yVelocity = 0; }
                } else {
                    p.mesh.position.y = THREE.MathUtils.lerp(p.mesh.position.y, baseStandingY, 0.15);
                }
                if (p.mixer) {
                    p.mixer.update(delta);
                    if (p.isJumping) { clearEmote(p); playAnim(p, 'jump'); }
                    else if (dx !== 0 || dz !== 0) { clearEmote(p); playAnim(p, p.keys.shift ? 'sprint' : 'stomp'); }
                    else if (p.keys.squat) playAnim(p, 'squat');
                    else if (p.isEmoting) { }
                    else playAnim(p, 'idle');
                }
            } else {
                if (p.mixer) p.mixer.update(delta);
                playAnim(p, 'sit');
                if (isFirstPerson && p.currentSeatType === 'BeanBag') {
                    p.mesh.rotation.y = fpYaw + Math.PI;
                }
            }

            if (targetCameraPos) {
                camera.position.lerp(targetCameraPos, 0.04);
                if (camera.position.distanceTo(targetCameraPos) < 0.04) {
                    camera.position.copy(targetCameraPos);
                    targetCameraPos = null;
                }
            }
            if (targetControlsTarget) {
                controls.target.lerp(targetControlsTarget, 0.04);
                if (controls.target.distanceTo(targetControlsTarget) < 0.04) {
                    controls.target.copy(targetControlsTarget);
                    targetControlsTarget = null;
                }
            }

            if (isFirstPerson) {
                camera.position.copy(p.mesh.position).add(new THREE.Vector3(0, 0.65, 0));
                camera.quaternion.setFromEuler(new THREE.Euler(fpPitch, fpYaw, 0, 'YXZ'));
                controls.enabled = false;
            } else {
                controls.enabled = true;
                if (!targetCameraPos) {
                    const target = p.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0));
                    controls.target.lerp(target, 0.1);
                }
                controls.update();
                const camPad = 0.25;
                camera.position.x = THREE.MathUtils.clamp(camera.position.x, -3.8 + camPad, 3.8 - camPad);
                camera.position.z = THREE.MathUtils.clamp(camera.position.z, -3.8 + camPad, 3.8 - camPad);
                const maxCeilingY = 4.68 - 0.82 * Math.abs(camera.position.x) - camPad;
                camera.position.y = THREE.MathUtils.clamp(camera.position.y, 0.15 + camPad, maxCeilingY);
            }

            updateSpeechBubble();
            renderer.render(scene, camera);
        }

        function toggleSit() {
            const p = players[0];
            if (isSitting) {
                isSitting = false;
                p.mesh.position.y = 0;
                if (p.currentSeatType === 'Couch') {
                    p.mesh.position.set(p.mesh.position.x, 0, -1.5);
                } else if (p.currentSeatType === 'BeanBag') {
                    const bx = p.mesh.position.x;
                    const bz = p.mesh.position.z;
                    const stepDir = bx > 0 ? -1 : 1;
                    p.mesh.position.set(bx + stepDir * 1.1, 0, bz);
                }
                showSpeechBubble("Back on my feet.");
            } else {
                let closestSeat = null;
                let minDistance = Infinity;
                seatSpots.forEach(seat => {
                    const dist = Math.hypot(p.mesh.position.x - seat.x, p.mesh.position.z - seat.z);
                    if (dist < 0.95 && dist < minDistance) {
                        closestSeat = seat;
                        minDistance = dist;
                    }
                });
                if (closestSeat) {
                    isSitting = true;
                    p.currentSeatType = closestSeat.type;
                    p.mesh.position.set(closestSeat.x, closestSeat.y, closestSeat.z);
                    if (closestSeat.rotY !== undefined) p.mesh.rotation.y = closestSeat.rotY + Math.PI;
                    showSpeechBubble("Ah, comfy.");
                }
            }
        }

        function toggleRadio() {
            radioPlaying = !radioPlaying;
            if (radioIndicatorLight) {
                radioIndicatorLight.material.color.setHex(radioPlaying ? 0x00ff00 : 0xff0000);
                radioIndicatorLight.material.needsUpdate = true;
            }
            if (radioPlaying) {
                playRadioMusic();
                addSystemMessage("Radio playing cozy lofi tunes...");
                showSpeechBubble("Playing some cozy tunes.");
            } else {
                stopRadioMusic();
                addSystemMessage("Radio turned off.");
                showSpeechBubble("Radio turned off.");
            }
        }

        function spawnEmbersFlurry() {
            embers.forEach(ember => {
                ember.position.set(
                    -3.6 + (Math.random() - 0.5) * 0.2,
                    0.4 + Math.random() * 0.1,
                    0 + (Math.random() - 0.5) * 0.4
                );
                ember.userData.vy = 1.2 + Math.random() * 1.6;
                ember.userData.vx = (Math.random() - 0.5) * 0.8;
                ember.userData.vz = (Math.random() - 0.5) * 0.8;
                ember.userData.life = 1.0;
                ember.material.opacity = 1.0;
            });
        }

        function showSpeechBubble(message) {
            const p = players[0];
            p.chatText = message;
            clearTimeout(p.chatTimeout);
            const bubble = document.getElementById('speech-bubble');
            bubble.innerText = message;
            bubble.style.display = 'block';
            bubble.classList.remove('fade-out');
            bubble.classList.add('visible');
            p.chatTimeout = setTimeout(() => {
                bubble.classList.remove('visible');
                bubble.classList.add('fade-out');
                setTimeout(() => {
                    p.chatText = null;
                    bubble.style.display = 'none';
                }, 300);
            }, 3500);
        }

        function addSystemMessage(text) {
            const logList = document.getElementById('chat-log-list');
            if (!logList) return;
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg chat-msg-system';
            msgDiv.innerText = text;
            logList.appendChild(msgDiv);
            logList.scrollTop = logList.scrollHeight;
            
            const panel = document.getElementById('chat-log-panel');
            if (panel) {
                panel.classList.add('opaque');
                clearTimeout(chatLogTimeout);
                chatLogTimeout = setTimeout(() => {
                    if (!chatFocused) panel.classList.remove('opaque');
                }, 4000);
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const logList = document.getElementById('chat-log-list');
            if (logList) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'chat-msg';
                msgDiv.innerHTML = `<span class="chat-msg-name" style="color: ${players[0].color}">${players[0].name}:</span> ${text}`;
                logList.appendChild(msgDiv);
                logList.scrollTop = logList.scrollHeight;
            }
            showSpeechBubble(text);
        }

        function updateSpeechBubble() {
            const p = players[0];
            const bubble = document.getElementById('speech-bubble');
            if (!p || !p.mesh || !p.chatText || !bubble) return;
            const tempV = new THREE.Vector3();
            p.mesh.getWorldPosition(tempV);
            tempV.y += 1.45;
            tempV.project(camera);
            if (tempV.z > 1.0) {
                bubble.style.display = 'none';
                return;
            }
            const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
            const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;
        }

        window.addEventListener('keydown', e => {
            if (isReadingBook) {
                if (e.key === 'Escape' || (e.key.toLowerCase() === 'e' && document.activeElement.tagName !== 'INPUT')) {
                    closeBookReader();
                    e.preventDefault();
                }
                return;
            }
            if (document.activeElement.tagName === 'INPUT') {
                if (e.key === 'Enter') {
                    if (document.activeElement.id === 'chat-input') {
                        sendChatMessage();
                    }
                    document.activeElement.blur();
                }
                return;
            }
            const k = e.key.toLowerCase(), p = players[0];
            if (k === 'w') p.keys.up = true;
            if (k === 's') p.keys.down = true;
            if (k === 'a') p.keys.left = true;
            if (k === 'd') p.keys.right = true;
            if (k === ' ') p.keys.space = true;
            if (e.shiftKey) p.keys.shift = true;
            if (k === 'q') p.keys.squat = true;
            if (k === 'v') {
                isFirstPerson = !isFirstPerson;
                if (isFirstPerson) renderer.domElement.requestPointerLock(); else document.exitPointerLock();
                p.mesh.visible = !isFirstPerson;
                document.getElementById('cam-mode-indicator').innerText = isFirstPerson ? "📽 FIRST PERSON — Press V for Third Person" : "📽 THIRD PERSON — Press V for First Person";
            }
            if (k === 'e') {
                if (Math.hypot(p.mesh.position.x - (-3.0), p.mesh.position.z - 1.2) < 0.8) {
                    fireBonusTime = 120;
                    spawnEmbersFlurry();
                    addSystemMessage("Added a log to the fireplace. Cozy!");
                    showSpeechBubble("Warmth +1!");
                } else if (Math.hypot(p.mesh.position.x - 1.5, p.mesh.position.z - 2.1) < 0.9) {
                    toggleRadio();
                } else if (Math.hypot(p.mesh.position.x - 0.25, p.mesh.position.z - (-0.9)) < 0.7) {
                    openBookReader();
                } else {
                    toggleSit();
                }
            }
            const emoteMap = { '1': ['pushup', '💪 Pushup!'], '2': ['situp', '🔥 Situp!'], '3': ['jumpingjack', '⭐ Jumping Jacks!'], '4': ['plank', '😤 Planking...'], '5': ['highknees', '🏃 High Knees!'] };
            if (emoteMap[k] && !isSitting) {
                const [emoteName, emoteMsg] = emoteMap[k];
                if (p.isEmoting && p.currentAnim === emoteName) {
                    clearEmote(p);
                } else {
                    playEmote(p, emoteName, emoteMsg);
                }
            }
            if (e.key === 'Escape') {
                isPaused = !isPaused;
                document.getElementById('pause-overlay').classList.toggle('hidden', !isPaused);
            }
        });

        window.addEventListener('keyup', e => {
            if (document.activeElement.tagName === 'INPUT') return;
            const k = e.key.toLowerCase(), p = players[0];
            if (k === 'w') p.keys.up = false;
            if (k === 's') p.keys.down = false;
            if (k === 'a') p.keys.left = false;
            if (k === 'd') p.keys.right = false;
            if (k === ' ') p.keys.space = false;
            if (!e.shiftKey) p.keys.shift = false;
            if (k === 'q') p.keys.squat = false;
        });

        document.addEventListener('mousemove', e => {
            if (isFirstPerson && document.pointerLockElement === renderer.domElement) {
                fpYaw -= e.movementX * 0.0025;
                fpPitch -= e.movementY * 0.0025;
                fpPitch = Math.max(-Math.PI / 2 + 0.15, Math.min(Math.PI / 2 - 0.15, fpPitch));
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            const p = players[0];
            p.color = document.querySelector('.color-btn.active').dataset.color;
            p.name = document.getElementById('custom-name-input').value.trim() || "Lumberjack";
            p.isCustomizing = false;
            isCustomizing = false;
            updatePlayerVisuals(p);
            p.mesh.position.set(0, 0, 2.2);

            targetCameraPos = new THREE.Vector3(0, 2.5, 5.0);
            targetControlsTarget = new THREE.Vector3(0, 0.5, 0);

            document.getElementById('customization-overlay').classList.add('hidden');
            if (stormSound.buffer) stormSound.play();
            addSystemMessage(`Welcome to The Cabin, ${p.name}!`);
        });

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (players[0] && players[0].mesh) {
                    players[0].color = btn.dataset.color;
                    updatePlayerVisuals(players[0]);
                }
            });
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            isPaused = false;
            document.getElementById('pause-overlay').classList.add('hidden');
        });

        document.getElementById('back-btn').addEventListener('click', () => {
            const fade = document.getElementById('fade-overlay');
            fade.classList.remove('fade-out-active');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        });

        document.getElementById('chat-send-btn').addEventListener('click', sendChatMessage);

        const chatInputEl = document.getElementById('chat-input');
        const chatLogPanelEl = document.getElementById('chat-log-panel');
        chatInputEl.addEventListener('focus', () => {
            chatFocused = true;
            chatLogPanelEl.classList.add('opaque');
        });
        chatInputEl.addEventListener('blur', () => {
            chatFocused = false;
            chatLogPanelEl.classList.remove('opaque');
        });

        const controlsPanel = document.querySelector('.controls-panel');
        const controlsTabBtn = document.getElementById('controls-tab-btn');
        document.getElementById('controls-close-btn').addEventListener('click', () => {
            controlsPanel.classList.add('collapsed');
            controlsTabBtn.classList.add('visible');
        });
        controlsTabBtn.addEventListener('click', () => {
            controlsPanel.classList.remove('collapsed');
            controlsTabBtn.classList.remove('visible');
        });

        let systemVolumeMuted = false;
        document.getElementById('mute-btn').addEventListener('click', () => {
            systemVolumeMuted = !systemVolumeMuted;
            if (systemVolumeMuted) {
                stormSound.setVolume(0);
                audioMuted = true;
                if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
                if (radioAudio) radioAudio.volume = 0;
                document.getElementById('mute-btn').innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            } else {
                stormSound.setVolume(0.20);
                audioMuted = false;
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if (radioAudio) radioAudio.volume = 0.3;
                document.getElementById('mute-btn').innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        });

        window.addEventListener('load', () => {
            const fade = document.getElementById('fade-overlay');
            setTimeout(() => {
                fade.classList.add('fade-out-active');
            }, 100);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loadModels();
    </script>
</body>
